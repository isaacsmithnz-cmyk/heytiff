from title block\n    const textContent=await page.getTextContent();\n    const text=textContent.items.map(t=>t.str).join(' ').toLowerCase();\n\n    // Score each candidate label by how many times it appears on THIS page.\n    const planKeywords=[\n      'lower ground floor','upper ground floor','ground floor','lower ground','upper ground',\n      'first floor','second floor','third floor','fourth floor',\n      'level 1','level 2','level 3','level 4','level 5',\n      'basement','mezzanine','roof plan','roof',\n      'site plan','location plan','floor plan'\n    ];\n    const generic=new Set(['floor plan','site plan','location plan','roof']);\n    let best=null, bestScore=0;\n    for(const kw of planKeywords){\n      let n=0, idx=0;\n      while((idx=text.indexOf(kw, idx))!==-1){ n++; idx+=kw.length; }\n      if(!n) continue;\n      const score=n*(generic.has(kw)?1:3);\n      if(score>bestScore){ bestScore=score; best=kw; }\n    }\n    const globalIdx=window._pdfPages.length;\n    const sheetLabel=best ? best.replace(/\\b\\w/g,c=>c.toUpperCase()) : `Page ${globalIdx+1}`;\n\n    // Thumbnail — 0.5 scale for clear readability\n    const vpThumb=page.getViewport({scale:0.5});\n    const thumbCanvas=document.createElement('canvas');\n    thumbCanvas.width=vpThumb.width;\n    thumbCanvas.height=vpThumb.height;\n    await page.render({canvasContext:thumbCanvas.getContext('2d'),viewport:vpThumb}).promise;\n\n    // Full-res for floor use\n    const vpFull=page.getViewport({scale:2});\n    const fullCanvas=document.createElement('canvas');\n    fullCanvas.width=vpFull.width; fullCanvas.height=vpFull.height;\n    await page.render({canvasContext:fullCanvas.getContext('2d'),viewport:vpFull}).promise;\n\n    appendPageThumb(fullCanvas.toDataURL(), thumbCanvas, sheetLabel, file.name||'PDF');\n  }\n  return numPages;\n}\n\n// Append one page (PDF page or image) into the picker grid + global arrays.\nfunction appendPageThumb(fullDataUrl, thumbSource, label, srcFile){\n  const grid=document.getElementById('page-grid');\n  const idx=window._pdfPages.length;\n  window._pdfPages[idx]=fullDataUrl;\n  window._pdfPageLabels[idx]=label;\n  if(!window._pdfPageFiles) window._pdfPageFiles=[];\n  window._pdfPageFiles[idx]=srcFile||'Uploaded plan';\n\n  const thumb=document.createElement('div');\n  thumb.className='page-thumb';\n  thumb.dataset.page=idx;\n  thumb.dataset.label=label;\n  thumb.dataset.file=srcFile||'Uploaded plan';\n\n  const clonedCanvas=document.createElement('canvas');\n  clonedCanvas.width=thumbSource.width;\n  clonedCanvas.height=thumbSource.height;\n  clonedCanvas.getContext('2d').drawImage(thumbSource,0,0);\n  clonedCanvas.className='page-thumb-img';\n\n  const labelDiv=document.createElement('div');\n  labelDiv.className='page-label';\n  labelDiv.innerHTML=`<div style=\"font-weight:600\">${label}<\u002Fdiv><div class=\"page-num\">Page ${idx+1}<\u002Fdiv>`;\n\n  const checkDiv=document.createElement('div');\n  checkDiv.className='check';\n  checkDiv.innerHTML='<svg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M2 6l3 3 5-5\"/><\u002Fsvg>';\n\n  const previewBtn=document.createElement('button');\n  previewBtn.className='preview-btn';\n  previewBtn.title='Preview full size';\n  previewBtn.innerHTML='<svg viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><circle cx=\"6\" cy=\"6\" r=\"4\"/><path d=\"M9 9l3 3\"/><path d=\"M4 6h4M6 4v4\"/><\u002Fsvg>';\n  previewBtn.onclick=(e)=>{e.stopPropagation();openLightbox(idx);};\n\n  thumb.appendChild(clonedCanvas);\n  thumb.appendChild(checkDiv);\n  thumb.appendChild(previewBtn);\n  thumb.appendChild(labelDiv);\n  thumb.onclick=()=>togglePage(thumb);\n  grid.appendChild(thumb);\n}\n\n// De-duplicate labels shared across pages → demote to neutral \"Page N\".\nfunction dedupePageLabels(){\n  const grid=document.getElementById('page-grid');\n  const counts={};\n  window._pdfPageLabels.forEach(l=>{ if(l && !l.startsWith('Page ')) counts[l]=(counts[l]||0)+1; });\n  window._pdfPageLabels=window._pdfPageLabels.map((l,idx)=>{\n    const demoted=(l && counts[l]>1) ? `Page ${idx+1}` : l;\n    const thumb=grid.querySelector(`.page-thumb[data-page=\"${idx}\"]`);\n    if(thumb){\n      thumb.dataset.label=demoted;\n      const t=thumb.querySelector('.page-label > div:first-child');\n      if(t) t.textContent=demoted;\n    }\n    return demoted;\n  });\n}\n\nfunction loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}\n\nfunction togglePage(thumb){\n  thumb.classList.toggle('selected');\n  updatePageCount();\n  buildFloorAllocFromSelection();\n}\n\nfunction selectAllPages(select){\n  document.querySelectorAll('.page-thumb').forEach(t=>t.classList.toggle('selected',select));\n  updatePageCount();\n  buildFloorAllocFromSelection();\n}\n\nfunction updatePageCount(){\n  const n=document.querySelectorAll('.page-thumb.selected').length;\n  document.getElementById('page-count-badge').textContent=n+' selected';\n  const imp=document.getElementById('pp-import');\n  if(imp){ imp.disabled = n===0; imp.textContent = n===0 ? 'Import pages →' : `Import ${n} page${n===1?'':'s'} →`; }\n  const hint=document.getElementById('pp-hint');\n  if(hint){ hint.textContent = n===0 ? 'No pages selected' : `${n} page${n===1?'':'s'} will be imported as floor${n===1?'':'s'}`; }\n}\n\n// ── Liquid modal close: play exit animation, then hide ──\nfunction _modalClose(el){\n  if(!el) return;\n  if(!el.classList.contains('show')){ el.classList.remove('closing'); return; }\n  if(el.classList.contains('closing')) return;\n  el.classList.add('closing');\n  const fin=(e)=>{\n    if(e && e.target!==el) return; // ignore child animation bubbling\n    // If a reopen cleared 'closing', this is a stale callback — do NOT hide.\n    if(!el.classList.contains('closing')){ el.removeEventListener('animationend',fin); clearTimeout(t); return; }\n    el.classList.remove('show','closing');\n    el.removeEventListener('animationend',fin);\n    clearTimeout(t);\n  };\n  const t=setTimeout(fin,360);\n  el.addEventListener('animationend',fin);\n}\n\n// ── Page picker modal ──\nfunction openPagePicker(){\n  const m=document.getElementById('page-picker-modal'); m.classList.remove('closing'); m.classList.add('show');\n}\nfunction cancelPagePicker(){\n  _modalClose(document.getElementById('page-picker-modal'));\n}\nfunction confirmPagePicker(){\n  const n=document.querySelectorAll('.page-thumb.selected').length;\n  if(!n){ notify('Select at least one page','warn'); return; }\n  const append=!!window._pickerAppendFloors;\n  buildFloorAllocFromSelection(append);\n  window._pickerAppendFloors=false;\n  cancelPagePicker();\n  notify(`${n} page${n===1?'':'s'} ${append?'added':'imported'}`,'ok');\n}\nfunction reopenPagePicker(){\n  if(!window._pdfPages || !window._pdfPages.length){ notify('No PDF loaded — upload plans first','warn'); return; }\n  openPagePicker();\n}\n\n// ── Lightbox ──\nlet _lbPage=0;\nfunction openLightbox(pageIdx){\n  _lbPage=pageIdx;\n  renderLightboxPage();\n  const _lb=document.getElementById('pdf-lightbox'); _lb.classList.remove('closing'); _lb.classList.add('show');\n}\n\nasync function renderLightboxPage(){\n  const total=window._pdfPages?.length||0;\n  if(!total) return;\n  const lbCanvas=document.getElementById('lb-canvas');\n  document.getElementById('lb-info').textContent=\n    `${window._pdfPageLabels[_lbPage]||'Page '+(_lbPage+1)} · ${_lbPage+1} of ${total}`;\n\n  // Render the stored full-res page image (works for PDF pages and images)\n  const dataUrl=window._pdfPages[_lbPage];\n  if(dataUrl){\n    await new Promise(res=>{\n      const img=new Image();\n      img.onload=()=>{\n        lbCanvas.width=img.width; lbCanvas.height=img.height;\n        const maxW=window.innerWidth*0.88;\n        const maxH=window.innerHeight*0.78;\n        const s=Math.min(maxW/img.width, maxH/img.height, 1);\n        lbCanvas.style.width=(img.width*s)+'px';\n        lbCanvas.style.height=(img.height*s)+'px';\n        lbCanvas.getContext('2d').drawImage(img,0,0);\n        res();\n      };\n      img.onerror=res;\n      img.src=dataUrl;\n    });\n  }\n\n  // Update select button state\n  const thumb=document.querySelector(`.page-thumb[data-page=\"${_lbPage}\"]`);\n  const isSelected=thumb?.classList.contains('selected');\n  const btn=document.getElementById('lb-select');\n  btn.textContent=isSelected?'✓ Selected — click to deselect':'+ Select this page';\n  btn.style.background=isSelected?'#059669':'var(--ssx-accent)';\n}\n\nfunction lightboxNav(dir){\n  const total=window._pdfPages?.length||0;\n  _lbPage=(_lbPage+dir+total)%total;\n  renderLightboxPage();\n}\n\nfunction lightboxToggleSelect(){\n  const thumb=document.querySelector(`.page-thumb[data-page=\"${_lbPage}\"]`);\n  if(thumb){togglePage(thumb);renderLightboxPage();}\n}\n\nfunction closeLightbox(){\n  _modalClose(document.getElementById('pdf-lightbox'));\n}\n\nfunction buildFloorAllocFromSelection(appendMode){\n  const selected=[...document.querySelectorAll('.page-thumb.selected')].map(t=>parseInt(t.dataset.page));\n  // Use AI-assigned label if available, else auto-name by position\n  const floorNames=['Ground floor','Level 1','Level 2','Level 3','Level 4','Roof','Basement'];\n  const base = appendMode ? state.floors.length : 0;\n  const newFloors=selected.map((pageIdx,i)=>{\n    const aiLabel=window._pdfPageLabels?.[pageIdx];\n    // Only use AI label if it's meaningful (not just \"Page N\")\n    const name=(aiLabel&&!aiLabel.startsWith('Page '))?aiLabel:(floorNames[base+i]||`Floor ${base+i+1}`);\n    return {id:base+i+1, name, imageData:window._pdfPages?.[pageIdx]||null, pageIndex:pageIdx, srcFile:window._pdfPageFiles?.[pageIdx]||'Uploaded plan'};\n  });\n  state.floors = appendMode ? state.floors.concat(newFloors) : newFloors;\n  if(state.floors.length>0) showFloorAlloc();\n}\n\n// ── AI Page Analysis ─────────────────────────────────────────────────\nasync function analyseWithAI(){\n  const thumbs=[...document.querySelectorAll('.page-thumb')];\n  if(!thumbs.length){ notify('Upload a PDF first','warn'); return; }\n\n  const btn=document.getElementById('ai-analyse-btn');\n  const statusBar=document.getElementById('ai-status-bar');\n  const statusText=document.getElementById('ai-status-text');\n  const statusCount=document.getElementById('ai-status-count');\n\n  btn.disabled=true;\n  btn.textContent='Analysing…';\n  statusBar.style.display='flex';\n  statusText.textContent='Sending pages to Claude Sonnet…';\n\n  const total=thumbs.length;\n  let done=0;\n  let totalInputTokens=0;\n  let totalOutputTokens=0;\n\n  // Process in batches of 4 for speed\n  const BATCH=4;\n  const results=new Array(total);\n\n  async function analysePage(idx){\n    const thumb=thumbs[idx];\n    const pageIdx=parseInt(thumb.dataset.page);\n\n    // Get thumbnail canvas data URL (already rendered at 0.5x)\n    const canvas=thumb.querySelector('canvas');\n    if(!canvas) return;\n    const dataUrl=canvas.toDataURL('image/jpeg',0.85);\n    const base64=dataUrl.split(',')[1];\n\n    try {\n      const response=await fetch('https://api.anthropic.com/v1/messages',{\n        method:'POST',\n        headers:{'Content-Type':'application/json'},\n        body:JSON.stringify({\n          model:'claude-sonnet-4-20250514',\n          max_tokens:120,\n          messages:[{\n            role:'user',\n            content:[\n              {\n                type:'image',\n                source:{type:'base64', media_type:'image/jpeg', data:base64}\n              },\n              {\n                type:'text',\n                text:`You are reviewing a page from a set of architectural drawings. \nLook at this page and respond with ONLY a JSON object — no other text, no markdown:\n{\n  \"label\": \"short name for this page e.g. Ground Floor Plan, Level 1 Plan, Site Analysis, South Elevation, Section A-A, Cover Sheet\",\n  \"is_floor_plan\": true or false,\n  \"reason\": \"one short phrase\"\n}\nis_floor_plan should be true only for pages showing interior room layouts from above (floor plans). \nFalse for: site plans, elevations, sections, shadows, 3D views, cover sheets, schedules, details.`\n              }\n            ]\n          }]\n        })\n      });\n\n      const data=await response.json();\n\n      // Accumulate token usage from API response\n      if(data.usage){\n        totalInputTokens  += data.usage.input_tokens  || 0;\n        totalOutputTokens += data.usage.output_tokens || 0;\n      }\n\n      const text=data.content?.[0]?.text||'{}';\n      // Strip any accidental markdown fences\n      const clean=text.replace(/```json|```/g,'').trim();\n      const result=JSON.parse(clean);\n\n      results[idx]=result;\n      window._pdfPageLabels[pageIdx]=result.label||window._pdfPageLabels[pageIdx];\n\n      // Update thumbnail label live\n      const labelDiv=thumb.querySelector('.page-label div');\n      if(labelDiv) labelDiv.textContent=result.label||`Page ${pageIdx+1}`;\n\n      // Add type badge to thumbnail\n      const existing=thumb.querySelector('.ai-badge');\n      if(existing) existing.remove();\n      const badge=document.createElement('div');\n      badge.className='ai-badge';\n      badge.style.cssText=`position:absolute;top:8px;left:8px;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;font-family:var(--ssx-head);letter-spacing:.04em;${result.is_floor_plan?'background:var(--ssx-ok);color:#fff':'background:rgba(0,0,0,0.45);color:rgba(255,255,255,0.8)'}`;\n      badge.textContent=result.is_floor_plan?'FLOOR PLAN':'SKIP';\n      thumb.appendChild(badge);\n\n      // Auto-select floor plans, deselect others\n      thumb.classList.toggle('selected', !!result.is_floor_plan);\n\n    } catch(e){\n      console.warn('AI analysis failed for page',pageIdx,e);\n      results[idx]={label:window._pdfPageLabels[pageIdx], is_floor_plan:false};\n    }\n\n    done++;\n    statusCount.textContent=`${done} / ${total}`;\n    statusText.textContent=done<total?`Analysing page ${done+1} of ${total}…`:'Done';\n  }\n\n  // Run in batches\n  for(let i=0;i<total;i+=BATCH){\n    const batch=[];\n    for(let j=i;j<Math.min(i+BATCH,total);j++) batch.push(analysePage(j));\n    await Promise.all(batch);\n  }\n\n  // Done — calculate and display cost\n  updatePageCount();\n  buildFloorAllocFromSelection();\n\n  // Claude Sonnet 4 pricing (USD per 1M tokens)\n  const INPUT_RATE  = 3.00;\n  const OUTPUT_RATE = 15.00;\n  const inputCost   = (totalInputTokens  / 1_000_000) * INPUT_RATE;\n  const outputCost  = (totalOutputTokens / 1_000_000) * OUTPUT_RATE;\n  const totalCost   = inputCost + outputCost;\n  const floorCount  = results.filter(r=>r?.is_floor_plan).length;\n\n  // Format cost — show at least 4 decimal places so it's not $0.00\n  const fmtCost = totalCost < 0.01\n    ? `$${totalCost.toFixed(4)}`\n    : `$${totalCost.toFixed(3)}`;\n\n  const spinner=document.getElementById('ai-status-spinner');\n  spinner.style.display='none';\n\n  statusText.innerHTML=`\n    <span style=\"color:var(--ssx-ok);font-weight:600\">✓ Done<\u002Fspan>\n    &nbsp;·&nbsp; ${floorCount} floor plan${floorCount!==1?'s':''} identified\n    &nbsp;·&nbsp;\n    <span style=\"font-family:var(--ssx-mono)\">\n      ${totalInputTokens.toLocaleString()} in / ${totalOutputTokens.toLocaleString()} out\n    <\u002Fspan>\n    &nbsp;·&nbsp;\n    <span style=\"font-family:var(--ssx-mono);color:var(--ssx-accent);font-weight:600\">${fmtCost} USD<\u002Fspan>\n    <span style=\"color:var(--ssx-faint);font-size:11px\">&nbsp;(Sonnet 4 · $3/$15 per 1M)<\u002Fspan>\n  `;\n  statusCount.textContent='';\n\n  btn.disabled=false;\n  btn.innerHTML='<svg width=\"13\" height=\"13\" viewBox=\"0 0 13 13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M2 7l3 3 6-6\"/><\u002Fsvg> Re-analyse';\n  notify(`${floorCount} floor plans found · ${fmtCost} USD`,'ok');\n}\n\n// ── AI Room Analysis ─────────────────────────────────────────────────\n\nfunction showFloorAlloc(){\n  const alloc=document.getElementById('floor-alloc');\n  alloc.style.display='block';\n  // Hide the upload dropzone once pages exist — Edit pages reopens the picker\n  const uc=document.getElementById('upload-card');\n  if(uc) uc.style.display = state.floors.length ? 'none' : 'block';\n  renderFloorList();\n}\n\nfunction renderFloorList(){\n  const list=document.getElementById('floor-list');\n  list.innerHTML='';\n\n  // Group floors by their source file. Each file becomes its own card.\n  // Blank / manually-added floors (no srcFile) group under \"Manual floors\".\n  const groups=[];\n  const byKey={};\n  state.floors.forEach((floor,i)=>{\n    const key=floor.srcFile || 'Manual floors';\n    if(!byKey[key]){ byKey[key]={key, items:[]}; byKey[key]._g=groups.push(byKey[key])-1; }\n    byKey[key].items.push({floor,i});\n  });\n\n  groups.forEach((group,gi)=>{\n    const card=document.createElement('div');\n    card.className='floor-file-card';\n    card.style.animationDelay=(gi*0.07)+'s';\n\n    const head=document.createElement('div');\n    head.className='floor-file-head';\n    const isManual = group.key==='Manual floors';\n    head.innerHTML=`\n      <div class=\"floor-file-name\" title=\"${group.key}\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          ${isManual\n            ? '<rect x=\"2\" y=\"2\" width=\"10\" height=\"10\" rx=\"1.5\"/><path d=\"M5 7h4M7 5v4\"/>'\n            : '<path d=\"M3 1.5h5l3 3V12a.5.5 0 0 1-.5.5h-7A.5.5 0 0 1 3 12V2a.5.5 0 0 1 .5-.5z\"/><path d=\"M8 1.5V4.5h3\"/>'}\n        <\u002Fsvg>\n        <span>${group.key}<\u002Fspan>\n        <span class=\"floor-file-count\">${group.items.length} page${group.items.length===1?'':'s'}<\u002Fspan>\n      <\u002Fdiv>\n      ${isManual ? '' : '<button class=\"btn btn-sm btn-secondary floor-file-edit\" style=\"flex-shrink:0\">Edit pages<\u002Fbutton>'}\n    `;\n    if(!isManual){\n      head.querySelector('.floor-file-edit').onclick=()=>reopenPagePicker();\n    }\n    card.appendChild(head);\n\n    const body=document.createElement('div');\n    body.className='floor-file-body';\n    group.items.forEach(({floor,i},ti)=>{\n      const tile=document.createElement('div');\n      tile.className='page-tile';\n      tile.style.animationDelay=(ti*0.05)+'s';\n\n      const wrap=document.createElement('div');\n      wrap.className='page-tile-img';\n      wrap.title='Name & allocate this page';\n      wrap.onclick=()=>openAllocate(group.key, i);\n      if(floor.imageData){\n        const img=document.createElement('img');\n        img.src=floor.imageData;\n        wrap.appendChild(img);\n      } else {\n        const bk=document.createElement('div');\n        bk.className='page-tile-blank';\n        bk.textContent='Blank page';\n        wrap.appendChild(bk);\n      }\n      if(floor.level){\n        const lv=document.createElement('span');\n        lv.className='page-tile-lvl';\n        lv.textContent=floor.level;\n        wrap.appendChild(lv);\n      }\n      const del=document.createElement('button');\n      del.className='page-tile-x';\n      del.innerHTML='✕';\n      del.title='Remove page';\n      del.onclick=(e)=>{e.stopPropagation();state.floors.splice(i,1);renderFloorList();};\n      wrap.appendChild(del);\n\n      tile.appendChild(wrap);\n      body.appendChild(tile);\n    });\n    card.appendChild(body);\n    list.appendChild(card);\n  });\n  updatePlansCta();\n}\n\nfunction addBlankFloor(){\n  state.floors.push({id:Date.now(),name:`Floor ${state.floors.length+1}`,imageData:null,pageIndex:-1});\n  renderFloorList();\n}\n\n// Update the Plans footer CTA: \"Name & allocate\" until every page has a level, then \"Continue to design\"\nfunction updatePlansCta(){\n  const cta=document.getElementById('plans-cta');\n  const skip=document.getElementById('plans-skip');\n  if(!cta) return;\n  const floors=state.floors||[];\n  const allAllocated = floors.length>0 && floors.every(f=>f.level);\n  if(allAllocated){\n    cta.textContent='Continue to design →';\n    cta.onclick=()=>goStep(2);\n    if(skip) skip.style.display='none';\n  } else {\n    cta.textContent='Name & allocate';\n    cta.onclick=()=>openAllocate(null);\n    if(skip) skip.style.display='';\n  }\n}\n\n// ── Name & allocate modal ─────────────────────────────────────────────\nconst FLOOR_PRESETS=['Basement','Lower Ground','Ground Floor','First Floor','Second Floor','Third Floor','Level 1','Level 2','Level 3','Roof'];\nconst ROOM_PRESETS=['Kitchen','Living Room','Lounge','Dining','Bedroom','Master Bedroom','Bathroom','Ensuite','Office / Study','Hallway','Plant Room','Garage','Utility','Open Plan'];\nconst LEVEL_OPTIONS=['Basement','Lower Ground','Ground Floor','First Floor','Second Floor','Third Floor','Roof'];\nlet _allocKey=null;\n\nfunction openAllocate(fileKey, focusFloorIdx){\n  _allocKey=fileKey;\n  document.getElementById('alloc-sub').textContent = fileKey\n    ? `${fileKey} — name each page and allocate it to a floor.`\n    : 'Name each page and allocate it to a floor level.';\n  renderAllocate();\n  const _am=document.getElementById('allocate-modal'); _am.classList.remove('closing'); _am.classList.add('show');\n  // Scroll the chosen page into view + highlight it\n  if(focusFloorIdx!=null){\n    const row=document.querySelector(`.alloc-row[data-floor=\"${focusFloorIdx}\"]`);\n    if(row){\n      row.classList.add('focus');\n      const body=document.querySelector('#allocate-modal .pp-body');\n      if(body) body.scrollTop=Math.max(0,row.offsetTop-14);\n      setTimeout(()=>row.classList.remove('focus'),1400);\n    }\n  }\n}\nfunction closeAllocate(){\n  _modalClose(document.getElementById('allocate-modal'));\n  renderFloorList();\n}\nfunction renderAllocate(){\n  const list=document.getElementById('alloc-list');\n  list.innerHTML='';\n  // _allocKey null/undefined → show ALL pages across every file\n  const items=state.floors.map((f,i)=>({f,i})).filter(({f})=>_allocKey==null || (f.srcFile||'Manual floors')===_allocKey);\n  document.getElementById('alloc-hint').textContent=`${items.length} page${items.length===1?'':'s'} in this file`;\n  items.forEach(({f,i})=>{\n    const row=document.createElement('div');\n    row.className='alloc-row';\n    row.dataset.floor=i;\n    row.innerHTML=`\n      <div class=\"alloc-img\">${f.imageData?`<img src=\"${f.imageData}\" alt=\"\">`:'<div class=\"alloc-blank\">Blank page<\u002Fdiv>'}<\u002Fdiv>\n      <div class=\"alloc-fields\">\n        <div class=\"alloc-toprow\">\n          <div class=\"alloc-field\"><label class=\"alloc-label\">Page name<\u002Flabel>\n            <input class=\"alloc-name\" data-i=\"${i}\" value=\"${(f.name||'').replace(/\"/g,'&quot;')}\" placeholder=\"e.g. Ground Floor Plan\">\n            <select class=\"alloc-quick\" data-i=\"${i}\">\n              <option value=\"\">Quick select…<\u002Foption>\n              <optgroup label=\"Floors\">${FLOOR_PRESETS.map(n=>`<option value=\"${n}\">${n}<\u002Foption>`).join('')}<\u002Foptgroup>\n              <optgroup label=\"Rooms\">${ROOM_PRESETS.map(n=>`<option value=\"${n}\">${n}<\u002Foption>`).join('')}<\u002Foptgroup>\n            <\u002Fselect><\u002Fdiv>\n          <div class=\"alloc-field\"><label class=\"alloc-label\">Allocate to floor level<\u002Flabel>\n            <select class=\"alloc-level\" data-i=\"${i}\">\n              <option value=\"\">— Select level —<\u002Foption>\n              ${LEVEL_OPTIONS.map(l=>`<option value=\"${l}\"${f.level===l?' selected':''}>${l}<\u002Foption>`).join('')}\n              <option value=\"__custom\"${f.level&&!LEVEL_OPTIONS.includes(f.level)?' selected':''}>+ Add custom level…<\u002Foption>\n            <\u002Fselect>\n            <input class=\"alloc-level-custom\" data-i=\"${i}\" placeholder=\"Custom level name\" value=\"${(f.level&&!LEVEL_OPTIONS.includes(f.level)?f.level:'').replace(/\"/g,'&quot;')}\" style=\"display:${f.level&&!LEVEL_OPTIONS.includes(f.level)?'block':'none'}\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    list.appendChild(row);\n  });\n  // Wire inputs\n  list.querySelectorAll('.alloc-name').forEach(inp=>{\n    inp.oninput=e=>{ state.floors[+inp.dataset.i].name=e.target.value; };\n  });\n  list.querySelectorAll('.alloc-quick').forEach(sel=>{\n    sel.onchange=()=>{\n      const i=+sel.dataset.i, name=sel.value;\n      if(!name) return;\n      state.floors[i].name=name;\n      const inp=list.querySelector(`.alloc-name[data-i=\"${i}\"]`);\n      if(inp) inp.value=name;\n      const lvlSel=list.querySelector(`.alloc-level[data-i=\"${i}\"]`);\n      if(lvlSel && LEVEL_OPTIONS.includes(name) && !state.floors[i].level){\n        state.floors[i].level=name; lvlSel.value=name;\n      }\n      sel.value=''; // reset back to \"Quick select…\"\n    };\n  });\n  list.querySelectorAll('.alloc-level').forEach(sel=>{\n    sel.onchange=e=>{\n      const i=+sel.dataset.i;\n      const custom=list.querySelector(`.alloc-level-custom[data-i=\"${i}\"]`);\n      if(sel.value==='__custom'){\n        if(custom){ custom.style.display='block'; custom.focus(); }\n        state.floors[i].level=custom&&custom.value?custom.value:null;\n      } else {\n        if(custom) custom.style.display='none';\n        state.floors[i].level=sel.value||null;\n      }\n    };\n  });\n  list.querySelectorAll('.alloc-level-custom').forEach(inp=>{\n    inp.oninput=e=>{ state.floors[+inp.dataset.i].level=e.target.value||null; };\n  });\n}\n\n// ═══════════════════════════════════════════════\n// ROOMS & SIZING\n// ═══════════════════════════════════════════════\nfunction addSystem(){\n  if(state.systems.length>=5){notify('Max 5 systems','warn');return;}\n  const n=state.systems.length+1;\n  state.systems.push({id:n,name:`System ${n}`,color:SYS_COLORS[n-1],rooms:[],odu:null});\n  renderSysPills();\n  notify(`System ${n} added`,'ok');\n}\n\nfunction renderSysPills(){\n  const container=document.getElementById('sys-pills');\n  container.innerHTML='';\n  state.systems.forEach((sys,i)=>{\n    const pill=document.createElement('div');\n    pill.className='sys-pill'+(i===state.activeSys?' active':'');\n    pill.style.color=sys.color;\n    const info=sysLoadInfo(sys);\n    const loadTxt = info.odu ? `${info.loading}% load` : 'no load';\n    const loadCol = info.loading>130 ? 'var(--ssx-warn)' : 'var(--ssx-faint)';\n    pill.innerHTML=`\n      <div style=\"display:flex;align-items:center;gap:6px;width:100%;min-width:0\">\n        <span class=\"sys-dot\" style=\"background:${sys.color}\"><\u002Fspan>\n        <span style=\"font:800 11px var(--ssx-font);color:var(--ssx-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1\">${sys.name}<\u002Fspan>\n        <button title=\"Rename system\" onclick=\"event.stopPropagation();editSysTag(${i})\" style=\"background:none;border:none;cursor:pointer;font-size:10px;color:${sys.color};opacity:0.55;padding:0;line-height:1;flex:none\">✏<\u002Fbutton>\n      <\u002Fdiv>\n      <span style=\"font:700 9.5px var(--ssx-mono);color:${loadCol}\">${sys.tag?sys.tag+' · ':''}${loadTxt}<\u002Fspan>\n    `;\n    pill.onclick=()=>{ state.activeSys=i; renderSysPills(); renderSysSummary(); renderRoomsSidebar(); buildUnitPalette(); renderComponentsList(); updateOverview?.(); };\n    container.appendChild(pill);\n  });\n  renderSysSummary();\n  // Update floor select\n  const sel=document.getElementById('active-floor-select');\n  if(sel) sel.innerHTML='<option value=\"\">All floors<\u002Foption>'+state.floors.map((f,i)=>`<option value=\"${i}\">${f.name}<\u002Foption>`).join('');\n}\n\n// Compute load info for a system (mirrors updateOverview's ODU selection)\nfunction sysLoadInfo(sys){\n  const sysRooms = state.rooms.filter(r=>r.sysId===sys.id);\n  const totalKw = sysRooms.reduce((s,r)=>{\n    const units = r.units||[{kw:r.kw||0}];\n    return s + units.reduce((a,u)=>a+(u.kw||0),0);\n  },0);\n  const singlePhase = (sys.phase||state.globalPhase||3)===1;\n  const odu = sys.odu || ODU_DATA.filter(o=>singlePhase?o.phase===1:true).find(o=>o.kw>=totalKw*0.85 && o.maxKw>=totalKw);\n  const loading = odu ? Math.round((totalKw/odu.kw)*100) : 0;\n  return {totalKw:Math.round(totalKw*10)/10, odu, loading, singlePhase};\n}\n\n// Active-system summary card (ODU + load bar + phase)\nfunction renderSysSummary(){\n  const el=document.getElementById('rp-sys-summary');\n  if(!el) return;\n  const sys=state.systems[state.activeSys];\n  if(!sys){ el.innerHTML=''; return; }\n  const info=sysLoadInfo(sys);\n  const over=info.loading>130;\n  const phase=(sys.phase||state.globalPhase||3);\n  el.className='rp-hero rp-hero-light';\n  el.style.borderLeftColor='';\n  const oduOpts = ODU_DATA.filter(o=>info.singlePhase?o.phase===1:true)\n    .map(o=>`<option value=\"${o.model}\"${info.odu&&o.model===info.odu.model?' selected':''}>${o.model} — ${o.kw}kW ${o.phase===3?'3Ø':'1Ø'}<\u002Foption>`).join('');\n  // System tabs (top of the unified card) — click to switch active system\n  const tabsEl=document.getElementById('rp-sys-tabs');\n  if(tabsEl){\n    tabsEl.innerHTML = state.systems.map((s,i)=>`\n      <button class=\"rp-systab${i===state.activeSys?' on':''}\" onclick=\"state.activeSys=${i};renderSysSummary();renderRoomsSidebar();buildUnitPalette();renderComponentsList();updateOverview&&updateOverview()\" title=\"${s.name}\" style=\"--sc:${s.color}\">\n        <span style=\"width:8px;height:8px;border-radius:50%;flex:none;background:${s.color}\"><\u002Fspan>\n        <span style=\"white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">${s.name}<\u002Fspan>\n      <\u002Fbutton>`).join('') +\n      `<button class=\"rp-systab-add\" onclick=\"addSystem()\" title=\"Add system\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 11 11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M5.5 1v9M1 5.5h9\"/><\u002Fsvg><\u002Fbutton>`;\n  }\n  el.innerHTML=`\n    <div class=\"rp-hero-top\">\n      <div style=\"font:800 9px var(--ssx-head);text-transform:uppercase;letter-spacing:.08em;color:var(--ssx-label)\">Outdoor unit<\u002Fdiv>\n      <span style=\"font:700 10px var(--ssx-mono);padding:3px 9px;border-radius:20px;flex:none;background:${over?'#FEF3E2':'var(--ssx-accent-bg)'};color:${over?'var(--ssx-warn)':'var(--ssx-accent-hover)'}\">${info.odu?info.loading+'%':'—'}<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"rp-hero-od\">\n      <select onchange=\"manualODU(this.value)\" title=\"Change outdoor unit model\">${info.odu?oduOpts:'<option>No suitable ODU<\u002Foption>'}<\u002Fselect>\n    <\u002Fdiv>\n    <div class=\"rp-hero-bar\"><i style=\"width:${Math.min(info.loading,100)}%;background:${over?'linear-gradient(90deg,#D97706,#F59E0B)':'linear-gradient(90deg,#06D6A0,#0EA5E9)'}\"><\u002Fi><\u002Fdiv>\n    <div class=\"rp-hero-meta\">\n      <span style=\"font:500 10.5px var(--ssx-font);color:${over?'var(--ssx-warn)':'var(--ssx-faint)'}\">${over?'Over capacity — add a system or upsize':info.odu?`${info.totalKw} kW of ${info.odu.kw} kW`:`${info.totalKw} kW connected`}<\u002Fspan>\n      <select id=\"sys-phase-select\" onchange=\"setSysPhase(this.value)\">\n        <option value=\"3\"${phase===3?' selected':''}>3Ø 415V<\u002Foption>\n        <option value=\"1\"${phase===1?' selected':''}>1Ø 240V<\u002Foption>\n      <\u002Fselect>\n    <\u002Fdiv>`;\n}\n\n// Section pill switcher — show one section at a time\nfunction setRpSection(sec){\n  ['rooms','units','parts'].forEach(s=>{\n    const secEl=document.getElementById('rp-sec-'+s);\n    if(secEl) secEl.style.display = s===sec ? 'block' : 'none';\n    const pill=document.querySelector('.rp-pill[data-sec=\"'+s+'\"]');\n    if(pill) pill.classList.toggle('on', s===sec);\n  });\n}\n\n// Collapsible accordion toggle for the right panel\nfunction toggleRpAcc(id){\n  const el=document.getElementById('acc-'+id);\n  if(el) el.classList.toggle('open');\n}\n\nfunction editSysTag(idx){\n  const sys = state.systems[idx];\n  if(!sys) return;\n  const current = sys.tag || '';\n  // Find the pill's tag span and replace with an input\n  const pills = document.querySelectorAll('.sys-pill');\n  const pill = pills[idx];\n  if(!pill) return;\n  const input = document.createElement('input');\n  input.value = current;\n  input.placeholder = 'e.g. Downstairs, Level 1…';\n  input.style.cssText = 'width:100%;border:none;border-bottom:1px solid currentColor;background:transparent;color:inherit;font-family:inherit;font-size:10px;outline:none;padding:1px 0;margin-top:2px';\n  // Replace tag span or append\n  const existing = pill.querySelector('.sys-tag-input-row');\n  if(existing){ existing.querySelector('input')?.focus(); return; }\n  const row = document.createElement('div');\n  row.className = 'sys-tag-input-row';\n  row.style.cssText = 'grid-column:1/-1;padding:0 4px 2px 0';\n  row.appendChild(input);\n  pill.querySelector('div').appendChild(row);\n  input.focus(); input.select();\n  const commit = ()=>{\n    sys.tag = input.value.trim();\n    renderSysPills();\n    // Update canvas label\n    const labelEl = document.getElementById('canvas-sys-label');\n    if(labelEl){\n      const s = state.systems[state.activeSys];\n      labelEl.textContent = s.tag ? `${s.name} — ${s.tag}` : s.name;\n    }\n    triggerAutoSave?.();\n  };\n  input.addEventListener('blur', commit);\n  input.addEventListener('keydown', e=>{\n    if(e.key==='Enter') input.blur();\n    if(e.key==='Escape'){ input.value=current; input.blur(); }\n  });\n}\n\nfunction removeSystem(idx){\n  // Safety check — never remove if it has rooms or units\n  const sys=state.systems[idx];\n  if(!sys) return;\n  if(state.rooms.some(r=>r.sysId===sys.id)||state.placedUnits.some(u=>u.sysId===sys.id)){\n    notify('Remove all rooms from this system first','warn');\n    return;\n  }\n  state.systems.splice(idx,1);\n  if(state.activeSys>=state.systems.length) state.activeSys=state.systems.length-1;\n  renderSysPills();\n  renderRooms();\n}\n\nfunction addRoom(){\n  const sys=state.systems[state.activeSys];\n  const defaultKw=2.2;\n  const room={\n    id:state.nextRoomId++, name:'', floor:0, sysId:sys.id,\n    kw:defaultKw, area_m2:null,\n    method:'heat', width:4, length:5, height:2.4,\n    glass:'moderate', condition:'standard', notes:'',\n    open:true, aiGenerated:false,\n    units:[{model:'PEFY-P20VMX-E', type:'VMX', kw:defaultKw}]\n  };\n  state.rooms.push(room);\n  renderRooms(); updateOverview();\n}\n\n// ── Unit row helpers ─────────────────────────────────────\nfunction roomTotalKw(room){\n  return (room.units||[{kw:room.kw}]).reduce((s,u)=>s+u.kw,0);\n}\n\nfunction splitRoom(roomId){\n  const room=state.rooms.find(r=>r.id===roomId);\n  if(!room||!room.units) return;\n  if(room.units.length>=4){notify('Max 4 units per room','warn');return;}\n  const met=roomTotalKw(room);\n  const remaining=Math.max(room.kw-met,0);\n  const auto=selectUnit(remaining>0?remaining:room.kw/(room.units.length+1),'VMX');\n  const ud=UNIT_DATA[auto]||{kw:2.2};\n  room.units.push({model:auto, type:'VMX', kw:ud.kw});\n  renderRooms(); updateOverview();\n}\n\nfunction removeUnitRow(roomId, uIdx){\n  const room=state.rooms.find(r=>r.id===roomId);\n  if(!room||!room.units||room.units.length<=1) return;\n  room.units.splice(uIdx,1);\n  renderRooms(); updateOverview();\n}\n\nfunction updateUnitRow(roomId, uIdx, field, val){\n  const room=state.rooms.find(r=>r.id===roomId);\n  if(!room||!room.units) return;\n  room.units[uIdx][field]=val;\n  if(field==='model'&&UNIT_DATA[val]) room.units[uIdx].kw=UNIT_DATA[val].kw;\n  if(field==='type'){\n    const best=selectUnit(room.units[uIdx].kw, val);\n    room.units[uIdx].model=best||room.units[uIdx].model;\n    if(UNIT_DATA[room.units[uIdx].model]) room.units[uIdx].kw=UNIT_DATA[room.units[uIdx].model].kw;\n  }\n  renderRooms(); updateOverview();\n}\n\nfunction buildUnitRows(room){\n  const units=room.units||[{model:room.model||'PEFY-P20VMX-E',type:room.unitType||'VMX',kw:room.kw||2.2}];\n  const totalU=roomTotalKw({...room,units});\n  const heatOk=totalU>=room.kw;\n  const overshoot=totalU>room.kw*1.5;\n  const shortfall=room.kw-totalU;\n\n  return `\n  <div style=\"margin-top:14px;border-top:1px solid var(--ssx-border);padding-top:12px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px\">\n      <span style=\"font-family:var(--ssx-head);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ssx-label)\">Unit selection<\u002Fspan>\n      <button class=\"btn btn-sm btn-secondary\" onclick=\"splitRoom(${room.id})\">+ Split<\u002Fbutton>\n    <\u002Fdiv>\n    ${units.map((u,i)=>{\n      const ud=UNIT_DATA[u.model]||{w:0,d:0,h:0,kw:0,heat:0};\n      return `\n      <div style=\"border:1px solid var(--ssx-border);border-radius:var(--ssx-radius-sm);padding:10px;margin-bottom:8px;background:var(--ssx-card2)\">\n        <div style=\"display:flex;gap:8px;align-items:center;margin-bottom:6px\">\n          <div style=\"flex:1\">\n            <select style=\"width:100%;padding:5px 8px;border:1px solid var(--ssx-border-strong);border-radius:4px;font-family:var(--ssx-font);font-size:12px;background:var(--ssx-input-bg);color:var(--ssx-text)\"\n              onchange=\"updateUnitRow(${room.id},${i},'type',this.value)\">\n              ${IDU_TYPES.map(t=>`<option value=\"${t.value}\" ${u.type===t.value?'selected':''}>${t.label}<\u002Foption>`).join('')}\n            <\u002Fselect>\n          <\u002Fdiv>\n          ${units.length>1?`<button onclick=\"removeUnitRow(${room.id},${i})\" style=\"background:none;border:none;color:var(--ssx-danger);cursor:pointer;font-size:16px;padding:0 4px\" title=\"Remove\">✕<\u002Fbutton>`:''}\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;align-items:center\">\n          <select style=\"flex:1;padding:5px 8px;border:1px solid var(--ssx-border-strong);border-radius:4px;font-family:var(--ssx-mono);font-size:11px;background:var(--ssx-input-bg);color:var(--ssx-text)\"\n            onchange=\"updateUnitRow(${room.id},${i},'model',this.value)\">\n            ${Object.entries(UNIT_DATA).filter(([k,v])=>v.type===(u.type||'VMX')).sort((a,b)=>a[1].kw-b[1].kw).map(([k,v])=>\n              `<option value=\"${k}\" ${u.model===k?'selected':''}>${k} — ${v.kw}kW<\u002Foption>`\n            ).join('')}\n          <\u002Fselect>\n          <span style=\"font-family:var(--ssx-mono);font-size:12px;font-weight:700;color:var(--ssx-accent);white-space:nowrap\">${u.kw} kW<\u002Fspan>\n        <\u002Fdiv>\n        ${ud.w?`<div style=\"font-size:10px;color:var(--ssx-faint);margin-top:5px;font-family:var(--ssx-mono)\">${ud.w}W × ${ud.d}D × ${ud.h}H mm<\u002Fdiv>`:''}\n      <\u002Fdiv>`;\n    }).join('')}\n    <div style=\"display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--ssx-radius-sm);background:${heatOk&&!overshoot?'#f0fdf4':'#fffbeb'};border:1px solid ${heatOk&&!overshoot?'#86efac':'#fcd34d'}\">\n      <span style=\"font-size:18px\">${heatOk&&!overshoot?'✓':'⚠'}<\u002Fspan>\n      <span style=\"font-size:12px;font-weight:600;color:${heatOk&&!overshoot?'var(--ssx-ok)':'var(--ssx-warn)'}\">\n        ${totalU.toFixed(1)} kW total\n        ${heatOk&&!overshoot?' — meets heat load':overshoot?' — oversized':` — ${shortfall.toFixed(1)} kW short`}\n      <\u002Fspan>\n      <span style=\"margin-left:auto;font-size:11px;color:var(--ssx-faint)\">Load: ${room.kw.toFixed(1)} kW<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction renderRooms(){\n  renderSysPills(); syncPhaseSelector();\n  const container=document.getElementById('rooms-list');\n  // New merged design step uses the sidebar room list instead of this panel.\n  // If the old rooms-list element isn't present, delegate to the sidebar renderer.\n  if(!container){\n    if(typeof renderRoomsSidebar==='function') renderRoomsSidebar();\n    if(typeof updateOverview==='function') updateOverview();\n    return;\n  }\n  container.innerHTML='';\n  const floorFilter=document.getElementById('active-floor-select')?.value||'';\n  const visible=state.rooms.filter(r=>{\n    const sysMatch=r.sysId===state.systems[state.activeSys].id;\n    const floorMatch=floorFilter===''||r.floor===parseInt(floorFilter);\n    return sysMatch&&floorMatch;\n  });\n\n  if(visible.length===0){\n    container.innerHTML=`<div class=\"card\"><div class=\"empty-state\">\n      <svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"><rect x=\"8\" y=\"8\" width=\"32\" height=\"32\" rx=\"4\"/><path d=\"M16 24h16M24 16v16\"/><\u002Fsvg>\n      <h3>No rooms yet<\u002Fh3><p>Add rooms manually or use AI to scan your floor plans<\u002Fp>\n    <\u002Fdiv><\u002Fdiv>`;\n  }\n\n  visible.forEach((room,idx)=>{\n    if(!room.units) room.units=[{model:room.model||'PEFY-P20VMX-E',type:room.unitType||'VMX',kw:room.kw||2.2}];\n    const sys=state.systems.find(s=>s.id===room.sysId);\n    const heatKw=calcHeatLoad(room);\n    if(room.method==='heat') room.kw=heatKw;\n    const totalU=roomTotalKw(room);\n    const heatOk=totalU>=room.kw;\n    const card=document.createElement('div');\n    card.className='card room-card'; card.style.padding='0';\n\n    card.innerHTML=`\n      <div class=\"room-header\" onclick=\"toggleRoom(${room.id})\">\n        <div class=\"room-num\" style=\"background:${sys.color}\">${idx+1}<\u002Fdiv>\n        <div class=\"room-title\">${room.name||`Room ${idx+1}`}<\u002Fdiv>\n        <div class=\"room-meta\">\n          <span class=\"room-kw\">${room.kw.toFixed(1)} kW<\u002Fspan>\n          ${room.units.length>1?`<span class=\"pill pill-blue\" style=\"font-size:11px\">${room.units.length} units<\u002Fspan>`:`<span class=\"pill pill-blue\" style=\"font-size:11px\">${room.units[0]?.model||''}<\u002Fspan>`}\n          <span style=\"font-size:11px;margin-left:4px\">${heatOk?'✓':'⚠'}<\u002Fspan>\n          <span style=\"color:var(--ssx-faint);font-size:18px\">${room.open?'∧':'∨'}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"room-body ${room.open?'open':''}\" id=\"room-body-${room.id}\">\n        <div class=\"form-row\" style=\"margin-bottom:12px\">\n          <div class=\"heat-field\">\n            <label>Room name<\u002Flabel>\n            <input type=\"text\" value=\"${room.name}\" placeholder=\"e.g. Living / Dining\"\n              oninput=\"updateRoom(${room.id},'name',this.value)\">\n          <\u002Fdiv>\n          <div class=\"heat-field\">\n            <label>Floor<\u002Flabel>\n            <select onchange=\"updateRoom(${room.id},'floor',parseInt(this.value))\">\n              ${state.floors.map((f,i)=>`<option value=\"${i}\" ${room.floor===i?'selected':''}>${f.name}<\u002Foption>`).join('')}\n            <\u002Fselect>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"sizing-toggle\">\n          <button class=\"${room.method==='manual'?'active':''}\" onclick=\"updateRoom(${room.id},'method','manual');recalcRoom(${room.id})\">Manual kW<\u002Fbutton>\n          <button class=\"${room.method==='heat'?'active':''}\" onclick=\"updateRoom(${room.id},'method','heat');recalcRoom(${room.id})\">Heat load calc<\u002Fbutton>\n        <\u002Fdiv>\n        <div ${room.method==='heat'?'':'style=\"display:none\"'} id=\"heat-inputs-${room.id}\">\n          <div class=\"heat-grid\">\n            <div class=\"heat-field\"><label>Width (m)<\u002Flabel><input type=\"number\" value=\"${room.width}\" step=\"0.5\" oninput=\"updateRoom(${room.id},'width',parseFloat(this.value)||0);recalcRoom(${room.id})\"><\u002Fdiv>\n            <div class=\"heat-field\"><label>Length (m)<\u002Flabel><input type=\"number\" value=\"${room.length}\" step=\"0.5\" oninput=\"updateRoom(${room.id},'length',parseFloat(this.value)||0);recalcRoom(${room.id})\"><\u002Fdiv>\n            <div class=\"heat-field\"><label>Height (m)<\u002Flabel><input type=\"number\" value=\"${room.height}\" step=\"0.1\" oninput=\"updateRoom(${room.id},'height',parseFloat(this.value)||0);recalcRoom(${room.id})\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"heat-grid\">\n            <div class=\"heat-field\"><label>Glazing<\u002Flabel>\n              <select onchange=\"updateRoom(${room.id},'glass',this.value);recalcRoom(${room.id})\">\n                <option value=\"low\" ${room.glass==='low'?'selected':''}>Low — double glazed<\u002Foption>\n                <option value=\"moderate\" ${room.glass==='moderate'?'selected':''}>Moderate — average<\u002Foption>\n                <option value=\"high\" ${room.glass==='high'?'selected':''}>High — large/single<\u002Foption>\n              <\u002Fselect>\n            <\u002Fdiv>\n            <div class=\"heat-field\"><label>Condition<\u002Flabel>\n              <select onchange=\"updateRoom(${room.id},'condition',this.value);recalcRoom(${room.id})\">\n                <option value=\"standard\" ${room.condition==='standard'?'selected':''}>Standard<\u002Foption>\n                <option value=\"well_insulated\" ${room.condition==='well_insulated'?'selected':''}>Well insulated<\u002Foption>\n                <option value=\"poor\" ${room.condition==='poor'?'selected':''}>Poor insulation<\u002Foption>\n              <\u002Fselect>\n            <\u002Fdiv>\n            <div class=\"heat-field\"><label>Heat load<\u002Flabel>\n              <input readonly value=\"${heatKw.toFixed(2)} kW\" style=\"background:var(--ssx-card2);color:var(--ssx-ok);font-weight:700\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div ${room.method==='manual'?'':'style=\"display:none\"'} id=\"manual-inputs-${room.id}\">\n          <div class=\"heat-field\" style=\"margin-bottom:10px\">\n            <label>Required capacity (kW)<\u002Flabel>\n            <input type=\"number\" value=\"${room.kw}\" step=\"0.1\"\n              oninput=\"updateRoom(${room.id},'kw',parseFloat(this.value)||0);renderRooms()\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        ${buildUnitRows(room)}\n        <div style=\"margin-top:12px;display:flex;justify-content:space-between;align-items:center\">\n          <button class=\"btn btn-danger btn-sm\" onclick=\"deleteRoom(${room.id})\">✕ Remove room<\u002Fbutton>\n          <button class=\"btn btn-secondary btn-sm\" onclick=\"toggleRoom(${room.id})\">✓ Done<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    container.appendChild(card);\n  });\n  updateOverview();\n}\n\nfunction toggleRoom(id){\n  const room=state.rooms.find(r=>r.id===id);\n  if(room){room.open=!room.open;renderRooms();}\n}\n\nfunction updateRoom(id,key,val){\n  const room=state.rooms.find(r=>r.id===id);\n  if(room){room[key]=val;updateOverview();}\n}\n\nfunction recalcRoom(id){\n  const room=state.rooms.find(r=>r.id===id);\n  if(!room) return;\n  if(room.method==='heat'){\n    room.kw=calcHeatLoad(room);\n    // Auto-update first unit to match new load if only 1 unit\n    if(room.units&&room.units.length===1){\n      const best=selectUnit(room.kw, room.units[0].type||'VMX');\n      if(best){room.units[0].model=best; room.units[0].kw=UNIT_DATA[best]?.kw||room.kw;}\n    }\n  }\n  renderRooms();\n}\n\nfunction deleteRoom(id){\n  state.rooms=state.rooms.filter(r=>r.id!==id);\n  renderRooms();\n  if(typeof triggerAutoSave==='function') triggerAutoSave();\n}\n\n\nfunction selectUnit(kw, typeFilter='VMX'){\n  const models=Object.entries(UNIT_DATA)\n    .filter(([k,v])=>v.type===typeFilter)\n    .sort((a,b)=>a[1].kw-b[1].kw);\n  if(models.length===0) return null;\n  // Find the smallest model that meets or exceeds the required capacity\n  const match=models.find(([k,v])=>v.kw>=kw);\n  // If nothing is large enough, return the largest available\n  const result=match||models[models.length-1];\n  return result[0];\n}\n\nfunction updateOverview(){\n  const sys = state.systems[state.activeSys];\n  if(!sys) return;\n  const sysRooms = state.rooms.filter(r=>r.sysId===sys.id);\n\n  // Total kW across all unit rows\n  const totalKw = sysRooms.reduce((s,r)=>{\n    const units = r.units||[{kw:r.kw||0}];\n    return s + units.reduce((a,u)=>a+(u.kw||0),0);\n  },0);\n\n  // Phase\n  const sysPhase    = sys.phase || state.globalPhase || 3;\n  const singlePhase = sysPhase === 1;\n  const maxSP       = Math.max(...ODU_DATA.filter(o=>o.phase===1).map(o=>o.maxKw));\n\n  // ODU selection\n  const odu = ODU_DATA\n    .filter(o => singlePhase ? o.phase===1 : true)\n    .find(o  => o.kw >= totalKw*0.85 && o.maxKw >= totalKw);\n  sys.odu = odu;\n\n  const loading  = odu ? Math.round((totalKw/odu.kw)*100) : 0;\n  const fitOk    = loading >= 50 && loading <= 130;\n  const fitWarn  = loading > 130;\n  const phaseWarn= singlePhase && totalKw > maxSP;\n\n  // ── ODU now lives only in the system summary card (not the rooms list) ──\n  // Remove any legacy overview block that was injected into the rooms accordion.\n  const _legacy = document.getElementById('sidebar-overview');\n  if(_legacy) _legacy.remove();\n\n  // Also refresh rooms sidebar + the summary card (which renders the ODU + selector)\n  renderSysSummary();\n  renderRoomsSidebar();\n}\n\nfunction manualODU(model){\n  const odu = ODU_DATA.find(o=>o.model===model);\n  if(odu){\n    state.systems[state.activeSys].odu = odu;\n    state.systems[state.activeSys].oduManual = true; // don't auto-override the user's choice\n    renderSysSummary();\n    renderSysPills();\n    buildUnitPalette();\n    drawCanvas?.();\n    triggerAutoSave?.();\n  }\n}\n\n// ═══════════════════════════════════════════════\n// CANVAS — zoom/pan/crop + all drawing tools\n// ═══════════════════════════════════════════════\nlet canvasCtx = null;\n\n// Viewport transform: all coords in canvas-image space\n// state.vp = {x, y, zoom}  — pan offset in screen px, zoom scalar\nstate.vp = {x:0, y:0, zoom:1};\nstate.crop = null; // {x,y,w,h} in image px, or null\nstate.cropStart = null;\nstate.polygons = []; // room boundary polygons: [{id, floor, points, name, color, excluded}]\nstate.activePolygon = null; // points being drawn currently\nstate._isPanning = false;\nstate._panStart = null;\n\nfunction initCanvas(){\n  const canvas = document.getElementById('floor-canvas');\n  canvasCtx = canvas.getContext('2d');\n  renderFloorTabs();\n  buildUnitPalette();\n  loadFloorImage();\n  // Sync phase selector to current system\n  syncPhaseSelector();\n}\n\nfunction syncPhaseSelector(){\n  const sys = state.systems[state.activeSys];\n  const sel = document.getElementById('sys-phase-select');\n  if(sel) sel.value = String(sys.phase||state.globalPhase||3);\n}\n\nfunction setSysPhase(val){\n  state.systems[state.activeSys].phase = parseInt(val);\n  updateOverview();\n}\n\nfunction renderFloorTabs(){\n  const tabs = document.getElementById('floor-tabs');\n  tabs.innerHTML = '';\n  state.floors.forEach((f,i)=>{\n    const btn = document.createElement('button');\n    btn.className = 'floor-tab'+(i===state.activeFloor?' active':'');\n    btn.textContent = f.name;\n    btn.onclick = ()=>{state.activeFloor=i;renderFloorTabs();loadFloorImage();updateScaleBadge();if(!state.scale){state._calibPromptShown=false;const fl=state.floors[i];if(fl&&fl.imageData)showCalibratePrompt();}};\n    tabs.appendChild(btn);\n  });\n}\n\nfunction loadFloorImage(){\n  const canvas = document.getElementById('floor-canvas');\n  const floor  = state.floors[state.activeFloor];\n  state.vp = {x:0,y:0,zoom:1};\n  state.crop = null;\n\n  if(!floor||!floor.imageData){\n    canvas.width  = 2400;\n    canvas.height = 1600;\n    state._floorImg = null;\n    drawCanvas();\n    fitCanvas();\n    showNoPlansBanner();\n    return;\n  }\n  removeNoPlansBanner();\n  const img = new Image();\n  img.onload = ()=>{\n    canvas.width  = img.width;\n    canvas.height = img.height;\n    state._floorImg = img;\n    drawCanvas();\n    fitCanvas();\n  };\n  img.src = floor.imageData;\n}\n\nfunction showNoPlansBanner(){\n  return; // banner removed per design\n}\n\nfunction removeNoPlansBanner(){\n  const b = document.getElementById('noplans-banner');\n  if(b) b.remove();\n}\n\n// ── Viewport helpers ──────────────────────────────────────\nfunction screenToCanvas(sx, sy){\n  // Convert screen coords (relative to canvas-wrap) → image canvas coords\n  return {\n    x: (sx - state.vp.x) / state.vp.zoom,\n    y: (sy - state.vp.y) / state.vp.zoom\n  };\n}\n\nfunction clampPan(){\n  const wrap = document.getElementById('canvas-wrap');\n  const canvas = document.getElementById('floor-canvas');\n  if(!wrap||!canvas) return;\n  const imgW = (state.crop ? state.crop.w : canvas.width) * state.vp.zoom;\n  const imgH = (state.crop ? state.crop.h : canvas.height) * state.vp.zoom;\n  const vw = wrap.clientWidth, vh = wrap.clientHeight;\n  // If content is smaller than viewport, centre it; otherwise keep edges within view\n  if(imgW <= vw) state.vp.x = (vw - imgW)/2;\n  else state.vp.x = Math.min(0, Math.max(vw - imgW, state.vp.x));\n  if(imgH <= vh) state.vp.y = (vh - imgH)/2;\n  else state.vp.y = Math.min(0, Math.max(vh - imgH, state.vp.y));\n}\n\nfunction applyTransform(){\n  const inner = document.getElementById('canvas-inner');\n  clampPan();\n  inner.style.transform = `translate(${state.vp.x}px,${state.vp.y}px) scale(${state.vp.zoom})`;\n  const pct = Math.round(state.vp.zoom*100);\n  updateUnitControls();\n  document.getElementById('zoom-badge').textContent = pct+'%';\n  const el = document.getElementById('zoom-label');\n  if(el) el.textContent = pct+'%';\n}\n\nfunction fitZoom(){\n  const canvas = document.getElementById('floor-canvas');\n  const wrap   = document.getElementById('canvas-wrap');\n  if(!canvas||!wrap) return 0.15;\n  const imgW = state.crop ? state.crop.w : canvas.width;\n  const imgH = state.crop ? state.crop.h : canvas.height;\n  return Math.min((wrap.clientWidth-40)/imgW, (wrap.clientHeight-40)/imgH, 2);\n}\n\nfunction fitCanvas(){\n  const canvas = document.getElementById('floor-canvas');\n  const wrap   = document.getElementById('canvas-wrap');\n  const imgW   = state.crop ? state.crop.w : canvas.width;\n  const imgH   = state.crop ? state.crop.h : canvas.height;\n  const z = fitZoom();\n  state.vp.zoom = z;\n  state.vp.x = (wrap.clientWidth  - imgW*z) / 2;\n  state.vp.y = (wrap.clientHeight - imgH*z) / 2;\n  applyTransform();\n}\n\nfunction zoom100(){\n  state.vp.zoom = 1;\n  applyTransform();\n}\n\nfunction zoomBy(delta){\n  const wrap = document.getElementById('canvas-wrap');\n  const cx = wrap.clientWidth/2, cy = wrap.clientHeight/2;\n  zoomAt(cx, cy, state.vp.zoom + delta);\n}\n\nfunction zoomAt(sx, sy, newZoom){\n  newZoom = Math.max(fitZoom(), Math.min(8, newZoom));\n  const ratio = newZoom / state.vp.zoom;\n  state.vp.x = sx - (sx - state.vp.x)*ratio;\n  state.vp.y = sy - (sy - state.vp.y)*ratio;\n  state.vp.zoom = newZoom;\n  applyTransform();\n}\n\nfunction canvasWheel(e){\n  e.preventDefault();\n  const wrap = document.getElementById('canvas-wrap');\n  const wr   = wrap.getBoundingClientRect();\n  const sx = e.clientX - wr.left;\n  const sy = e.clientY - wr.top;\n  const factor = e.deltaY < 0 ? 1.12 : 1/1.12;\n  zoomAt(sx, sy, state.vp.zoom * factor);\n}\n\n// ── Get canvas coords from mouse event ──────────────────\nfunction getCanvasCoords(e){\n  const wrap = document.getElementById('canvas-wrap');\n  const wr   = wrap.getBoundingClientRect();\n  const sx = e.clientX - wr.left;\n  const sy = e.clientY - wr.top;\n  return screenToCanvas(sx, sy);\n}\n\n// ── Tool management ──────────────────────────────────────\nfunction setTool(tool){\n  state.tool = tool;\n  state._snapPipeId = null; state._snapRiserId = null;\n  ['select','calib','crop','pipe','riser','poly','rect','tjunction','bcbox','north','wallselect','eraser'].forEach(t=>{\n    document.getElementById('tool-'+t)?.classList.toggle('active', t===tool);\n  });\n  const wrap = document.getElementById('canvas-wrap');\n  if(wrap) wrap.className = 'mode-'+tool;\n  if(tool==='calib'){\n    state.calibStart=null; state.calibEnd=null;\n    notify('Click two points on a known dimension','');\n  }\n  if(tool==='pipe')  notify('Click unit connection points · pipes run at 90° · double-click to finish');\n  if(tool==='eraser') notify('Click any unit, pipe, junction, BC box or riser to delete it');\n  if(tool==='rect')  notify('Click and drag to draw a rectangular room');\n  if(tool==='poly')  notify('Click corners to draw room outline · double-click or click first point to close');  if(tool==='riser') notify('Click to place riser marker');\n  if(tool==='tjunction') notify('Click on a pipe run to drop a T-junction / branch point');\n  if(tool==='bcbox')    notify('Click to place a BC Controller — one main pipe in, multiple pipes out to advanced indoor units');\n  if(tool==='north')    notify(state.northArrow ? 'North arrow already placed — drag the N to rotate, drag centre to move' : 'Click anywhere on the plan to place the north arrow');\n  if(tool==='crop')  notify('Draw a rectangle over the area to keep · double-click to reset crop');\n  if(tool==='poly'){\n    state.activePolygon=null;\n    notify('Click corners to draw a room boundary · click first point or double-click to close');\n  }\n}\n\n// ── Mouse events ─────────────────────────────────────────\nfunction cancelCurrentAction(){\n  let cancelled=false;\n  // Pipe — commit what's drawn (if 2+ points) rather than discard\n  if(state.tool==='pipe' && state.pipePath && state.pipePath.length>1){\n    pushUndo();\n    const sys=state.systems[state.activeSys];\n    const totalKw=state.rooms.filter(r=>r.sysId===sys.id).reduce((s,r)=>s+r.kw,0);\n    const ps=getPipeSize(totalKw);\n    state.pipes.push({\n      id:state.nextPipeId++, sysId:sys.id, floor:state.activeFloor,\n      points:[...state.pipePath], size:PIPE_DEFAULT.suc, liq:PIPE_DEFAULT.liq, lw:PIPE_DEFAULT.lw, col:PIPE_DEFAULT.col, sized:false\n    });\n    state.pipePath=[]; cancelled=true;\n    renderComponentsList(); updateLegendLabels(); triggerAutoSave?.();\n  } else if(state.pipePath && state.pipePath.length>0){\n    state.pipePath=[]; cancelled=true;\n  }\n  if(state.activePolygon){ state.activePolygon=null; cancelled=true; }\n  if(state._rectStart){ state._rectStart=null; state._rectEnd=null; cancelled=true; }\n  if(state.calibStart){ state.calibStart=null; state.calibEnd=null; cancelled=true; }\n  if(state._cropDrawing){ state._cropDrawing=false; state.cropStart=null; cancelled=true; }\n  setTool('select');\n  drawCanvas();\n}\n\nfunction canvasMouseDown(e){\n  // Right-click (or middle) cancels the current action and returns to Select\n  if(e.button===2 || e.button===1){\n    e.preventDefault();\n    cancelCurrentAction();\n    return;\n  }\n  if(e.button!==0) return;\n  const pos = getCanvasCoords(e);\n  const wrap = document.getElementById('canvas-wrap');\n\n  // Hide unit controls before hit testing so they never block canvas clicks\n  document.getElementById('unit-controls').style.display = 'none';\n  const wr   = wrap.getBoundingClientRect();\n\n  // Space+drag = pan regardless of active tool\n  if(state._spaceDown){\n    state._isPanning = true;\n    state._panStart  = {mx: e.clientX, my: e.clientY, vx: state.vp.x, vy: state.vp.y};\n    wrap.className   = 'mode-panning';\n    return;\n  }\n\n  if(state.tool==='calib'){\n    if(!state.calibStart){ state.calibStart=pos; }\n    else{ state.calibEnd=pos; showCalibModal(); }\n    drawCanvas(); return;\n  }\n\n  if(state.tool==='crop'){\n    state.cropStart = pos;\n    state._cropDrawing = true;\n    return;\n  }\n\n  if(state.tool==='poly'){\n    if(!state.activePolygon){\n      // Room boundaries always amber — distinct from system unit colours and pipe colours\n      const col='#f59e0b';\n      state.activePolygon={points:[pos], color:col, floor:state.activeFloor};\n    } else {\n      const first=state.activePolygon.points[0];\n      const dx=pos.x-first.x, dy=pos.y-first.y;\n      const dist=Math.sqrt(dx*dx+dy*dy);\n      const closeThresh=12/state.vp.zoom;\n      if(state.activePolygon.points.length>=3 && dist<closeThresh){\n        closePolygon(); return;\n      }\n      state.activePolygon.points.push(pos);\n    }\n    drawCanvas(); return;\n  }\n\n  if(state.tool==='pipe'){\n    if(state.pipePath.length===0){\n      // First point — snap to a unit connection if near one\n      const conn=nearestConnection(pos);\n      state.pipePath.push(conn ? {x:conn.x, y:conn.y, unitId:conn.unitId} : {x:pos.x, y:pos.y});\n    } else {\n      const prev=state.pipePath[state.pipePath.length-1];\n      // Snapping into a riser ends the run and asks how far it rises/drops\n      const riserHit=nearestRiser(pos);\n      if(riserHit){\n        const dx=Math.abs(riserHit.x-prev.x), dy=Math.abs(riserHit.y-prev.y);\n        if(dx>0.5 && dy>0.5){ state.pipePath.push(dx>=dy?{x:riserHit.x,y:prev.y}:{x:prev.x,y:riserHit.y}); }\n        state.pipePath.push({x:riserHit.x, y:riserHit.y, riserId:riserHit.id});\n        pushUndo();\n        const sys=state.systems[state.activeSys];\n        const pipe={id:state.nextPipeId++, sysId:sys.id, floor:state.activeFloor,\n          points:[...state.pipePath], size:PIPE_DEFAULT.suc, liq:PIPE_DEFAULT.liq, lw:PIPE_DEFAULT.lw, col:PIPE_DEFAULT.col, sized:false, riserId:riserHit.id};\n        state.pipes.push(pipe);\n        state.pipePath=[]; state._snapRiserId=null;\n        drawCanvas(); renderComponentsList?.(); updateLegendLabels?.();\n        promptPipeHeight(pipe, riserHit);\n        triggerAutoSave?.();\n        return;\n      }\n      const conn=nearestConnection(pos);\n      const target = conn ? {x:conn.x, y:conn.y, unitId:conn.unitId} : null;\n      if(target){\n        // Terminating on a unit connection — route orthogonally with an auto-corner\n        // if the target isn't already aligned horizontally/vertically with prev.\n        const dx=Math.abs(target.x-prev.x), dy=Math.abs(target.y-prev.y);\n        const tol=0.5;\n        if(dx>tol && dy>tol){\n          // Insert an L-corner. Go along the longer axis first, then into the unit.\n          const corner = dx>=dy ? {x:target.x, y:prev.y} : {x:prev.x, y:target.y};\n          state.pipePath.push(corner);\n        }\n        state.pipePath.push(target);\n      } else {\n        // Free point — snap orthogonally to previous point\n        state.pipePath.push(orthoSnap(prev, pos));\n      }\n    }\n    drawCanvas(); return;\n  }\n\n  if(state.tool==='tjunction'){\n    // Snap to the nearest point on any pipe run on this floor\n    const snap=nearestPointOnPipes(pos);\n    const p = snap || pos;\n    pushUndo();\n    state.junctions.push({\n      id:(state._nextJunctionId=(state._nextJunctionId||0)+1),\n      floor:state.activeFloor,\n      sysId:state.systems[state.activeSys].id,\n      x:p.x, y:p.y\n    });\n    drawCanvas();\n    triggerAutoSave?.();\n    notify('T-junction placed','ok'); renderComponentsList();\n    return;\n  }\n\n  if(state.tool==='bcbox'){\n    const sys=state.systems[state.activeSys];\n    // Count advanced indoor units in this system to auto-select BC model\n    const advRooms=state.rooms.filter(r=>r.sysId===sys.id && r.floor===state.activeFloor\n      && r.units && r.units.some(u=>ADVANCED_IDU_TYPES.has(u.type)));\n    const totalUnits=advRooms.reduce((s,r)=>s+(r.units?.length||0),0);\n    const bc=selectBCBox(Math.max(totalUnits,4));\n    pushUndo();\n    state.bcBoxes.push({\n      id:(state._nextBCId=(state._nextBCId||0)+1),\n      floor:state.activeFloor,\n      sysId:sys.id,\n      x:pos.x, y:pos.y,\n      model:bc.model,\n      branches:bc.branches,\n      label:bc.label,\n    });\n    drawCanvas();\n    renderRoomsSidebar();\n    triggerAutoSave?.();\n    notify(`${bc.label} placed · ${bc.branches} ports · ${bc.model}`,'ok'); renderComponentsList();\n    return;\n  }\n\n  // Rectangle room tool — start drag\n  if(state.tool==='rect'){\n    state._rectStart = pos;\n    state._rectEnd   = pos;\n    return;\n  }\n\n  // Eraser tool — delete whatever is clicked\n  if(state.tool==='eraser'){\n    const HIT = 14/state.vp.zoom;\n    // Units first\n    const hitUnit = findUnitAt(pos);\n    if(hitUnit){\n      pushUndo();\n      state.placedUnits = state.placedUnits.filter(u=>u.id!==hitUnit.id);\n      state.selectedUnit = null;\n      hideInspector?.();\n      drawCanvas(); renderRoomsSidebar(); buildUnitPalette(); renderComponentsList();\n      notify(`Deleted ${hitUnit.model}`,'ok'); triggerAutoSave?.(); return;\n    }\n    // Pipes — delete nearest segment only\n    let nearestPipe=null, nearestSegIdx=-1, nearestDist=HIT;\n    state.pipes.filter(p=>p.floor===state.activeFloor).forEach(pipe=>{\n      for(let i=1;i<pipe.points.length;i++){\n        const a=pipe.points[i-1],b=pipe.points[i];\n        const dx=b.x-a.x,dy=b.y-a.y,len2=dx*dx+dy*dy;\n        if(len2===0) continue;\n        const t=Math.max(0,Math.min(1,((pos.x-a.x)*dx+(pos.y-a.y)*dy)/len2));\n        const dist=Math.hypot(pos.x-(a.x+t*dx),pos.y-(a.y+t*dy));\n        if(dist<nearestDist){ nearestDist=dist; nearestPipe=pipe; nearestSegIdx=i; }\n      }\n    });\n    if(nearestPipe){\n      pushUndo();\n      if(nearestPipe.points.length<=2){\n        // Only one segment — delete the whole pipe\n        state.pipes=state.pipes.filter(p=>p.id!==nearestPipe.id);\n      } else {\n        // Remove just the segment (delete the point at nearestSegIdx)\n        nearestPipe.points.splice(nearestSegIdx,1);\n      }\n      drawCanvas(); renderComponentsList(); updateLegendLabels();\n      notify('Pipe segment deleted','ok'); triggerAutoSave?.(); return;\n    }\n    // Junctions\n    const hitJ=(state.junctions||[]).find(j=>j.floor===state.activeFloor&&Math.hypot(pos.x-j.x,pos.y-j.y)<HIT*1.5);\n    if(hitJ){\n      pushUndo(); state.junctions=state.junctions.filter(j=>j.id!==hitJ.id);\n      drawCanvas(); renderComponentsList(); notify('T-junction deleted','ok'); triggerAutoSave?.(); return;\n    }\n    // BC boxes\n    const hitBC=(state.bcBoxes||[]).find(b=>{\n      if(b.floor!==state.activeFloor) return false;\n      const bd=BC_DATA.find(d=>d.model===b.model)||BC_DATA[0];\n      const bw=state.scale?(bd.w/1000*state.scale):60,bh=state.scale?(bd.d/1000*state.scale):30;\n      return Math.abs(pos.x-b.x)<bw/2+4&&Math.abs(pos.y-b.y)<bh/2+4;\n    });\n    if(hitBC){\n      pushUndo(); state.bcBoxes=state.bcBoxes.filter(b=>b.id!==hitBC.id);\n      drawCanvas(); renderComponentsList(); notify('BC Controller deleted','ok'); triggerAutoSave?.(); return;\n    }\n    // Risers\n    const hitR=state.risers.find(r=>r.floor===state.activeFloor&&Math.hypot(pos.x-r.x,pos.y-r.y)<20);\n    if(hitR){\n      pushUndo(); state.risers=state.risers.filter(r=>r.id!==hitR.id);\n      drawCanvas(); renderComponentsList(); notify('Riser deleted','ok'); triggerAutoSave?.(); return;\n    }\n    return;\n  }\n\n  // Wall selection mode — intercept all clicks\n  if(state.tool==='wallselect'){\n    handleWallSelectClick(pos);\n    return;\n  }\n\n  if(state.tool==='north'){\n    // First placement — no arrow yet\n    if(!state.northArrow){\n      pushUndo();\n      state.northArrow = {x:pos.x, y:pos.y, bearing:0};\n      autoDetectOrientations();\n      renderRoomsSidebar();\n      updateNorthReadout();\n      setTool('select');\n      drawCanvas();\n      notify('North set — drag the N to rotate to true north, drag the centre to move','ok');\n    }\n    return;\n  }\n\n  // North arrow interactions in Select mode — hit-test centre and N tip\n  if(state.tool==='select' && state.northArrow){\n    const na = state.northArrow;\n    const z  = state.vp.zoom;\n    const sz = Math.max(28, 44/z);\n    const rad = na.bearing * Math.PI/180;\n    const fs  = Math.max(9, 11/z);\n    // N tip position in canvas coords\n    const tipDist = sz*0.5 + fs*0.9;\n    const tipX = na.x + Math.sin(rad)*tipDist;\n    const tipY = na.y - Math.cos(rad)*tipDist;\n    const dTip = Math.hypot(pos.x-tipX, pos.y-tipY);\n    const dCentre = Math.hypot(pos.x-na.x, pos.y-na.y);\n    if(dTip < sz*0.45){\n      // Drag N tip → rotate\n      state._northDragging = 'rotate';\n      e.stopPropagation();\n      return;\n    }\n    if(dCentre < sz*0.55){\n      // Drag centre → move\n      state._northDragging = 'move';\n      state._northDragOffset = {dx: na.x-pos.x, dy: na.y-pos.y};\n      e.stopPropagation();\n      return;\n    }\n  }\n\n  if(state.tool==='riser'){\n    const sys = state.systems[state.activeSys];\n    const riserLabel = `R-${String.fromCharCode(65+state.risers.length)}`;\n    pushUndo();\n    const riser={id:state.nextRiserId++, sysId:sys.id, floor:state.activeFloor, x:pos.x, y:pos.y, label:riserLabel, dir:'up', groupId:(state._nextRiserGroup=(state._nextRiserGroup||0)+1)};\n    state.risers.push(riser);\n    setTool('select');\n    drawCanvas(); updatePlacedList(); renderComponentsList();\n    showRiserConfig(riser);\n    return;\n  }\n\n  if(state.tool==='select'){\n    // Rotate handle of the already-selected unit takes priority\n    if(state.selectedUnit){\n      const rh = rotateHandlePos(state.selectedUnit);\n      if(rh && Math.hypot(pos.x-rh.x, pos.y-rh.y) < 11/state.vp.zoom){\n        pushUndo();\n        state._rotDrag = state.selectedUnit;\n        return;\n      }\n    }\n    const hit = findUnitAt(pos);\n    if(hit){\n      state.selectedUnit = hit.id;\n      state.unitDrag = {startPos:pos, unitStart:{x:hit.x, y:hit.y}, moved:false};\n      showInspector(hit);\n      drawCanvas();\n    } else {\n      // Clicked empty space — deselect and start panning\n      state.selectedUnit = null;\n      hideInspector();\n      state._isPanning = true;\n      state._panStart  = {mx: e.clientX, my: e.clientY, vx: state.vp.x, vy: state.vp.y};\n      wrap.className   = 'mode-panning';\n      drawCanvas();\n    }\n  }\n}\n\nfunction canvasMouseMove(e){\n  const pos = getCanvasCoords(e);\n  state._mousePos = pos;\n\n  // Snap-confirmation glow: T-junction over a pipe, or pipe-end over a riser\n  if(state.tool==='tjunction'){\n    const snap=nearestPointOnPipes(pos);\n    const id=snap?snap.pipeId:null;\n    if(id!==state._snapPipeId){ state._snapPipeId=id; drawCanvas(); }\n  } else if(state.tool==='pipe'){\n    const rs=nearestRiser(pos);\n    const id=rs?rs.id:null;\n    if(id!==state._snapRiserId){ state._snapRiserId=id; drawCanvas(); }\n  }\n\n  // Pan\n  if(state._isPanning && state._panStart){\n    state.vp.x = state._panStart.vx + (e.clientX - state._panStart.mx);\n    state.vp.y = state._panStart.vy + (e.clientY - state._panStart.my);\n    applyTransform(); return;\n  }\n\n  // Crop preview\n  if(state._cropDrawing && state.cropStart){\n    drawCanvas(); return;\n  }\n\n  // Rect room tool live preview\n  if(state.tool==='rect' && state._rectStart){\n    state._rectEnd = pos;\n    drawCanvas();\n    return;\n  }\n\n  // North arrow drag — rotate or move\n  if(state._northDragging && state.northArrow){\n    if(state._northDragging === 'rotate'){\n      const dx = pos.x - state.northArrow.x;\n      const dy = pos.y - state.northArrow.y;\n      if(Math.abs(dx)>1 || Math.abs(dy)>1){\n        state.northArrow.bearing = ((Math.atan2(dx, -dy)*180/Math.PI) % 360 + 360) % 360;\n        autoDetectOrientations();\n        renderRoomsSidebar();\n        updateNorthReadout();\n      }\n    } else if(state._northDragging === 'move'){\n      state.northArrow.x = pos.x + state._northDragOffset.dx;\n      state.northArrow.y = pos.y + state._northDragOffset.dy;\n    }\n    drawCanvas(); return;\n  }\n\n  // Rotate handle drag — free spin, snaps to 90° on release\n  if(state._rotDrag){\n    const u = state.placedUnits.find(x=>x.id===state._rotDrag);\n    if(u){\n      const ang = Math.atan2(pos.x-u.x, -(pos.y-u.y)) * 180/Math.PI;\n      u.rotation = ((ang%360)+360)%360;\n      updateUnitControls();\n      drawCanvas();\n    }\n    return;\n  }\n\n  // Unit drag\n  if(state.unitDrag && state.selectedUnit){\n    const unit = state.placedUnits.find(u=>u.id===state.selectedUnit);\n    if(unit){\n      unit.x = pos.x - (state.unitDrag.startPos.x - state.unitDrag.unitStart.x);\n      unit.y = pos.y - (state.unitDrag.startPos.y - state.unitDrag.unitStart.y);\n      state.unitDrag.moved = true;\n      updateUnitControls();\n    }\n  }\n\n  // Coords badge\n  const cb = document.getElementById('coords-badge');\n  if(cb && state.scale){\n    cb.textContent = `x: ${(pos.x/state.scale).toFixed(1)}m  y: ${(pos.y/state.scale).toFixed(1)}m`;\n  } else if(cb){\n    cb.textContent = `x: ${Math.round(pos.x)}px  y: ${Math.round(pos.y)}px`;\n  }\n\n  // Room + unit hover cards\n  const roomCard = document.getElementById('room-hover-card');\n  const unitCard = document.getElementById('unit-hover-card');\n  const CARD_LEFT = 10;\n\n  // Unit hover — check first (units sit on top of rooms)\n  const hovUnit = !state._isPanning && !state.unitDrag ? findUnitAt(pos) : null;\n  if(hovUnit && unitCard){\n    let ud, label;\n    if(hovUnit.type === 'odu'){\n      const odu = ODU_DATA.find(o=>o.model===hovUnit.model);\n      ud = odu || {w:1050, d:460, h:800};\n      label = 'Outdoor unit';\n    } else {\n      ud = UNIT_DATA[hovUnit.model] || {};\n      label = ud.label || hovUnit.type || 'Indoor unit';\n    }\n    document.getElementById('uhc-name').textContent  = hovUnit.model;\n    document.getElementById('uhc-type').textContent  = label;\n    document.getElementById('uhc-kw').textContent    = hovUnit.kw ? hovUnit.kw + ' kW' : '—';\n    document.getElementById('uhc-dims').textContent  = ud.w ? `${ud.w} × ${ud.d} × ${ud.h} mm` : '—';\n    unitCard.classList.add('visible');\n  } else if(unitCard){\n    unitCard.classList.remove('visible');\n  }\n\n  // Room hover\n  const hoveredPoly = !state._isPanning && !state.unitDrag ? state.polygons.find(p=>\n    p.floor===state.activeFloor && p.points && p.points.length>2 &&\n    pointInPoly(pos.x, pos.y, p.points)\n  ) : null;\n  if(hoveredPoly && roomCard){\n    const room = state.rooms.find(r=>r.id===hoveredPoly.roomId);\n    if(room){ vComp={type:'riser',id:r.id,obj:r}; break; }\n    }\n  }\n\n  if(hovComp && compCard){\n    const obj=hovComp.obj;\n    let name='', type='', label2='Detail', detail='';\n    if(hovComp.type==='pipe'){\n      name=fmtPipePair(obj.liq,obj.size);\n      type='Pipe run';\n      label2='Length';\n      let len=null;\n      if(state.scale&&obj.points?.length>=2){\n        let l=0; for(let i=1;i<obj.points.length;i++) l+=Math.hypot(obj.points[i].x-obj.points[i-1].x,obj.points[i].y-obj.points[i-1].y);\n        len=Math.round(l/state.scale*10)/10;\n      }\n      detail=len?len+'m':'—';\n    } else if(hovComp.type==='junction'){\n      name='T-junction'; type='Branch point'; label2='System';\n      const sys=state.systems.find(s=>s.id===obj.sysId);\n      detail=sys?sys.name:'—';\n    } else if(hovComp.type==='bc'){\n      name=obj.model; type='BC Controller'; label2='Ports'; detail=obj.branches+' port branch circuit';\n    } else if(hovComp.type==='riser'){\n      name='Riser '+obj.label; type='Vertical connection'; label2='System';\n      const sys=state.systems.find(s=>s.id===obj.sysId);\n      detail=sys?sys.name:'—';\n    }\n    document.getElementById('chc-name').textContent   = name;\n    document.getElementById('chc-type').textContent   = type;\n    document.getElementById('chc-label2').textContent = label2;\n    document.getElementById('chc-detail').textContent = detail;\n    compCard.classList.add('visible');\n  } else if(compCard){\n    compCard.classList.remove('visible');\n  }\n\n  // Position all visible cards side by side, anchored to canvas-wrap top-left in screen coords\n  const CGAP=8, CPAD=10;\n  const wr = document.getElementById('canvas-wrap')?.getBoundingClientRect();\n  const baseLeft = wr ? wr.left + CPAD : CPAD;\n  const baseTop  = wr ? wr.top  + CPAD : CPAD;\n  let nextLeft = baseLeft;\n  [roomCard, unitCard, compCard].forEach(c=>{\n    if(c && c.classList.contains('visible')){\n      c.style.left = nextLeft + 'px';\n      c.style.top  = baseTop  + 'px';\n      nextLeft += (c.offsetWidth || 175) + CGAP;\n    }\n  });\n\n  drawCanvas();\n}\n\nfunction canvasMouseUp(e){\n  // End pan\n  if(state._isPanning){\n    state._isPanning = false;\n    state._panStart  = null;\n    const wrap = document.getElementById('canvas-wrap');\n    wrap.className = 'mode-'+state.tool;\n  }\n  // End rotate-handle drag — snap to nearest 90°\n  if(state._rotDrag){\n    const u = state.placedUnits.find(x=>x.id===state._rotDrag);\n    if(u){ u.rotation = (Math.round((u.rotation||0)/90)*90)%360; updateUnitControls(); drawCanvas(); triggerAutoSave?.(); }\n    state._rotDrag = null;\n    return;\n  }\n  // Confirm crop rect\n  if(state._cropDrawing && state.cropStart && state._mousePos){\n    const p = state._mousePos;\n    const s = state.cropStart;\n    const x = Math.min(s.x,p.x), y = Math.min(s.y,p.y);\n    const w = Math.abs(p.x-s.x),   h = Math.abs(p.y-s.y);\n    if(w>10 && h>10){\n      state.crop = {x,y,w,h};\n      // Redraw canvas clipped to crop region\n      applyCrop();\n    }\n    state._cropDrawing = false;\n    state.cropStart = null;\n    setTool('select');\n  }\n  // Rect tool — commit on mouseup\n  if(state.tool==='rect' && state._rectStart && state._rectEnd){\n    const s = state._rectStart, e = state._rectEnd;\n    const minX=Math.min(s.x,e.x), maxX=Math.max(s.x,e.x);\n    const minY=Math.min(s.y,e.y), maxY=Math.max(s.y,e.y);\n    const w = maxX-minX, h = maxY-minY;\n    state._rectStart = null; state._rectEnd = null;\n    // Need minimum size\n    if(w < 5 || h < 5){ drawCanvas(); return; }\n    // Build a 4-point polygon clockwise: TL → TR → BR → BL\n    const poly = {\n      points:[\n        {x:minX,y:minY},{x:maxX,y:minY},\n        {x:maxX,y:maxY},{x:minX,y:maxY}\n      ],\n      color:'#f59e0b',\n      floor: state.activeFloor,\n    };\n    let area=0;\n    const pts=poly.points;\n    for(let i=0;i<pts.length;i++){\n      const j=(i+1)%pts.length;\n      area+=pts[i].x*pts[j].y - pts[j].x*pts[i].y;\n    }\n
