''}`,margin+3,y+5);\n    y+=10;\n\n    // Indoor units table\n    doc.autoTable({\n      startY: y,\n      margin: {left:margin, right:margin},\n      head:[['Model','Room','Capacity','Type']],\n      body: sysRooms.map(r=>[\n        r.model, r.name||'Room',\n        `${r.kw.toFixed(1)} kW`,\n        UNIT_DATA[r.model]?.label||''\n      ]),\n      styles:{fontSize:8, cellPadding:2},\n      headStyles:{fillColor:[60,60,60], textColor:255, fontStyle:'bold'},\n      alternateRowStyles:{fillColor:[248,249,252]},\n      columnStyles:{0:{font:'courier', cellWidth:52}, 2:{cellWidth:22, halign:'right'}}\n    });\n    y = doc.lastAutoTable.finalY + 4;\n\n    // Outdoor unit\n    if(sys.odu){\n      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(80,80,80);\n      doc.text(`Outdoor Unit: ${sys.odu.model}  |  ${sys.odu.kw} kW cooling / ${sys.odu.heat} kW heating  |  ${sys.odu.phase===3?'3Ø 415V':'1Ø 240V'}`,margin,y+4);\n      y+=8;\n    }\n\n    // Pipe summary\n    const pipeRows = Object.entries(pipeGroups).map(([k,v])=>[k, `${v>0?v:'—'} m`, 'Refrigerant pair']);\n    if(sysRisers.length) pipeRows.push([`Riser ×${sysRisers.length}`, `${sysRisers.length*floorH} m`, 'Vertical rise']);\n    pipeRows.push(['25mm condensate drain', `${sysRooms.length} m est.`, 'Drain pipe']);\n\n    if(pipeRows.length){\n      doc.autoTable({\n        startY: y,\n        margin:{left:margin,right:margin},\n        head:[['Pipework','Length','Notes']],\n        body: pipeRows,\n        styles:{fontSize:8, cellPadding:2},\n        headStyles:{fillColor:[90,90,90], textColor:255, fontStyle:'bold'},\n        alternateRowStyles:{fillColor:[248,249,252]},\n        columnStyles:{0:{font:'courier', cellWidth:70}, 1:{cellWidth:28, halign:'right'}}\n      });\n      y = doc.lastAutoTable.finalY + 8;\n    }\n\n    if(y > 260){ doc.addPage(); y=margin; }\n  });\n\n  // ── Floor plan image (first floor with an image) ──\n  const floorWithImg = state.floors.find(f=>f.imageData);\n  if(floorWithImg){\n    if(y>180){doc.addPage();y=margin;}\n    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(80,80,80);\n    doc.text('FLOOR PLAN — '+floorWithImg.name.toUpperCase(), margin, y+4);\n    y+=8;\n    const imgW=W-margin*2, maxH=100;\n    const img=new Image(); img.src=floorWithImg.imageData;\n    const ratio=img.naturalHeight/img.naturalWidth;\n    const imgH=Math.min(imgW*ratio, maxH);\n    doc.addImage(floorWithImg.imageData,'JPEG',margin,y,imgW,imgH);\n    y+=imgH+6;\n  }\n\n  // ── Footer ──\n  const pageCount = doc.internal.getNumberOfPages();\n  for(let i=1;i<=pageCount;i++){\n    doc.setPage(i);\n    doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(160,160,160);\n    doc.text(`${jd.company} · VRF System Design · ${jd.jobnum||'Draft'}`,margin,295);\n    doc.text(`Page ${i} of ${pageCount}`,W-margin,295,{align:'right'});\n  }\n\n  const filename = `VRF_${(jd.jobnum||'Design').replace(/\\s+/g,'_')}_${jd.date||'draft'}.pdf`;\n  doc.save(filename);\n  notify(`PDF exported: ${filename}`,'ok');\n}\n\nfunction saveAndExport(){\n  saveDesign();\n  exportPDF();\n}\n\nfunction updateTopbar(){\n  const jd=getJobDetails();\n  const el=document.getElementById('topbar-job');\n  if(!el) return;\n  const parts=[];\n  // Use DOM value first, fall back to state.currentJobnum\n  const jobnum = jd.jobnum || state.currentJobnum || '';\n  if(jobnum) parts.push(`<span style=\"font-weight:600\">${jobnum}<\u002Fspan>`);\n  if(jd.client) parts.push(jd.client);\n  if(jd.address) parts.push(jd.address);\n  el.innerHTML=parts.length?parts.join(' &nbsp;·&nbsp; '):'New design';\n}\n\n// ═══════════════════════════════════════════════\n// NOTIFICATIONS\n// ═══════════════════════════════════════════════\nfunction notify(msg,type=''){\n  const container=document.getElementById('notif');\n  const el=document.createElement('div');\n  el.className='notif-item'+(type?' '+type:'');\n  el.textContent=msg;\n  container.appendChild(el);\n  setTimeout(()=>el.remove(),3000);\n}\n\n// Theme controlled by parent app via data-theme on <html>\nfunction toggleTheme(){\n  const isDark = document.documentElement.getAttribute('data-theme')==='dark';\n  document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');\n}\n\n// Right panel tab switcher\nfunction switchRpTab(tab){\n  ['system','legend'].forEach(t=>{\n    document.getElementById('rp-tab-'+t)?.classList.toggle('active', t===tab);\n    const body = document.getElementById('rp-body-'+t);\n    if(body) body.style.display = (t===tab) ? 'flex' : 'none';\n  });\n}\n\n// ═══════════════════════════════════════════════\n// INIT\n// ═══════════════════════════════════════════════\ndocument.addEventListener('keydown',e=>{\n  if(e.key===' '&&!state._spaceDown&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){\n    e.preventDefault(); state._spaceDown=true;\n    const w=document.getElementById('canvas-wrap'); if(w) w.className='mode-pan'; return;\n  }\n  if(document.getElementById('pdf-lightbox')?.classList.contains('show')){\n    if(e.key==='ArrowLeft') lightboxNav(-1);\n    if(e.key==='ArrowRight') lightboxNav(1);\n    if(e.key==='Escape') closeLightbox();\n    if(e.key===' '){e.preventDefault();lightboxToggleSelect();}\n    return;\n  }\n  if(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA') return;\n  // Cmd+Z (Mac) or Ctrl+Z (Win) — undo\n  if((e.metaKey||e.ctrlKey) && (e.key==='z'||e.key==='Z')){ e.preventDefault(); undo(); return; }\n  if(e.key==='v'||e.key==='V') setTool('select');\n  if(e.key==='p'||e.key==='P') setTool('pipe');\n  if(e.key==='b'||e.key==='B') setTool('poly');\n  if(e.key==='r'||e.key==='R') setTool('rect');\n  if(e.key==='e'||e.key==='E') setTool('eraser');\n  if(e.key==='c'||e.key==='C') setTool('calib');\n  if(e.key==='f'||e.key==='F') fitCanvas();\n  if(e.key==='='||e.key==='+') zoomBy(0.25);\n  if(e.key==='-') zoomBy(-0.25);\n  if(e.key==='r'||e.key==='R'){e.preventDefault();rotateSelected(e.shiftKey?-90:90);}\n  if((e.key==='Delete'||e.key==='Backspace')&&state.selectedUnit){e.preventDefault();deleteSelected();}\n  if(e.key==='Escape'){\n    if(state.tool==='pipe'){state.pipePath=[];drawCanvas();}\n    state._cropDrawing=false;state.cropStart=null;setTool('select');\n  }\n});\ndocument.addEventListener('keyup',e=>{\n  if(e.key===' '){\n    state._spaceDown=false;\n    if(!state._isPanning){const w=document.getElementById('canvas-wrap');if(w) w.className='mode-'+state.tool;}\n  }\n});\n\n// ── Drag image ────────────────────────────────────────────\nfunction setDragImage(e, model, kw, color, type){\n  const ud = type==='odu'\n    ? (ODU_DATA.find(o=>o.model===model)||{w:800,d:400})\n    : (UNIT_DATA[model]||{w:570,d:230});\n  // Scale to a max 100px wide drag ghost\n  const MAX=100;\n  const ratio=ud.d/ud.w;\n  const pw=MAX, ph=Math.max(20, Math.round(MAX*ratio));\n  const gc=document.createElement('canvas');\n  gc.width=pw; gc.height=ph+16;\n  const gx=gc.getContext('2d');\n  // Body\n  gx.fillStyle=color+'33'; gx.strokeStyle=color; gx.lineWidth=2;\n  gx.beginPath(); gx.roundRect(0,0,pw,ph,3); gx.fill(); gx.stroke();\n  // Grille\n  gx.strokeStyle=color+'66'; gx.lineWidth=0.8;\n  const n=Math.floor(pw/8);\n  for(let i=1;i<n;i++){const x=i*(pw/n);gx.beginPath();gx.moveTo(x,3);gx.lineTo(x,ph-3);gx.stroke();}\n  // Arrow\n  gx.fillStyle=color+'cc';\n  gx.beginPath();gx.moveTo(pw/2,0);gx.lineTo(pw/2-6,8);gx.lineTo(pw/2+6,8);gx.closePath();gx.fill();\n  // Label\n  const short = type==='odu'\n    ? model.replace(/PUMY-|PUHY-/,'').replace(/-A\\d?$/,'')\n    : model.replace('PEFY-P','').replace('-E','');\n  gx.fillStyle=color; gx.font=`bold ${Math.max(8,Math.min(10,pw/8))}px IBM Plex Mono,monospace`;\n  gx.textAlign='center'; gx.textBaseline='middle'; gx.fillText(short,pw/2,ph/2);\n  // kW below\n  gx.fillStyle=color+'aa'; gx.font=`9px Hanken Grotesk,sans-serif`;\n  gx.fillText(`${kw} kW`,pw/2,ph+10);\n  e.dataTransfer.setDragImage(gc, pw/2, ph/2);\n}\n\n// ── Grayscale toggle ──────────────────────────────────────\nfunction setBrightness(val){\n  state.brightness=parseFloat(val);\n  if(state.grayscale) drawCanvas();\n}\n\n// ── Room sidebar (merged design step) ────────────────────\nfunction renderComponentsList(){\n  const el = document.getElementById('sidebar-components-list');\n  if(!el) return;\n  const floor = state.activeFloor;\n  const sys   = state.systems[state.activeSys];\n\n  const pipes    = state.pipes.filter(p=>p.floor===floor && p.sysId===sys.id);\n  const juncs    = state.junctions.filter(j=>j.floor===floor && j.sysId===sys.id);\n  const bcBoxes  = state.bcBoxes.filter(b=>b.floor===floor && b.sysId===sys.id);\n  const risers   = state.risers.filter(r=>r.floor===floor && r.sysId===sys.id);\n  const _pn=document.getElementById('acc-parts-n'); if(_pn){ const _c=pipes.length+juncs.length+bcBoxes.length+risers.length; _pn.textContent=_c?`${_c} item${_c>1?'s':''}`:'none'; }\n  { const _c=pipes.length+juncs.length+bcBoxes.length+risers.length; const _pp=document.getElementById('rp-pill-parts'); if(_pp) _pp.textContent=_c||''; }\n\n  if(!pipes.length && !juncs.length && !bcBoxes.length && !risers.length){\n    el.innerHTML='<div style=\"padding:18px 12px;text-align:center;font-size:12px;color:var(--ssx-faint);line-height:1.5\">No components placed yet<\u002Fdiv>';\n    return;\n  }\n\n  // Helper: pipe length in metres\n  function pipeLen(pipe){\n    const sc = (pipe.floor!=null) ? scaleForFloor(pipe.floor, state.scale) : state.scale;\n    if(!sc || !pipe.points || pipe.points.length<2) return null;\n    let len=0;\n    for(let i=1;i<pipe.points.length;i++){\n      len+=Math.hypot(pipe.points[i].x-pipe.points[i-1].x, pipe.points[i].y-pipe.points[i-1].y);\n    }\n    return Math.round(len/sc*10)/10;\n  }\n\n  // Helper: find pipes near a point (for T-junction labelling)\n  function pipesNearPoint(x, y, threshold=18){\n    const near=[];\n    pipes.forEach(pipe=>{\n      const pts=pipe.points;\n      for(let i=1;i<pts.length;i++){\n        const a=pts[i-1], b=pts[i];\n        const dx=b.x-a.x, dy=b.y-a.y;\n        const len2=dx*dx+dy*dy;\n        if(len2===0) continue;\n        let t=((x-a.x)*dx+(y-a.y)*dy)/len2;\n        t=Math.max(0,Math.min(1,t));\n        const dist=Math.hypot(x-(a.x+t*dx), y-(a.y+t*dy));\n        if(dist<threshold){ near.push(pipe); break; }\n      }\n    });\n    return near;\n  }\n\n  // Helper: format pipe size using global unit preference\n  function fmtPipe(pipe){ return fmtPipePair(pipe.liq, pipe.size||pipe.suc); }\n\n  const items=[];\n\n  // Pipe runs\n  pipes.forEach((pipe,i)=>{\n    const len = pipeLen(pipe);\n    items.push({\n      type: 'pipe', id: pipe.id,\n      color: pipe.col || '#06b6d4',\n      name:  `Pipe run ${i+1}`,\n      detail: fmtPipePair(pipe.liq, pipe.size) + (len ? ' · ' + len + 'm' : ''),\n    });\n  });\n\n  // T-junctions\n  juncs.forEach((j,i)=>{\n    const near = pipesNearPoint(j.x, j.y);\n    const uniq = [...new Map(near.map(p=>[p.liq+'/'+p.size, p])).values()];\n    let detail='';\n    if(uniq.length>=2){\n      uniq.sort((a,b)=>(b.liq+b.size)-(a.liq+a.size));\n      detail = fmtPipe(uniq[0]) + ' → ' + uniq.slice(1).map(fmtPipe).join(' + ');\n    } else if(near.length){\n      detail = fmtPipe(near[0]);\n    } else {\n      detail = '—';\n    }\n    items.push({\n      type: 'junction', id: j.id,\n      color: sys.color,\n      name:  `T-junction ${i+1}`,\n      detail,\n    });\n  });\n\n  // BC Controllers\n  bcBoxes.forEach(b=>{\n    items.push({\n      type: 'bc', id: b.id,\n      color: '#374151',\n      name:  b.model,\n      detail: `BC Controller · ${b.branches} ports`,\n    });\n  });\n\n  // Risers\n  risers.forEach(r=>{\n    items.push({\n      type: 'riser', id: r.id,\n      color: '#6366f1',\n      name:  `Riser ${r.label}`,\n      detail: 'Vertical connection',\n    });\n  });\n\n  el.innerHTML = items.map(item=>{\n    const isHL = state._highlightComp?.type===item.type && state._highlightComp?.id===item.id;\n    return `<div class=\"comp-item\" style=\"cursor:pointer;background:${isHL?'var(--ssx-accent-bg)':''};border-radius:5px;padding:5px 4px;margin:0 -4px\"\n      onclick=\"highlightComp('${item.type}','${item.id}')\">\n      <div class=\"comp-dot\" style=\"background:${item.color}\"><\u002Fdiv>\n      <div style=\"flex:1;min-width:0\">\n        <div class=\"comp-name\">${item.name}<\u002Fdiv>\n        <div class=\"comp-detail\">${item.detail}<\u002Fdiv>\n      <\u002Fdiv>\n      <button onclick=\"event.stopPropagation();deleteComp('${item.type}','${item.id}')\"\n        style=\"background:none;border:none;cursor:pointer;color:var(--ssx-faint);font-size:13px;padding:0 2px;line-height:1;flex-shrink:0\"\n        title=\"Delete\">✕<\u002Fbutton>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction highlightComp(type, id){\n  // Parse id — may be numeric\n  const nid = isNaN(id) ? id : Number(id);\n  // Toggle off if already highlighted\n  if(state._highlightComp?.type===type && state._highlightComp?.id===nid){\n    state._highlightComp = null;\n  } else {\n    state._highlightComp = {type, id:nid};\n  }\n  drawCanvas();\n  renderComponentsList();\n}\n\nfunction deleteComp(type, id){\n  const nid = isNaN(id) ? id : Number(id);\n  pushUndo();\n  if(type==='pipe')     state.pipes     = state.pipes.filter(p=>p.id!==nid);\n  if(type==='junction') state.junctions = state.junctions.filter(j=>j.id!==nid);\n  if(type==='bc')       state.bcBoxes   = (state.bcBoxes||[]).filter(b=>b.id!==nid);\n  if(type==='riser')    state.risers    = state.risers.filter(r=>r.id!==nid);\n  if(state._highlightComp?.type===type && state._highlightComp?.id===nid){\n    state._highlightComp = null;\n  }\n  drawCanvas();\n  renderComponentsList();\n  updateLegendLabels();\n  triggerAutoSave?.();\n}\n\nfunction renderRoomsSidebar(){\n  const container=document.getElementById('sidebar-rooms-list');\n  if(!container) return;\n  const sys=state.systems[state.activeSys];\n  const sysRooms=state.rooms.filter(r=>r.sysId===sys.id && r.floor===state.activeFloor);\n  const _allSysRooms=state.rooms.filter(r=>r.sysId===sys.id);\n  const _kw=_allSysRooms.reduce((s,r)=>s+(r.kw||0),0);\n  const _rn=document.getElementById('acc-rooms-n'); if(_rn) _rn.textContent=`${_allSysRooms.length} · ${_kw.toFixed(1)} kW`;\n  const _rp=document.getElementById('rp-pill-rooms'); if(_rp) _rp.textContent=_allSysRooms.length||'';\n\n  if(!sysRooms.length){\n    container.innerHTML=`<div style=\"padding:18px 12px;font-size:12px;color:var(--ssx-faint);text-align:center;line-height:1.5\">\n      Draw room boundaries on the plan<br>using the <strong>Room (B)<\u002Fstrong> tool\n    <\u002Fdiv>`;\n    return;\n  }\n\n  container.innerHTML = sysRooms.map(room=>{\n    const units   = room.units||[{model:room.model,kw:room.kw,type:'VMX'}];\n    const placed  = state.placedUnits.filter(u=>u.roomId===room.id);\n    const totalU  = units.reduce((s,u)=>s+(u.kw||0),0);\n    const unitsMet  = totalU >= room.kw;\n    const allPlaced = placed.length >= units.length;\n    const complete  = unitsMet && allPlaced;\n    const hasPoly   = state.polygons.some(p=>p.roomId===room.id);\n    const open      = !!room._pillOpen;\n\n    const statusCol = complete ? 'var(--ssx-ok)' : unitsMet ? 'var(--ssx-accent)' : 'var(--ssx-warn)';\n    const statusIcon = complete\n      ? `<svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"var(--ssx-ok)\" stroke-width=\"2.2\" stroke-linecap=\"round\" style=\"flex-shrink:0\"><path d=\"M2.5 7l3 3 6-6\"/><\u002Fsvg>`\n      : `<div style=\"width:8px;height:8px;border-radius:50%;background:${statusCol};flex-shrink:0;margin-top:1px\"><\u002Fdiv>`;\n\n    const statusBadge = complete ? '' :\n      `<div style=\"font-size:9px;font-weight:700;color:${statusCol};flex-shrink:0;white-space:nowrap\">\n        ${!unitsMet?'Undersize':'Not placed'}\n      <\u002Fdiv>`;\n\n    return `\n    <div style=\"border:1.5px solid ${complete?'var(--ssx-ok)':'var(--ssx-border)'};border-radius:7px;overflow:hidden;margin-bottom:5px;${complete?'background:#f0fdf4':''}\">\n\n      <!-- Main pill row — outer flex, only info area triggers highlight -->\n      <div style=\"display:flex;align-items:center;gap:6px;padding:7px 8px\">\n        <!-- Clickable info zone -->\n        <div style=\"display:flex;align-items:center;gap:7px;flex:1;min-width:0;cursor:pointer\" onclick=\"highlightRoomOnCanvas(${room.id})\">\n          ${statusIcon}\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:${complete?'var(--ssx-ok)':'var(--ssx-text)'}\">${room.name||'Unnamed'}<\u002Fdiv>\n            <div style=\"font-size:10px;color:var(--ssx-faint);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">${room.area_m2?room.area_m2+'m² · ':''}${room.kw.toFixed(1)} kW · ${units[0]?.model||'—'}<\u002Fdiv>\n          <\u002Fdiv>\n          ${statusBadge}\n        <\u002Fdiv>\n        <!-- Buttons — outside the highlight zone, no stopPropagation needed -->\n        <button onclick=\"showRoomModal(null,${room.id})\"\n          style=\"padding:3px 8px;border:1px solid var(--ssx-border-strong);border-radius:4px;background:var(--ssx-card2);font-size:11px;font-family:var(--ssx-font);cursor:pointer;color:var(--ssx-label);flex-shrink:0;font-weight:600;white-space:nowrap\">\n          ✏ Edit\n        <\u002Fbutton>\n        <button onclick=\"toggleRoomPill(${room.id})\"\n          style=\"padding:3px 5px;border:1px solid var(--ssx-border-strong);border-radius:4px;background:var(--ssx-card2);cursor:pointer;color:var(--ssx-label);flex-shrink:0;display:flex;align-items:center;line-height:1\"\n          title=\"More options\">\n          <svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"\n            style=\"transition:transform .18s;transform:${open?'rotate(180deg)':'rotate(0deg)'}\">\n            <path d=\"M3 5l3 3 3-3\"/>\n          <\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <!-- Expanded action row -->\n      ${open ? `\n      <div style=\"display:flex;gap:6px;padding:0 8px 8px;border-top:1px solid var(--ssx-border);padding-top:8px\">\n        ${hasPoly ? `\n        <button onclick=\"redrawRoomBoundary(${room.id})\"\n          style=\"flex:1;padding:5px 8px;border:1px solid var(--ssx-border-strong);border-radius:5px;background:var(--ssx-card2);font-size:11px;font-family:var(--ssx-font);cursor:pointer;color:var(--ssx-label);font-weight:600;text-align:center\">\n          ↺ Redraw boundary\n        <\u002Fbutton>` : ''}\n        <button onclick=\"deleteRoomAndPolygon(${room.id})\"\n          style=\"flex:1;padding:5px 8px;border:1px solid #fca5a5;border-radius:5px;background:#fff1f2;font-size:11px;font-family:var(--ssx-font);cursor:pointer;color:#dc2626;font-weight:600;text-align:center\">\n          ✕ Delete room\n        <\u002Fbutton>\n      <\u002Fdiv>` : ''}\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction toggleRoomPill(roomId){\n  const room = state.rooms.find(r=>r.id===roomId);\n  if(!room) return;\n  room._pillOpen = !room._pillOpen;\n  renderRoomsSidebar();\n}\n\n\nfunction deleteRoomAndPolygon(roomId){\n  const room=state.rooms.find(r=>r.id===roomId);\n  const label=room?(room.name||'this room'):'this room';\n  showConfirmModal('Delete room?', `\"${label}\" and its boundary, units and pipe connections will be removed.`, ()=>{\n    pushUndo();\n    state.rooms=state.rooms.filter(r=>r.id!==roomId);\n    state.polygons=state.polygons.filter(p=>p.roomId!==roomId);\n    state.placedUnits=state.placedUnits.filter(u=>u.roomId!==roomId);\n    if(typeof renderRoomsSidebar==='function') renderRoomsSidebar();\n    if(typeof buildUnitPalette==='function') buildUnitPalette();\n    if(typeof updatePlacedList==='function') updatePlacedList();\n    if(typeof updateOverview==='function') updateOverview();\n    drawCanvas();\n    triggerAutoSave?.();\n    notify(`Deleted: ${label}`,'ok');\n  });\n}\n\nfunction redrawRoomBoundary(roomId){\n  const room=state.rooms.find(r=>r.id===roomId);\n  if(!room) return;\n  showConfirmModal('Redraw boundary?', `Remove the existing boundary for \"${room.name||'this room'}\" and draw a new one. Unit sizing will update to the new shape.`, ()=>{\n    pushUndo();\n    // Remove old polygon and any placed units for this room\n    state.polygons=state.polygons.filter(p=>p.roomId!==roomId);\n    state.placedUnits=state.placedUnits.filter(u=>u.roomId!==roomId);\n    // Keep the room record but mark it awaiting a new boundary\n    state._redrawingRoomId=roomId;\n    drawCanvas();\n    setTool('poly');\n    notify(`Draw the new boundary for ${room.name||'the room'}`,'');\n    if(typeof renderRoomsSidebar==='function') renderRoomsSidebar();\n    if(typeof updatePlacedList==='function') updatePlacedList();\n  });\n}\n\nfunction sidebarUpdateUnitType(roomId, uIdx, newType){\n  const room=state.rooms.find(r=>r.id===roomId);\n  if(!room||!room.units) return;\n  room.units[uIdx].type=newType;\n  // Pick best model for the new type at current kW\n  const best=selectUnit(room.units[uIdx].kw, newType);\n  if(best){ room.units[uIdx].model=best; room.units[uIdx].kw=UNIT_DATA[best]?.kw||room.units[uIdx].kw; }\n  renderRoomsSidebar();\n  buildUnitPalette();\n  updateOverview();\n  triggerAutoSave?.();\n}\n\nfunction sidebarUpdateUnitModel(roomId, uIdx, model){\n  const room=state.rooms.find(r=>r.id===roomId);\n  if(!room||!room.units) return;\n  room.units[uIdx].model=model;\n  if(UNIT_DATA[model]) room.units[uIdx].kw=UNIT_DATA[model].kw;\n  renderRoomsSidebar();\n  buildUnitPalette();\n  updateOverview();\n  triggerAutoSave?.();\n}\n\nfunction sidebarSplitRoom(roomId){\n  const room=state.rooms.find(r=>r.id===roomId);\n  if(!room) return;\n  const remainingKw=Math.max(0, room.kw - (room.units||[]).reduce((s,u)=>s+u.kw,0));\n  const splitKw=Math.max(1.0, remainingKw>0 ? remainingKw : room.kw/((room.units||[]).length+1));\n  const best=selectUnit(splitKw,'VMX');\n  if(!room.units) room.units=[];\n  room.units.push({model:best||'PEFY-P20VMX-E', type:'VMX', kw:UNIT_DATA[best]?.kw||splitKw});\n  renderRoomsSidebar();\n  buildUnitPalette();\n  triggerAutoSave?.();\n}\n\nfunction renameRoomInline(roomId, el){\n  const room=state.rooms.find(r=>r.id===roomId);\n  if(!room) return;\n  // Replace the span with an input\n  const input=document.createElement('input');\n  input.value=room.name||'';\n  input.style.cssText='flex:1;font-size:12px;font-weight:600;border:none;border-bottom:2px solid var(--ssx-accent);background:transparent;color:var(--ssx-text);outline:none;min-width:0;font-family:inherit';\n  el.replaceWith(input);\n  input.focus();\n  input.select();\n  const commit=()=>{\n    const newName=input.value.trim()||room.name||'Room';\n    room.name=newName;\n    // Also update the linked polygon name\n    const poly=state.polygons.find(p=>p.roomId===roomId);\n    if(poly) poly.name=newName;\n    drawCanvas();\n    renderRoomsSidebar();\n    buildUnitPalette();\n    triggerAutoSave?.();\n  };\n  input.addEventListener('blur', commit);\n  input.addEventListener('keydown', e=>{\n    if(e.key==='Enter'){ input.blur(); }\n    if(e.key==='Escape'){ input.value=room.name||''; input.blur(); }\n  });\n}\n\nfunction toggleSidebarRoom(roomId){\n  const room=state.rooms.find(r=>r.id===roomId);\n  if(!room) return;\n  room._sidebarOpen=!room._sidebarOpen;\n  renderRoomsSidebar();\n}\n\nfunction sidebarUpdateRoom(roomId, key, val, lock){\n  const room=state.rooms.find(r=>r.id===roomId);\n  if(!room) return;\n  room[key]=val;\n  if(key==='orientation' && lock) room.orientationLocked=true;\n  if(key==='orientationLocked' && !val){ room.orientationLocked=false; autoDetectOrientations(); }\n  // Recalculate heat load from new dimensions/conditions\n  if(['width','length','height','glass','condition'].includes(key)){\n    room.area_m2=Math.round((room.width||4)*(room.length||5)*10)/10;\n    room.kw=calcHeatLoad(room);\n    // Auto-update single unit to match\n    if(room.units&&room.units.length===1){\n      const best=selectUnit(room.kw, room.units[0].type||'VMX');\n      if(best){ room.units[0].model=best; room.units[0].kw=UNIT_DATA[best]?.kw||room.kw; }\n    }\n    // Update polygon label\n    const poly=state.polygons.find(p=>p.roomId===roomId);\n    if(poly) poly.area_m2=room.area_m2;\n  }\n  renderRoomsSidebar();\n  buildUnitPalette();\n  updateOverview();\n  drawCanvas();\n  triggerAutoSave?.();\n}\n\nfunction highlightRoomOnCanvas(roomId){\n  const poly=state.polygons.find(p=>p.roomId===roomId);\n  if(!poly) return;\n  state._highlightPoly=roomId;\n  drawCanvas();\n  setTimeout(()=>{state._highlightPoly=null;drawCanvas();},1500);\n}\n\n// ── Home screen ───────────────────────────────────────────\nfunction renderHome(){\n  const container=document.getElementById('home-jobs-grid');\n  if(!container) return;\n  const keys=[];\n  LS.keys().forEach(k=>{ if(k&&k.startsWith('vrf_design_')) keys.push(k); });\n  if(!keys.length){\n    container.innerHTML=`<div style=\"grid-column:1/-1;text-align:center;padding:48px 24px;color:var(--ssx-faint)\">\n      <svg width=\"48\" height=\"48\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" style=\"display:block;margin:0 auto 12px;opacity:.3\"><rect x=\"8\" y=\"8\" width=\"32\" height=\"32\" rx=\"4\"/><path d=\"M16 24h16M24 16v16\"/><\u002Fsvg>\n      <div style=\"font-size:15px;font-weight:600;margin-bottom:6px\">No saved designs yet<\u002Fdiv>\n      <div style=\"font-size:13px\">Start a new design above to get going<\u002Fdiv>\n    <\u002Fdiv>`;\n    return;\n  }\n\n  // Parse and sort by savedAt descending (most recent first)\n  const parsed = keys.map(k=>{\n    try{ return {key:k, data:JSON.parse(LS.get(k))}; }\n    catch(e){ return null; }\n  }).filter(Boolean).sort((a,b)=>{\n    const ta = a.data.savedAt ? new Date(a.data.savedAt).getTime() : 0;\n    const tb = b.data.savedAt ? new Date(b.data.savedAt).getTime() : 0;\n    return tb - ta;\n  });\n\n  container.innerHTML = parsed.map(({key:k, data:d})=>{\n    const jd = d.jobDetails||{};\n    const sys = d.state?.systems||[];\n    const rooms = d.state?.rooms||[];\n    const totalKw = rooms.reduce((s,r)=>{\n      const u=r.units||[{kw:r.kw||0}];\n      return s+u.reduce((a,uu)=>a+uu.kw,0);\n    },0);\n    const thumb = d.state?.floors?.[0]?.imageData;\n    const savedStr = d.savedAt\n      ? new Date(d.savedAt).toLocaleString('en-AU',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})\n      : '';\n    const isAutosave = d.isAutosave;\n    return `\n    <div class=\"home-job-card\" style=\"position:relative\">\n      <!-- Delete button -->\n      <button onclick=\"event.stopPropagation();deleteDesign('${k}')\"\n        style=\"position:absolute;top:7px;left:7px;z-index:2;width:24px;height:24px;border-radius:50%;\n               background:rgba(0,0,0,0.45);border:none;cursor:pointer;display:flex;align-items:center;\n               justify-content:center;color:#fff;font-size:12px;line-height:1;transition:background .15s\"\n        onmouseover=\"this.style.background='rgba(220,38,38,0.85)'\"\n        onmouseout=\"this.style.background='rgba(0,0,0,0.45)'\"\n        title=\"Delete design\">✕<\u002Fbutton>\n      <!-- Autosave badge -->\n      ${isAutosave?`<div style=\"position:absolute;top:7px;right:7px;z-index:2;background:#f59e0b;color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;font-family:var(--ssx-head)\">AUTOSAVE<\u002Fdiv>`:''}\n      <!-- Thumbnail -->\n      <div onclick=\"loadDesign('${k}')\" style=\"cursor:pointer\">\n        ${thumb\n          ? `<img src=\"${thumb}\" style=\"width:100%;height:100px;object-fit:cover;border-radius:6px 6px 0 0;display:block\">`\n          : `<div style=\"height:80px;background:var(--ssx-card2);border-radius:6px 6px 0 0;display:flex;align-items:center;justify-content:center;color:var(--ssx-faint);font-size:11px\">No floor plan<\u002Fdiv>`}\n        <div style=\"padding:12px\">\n          <div style=\"font-family:var(--ssx-head);font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px\">${jd.jobnum||'Draft'}<\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--ssx-label);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">${jd.client||'No client'} ${jd.address?'· '+jd.address:''}<\u002Fdiv>\n          <div style=\"display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px\">\n            ${sys.length?`<span class=\"pill pill-blue\" style=\"font-size:9px\">${sys.length} sys<\u002Fspan>`:''}\n            ${totalKw?`<span class=\"pill pill-ok\" style=\"font-size:9px\">${totalKw.toFixed(1)} kW<\u002Fspan>`:''}\n            ${rooms.length?`<span class=\"pill\" style=\"font-size:9px;background:var(--ssx-card2);color:var(--ssx-label)\">${rooms.length} rooms<\u002Fspan>`:''}\n          <\u002Fdiv>\n          <div style=\"font-size:10px;color:var(--ssx-faint)\">${savedStr}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\nfunction deleteDesign(key){\n  const d = JSON.parse(LS.get(key)||'{}');\n  const jd = d.jobDetails||{};\n  const label = jd.jobnum || jd.client || 'this design';\n  showConfirmModal(\n    'Delete design?',\n    `\"${label}\" will be permanently deleted. This cannot be undone.`,\n    ()=>{\n      LS.remove(key);\n      notify(`Deleted: ${label}`,'ok');\n      renderHome();\n    }\n  );\n}\n\nfunction loadDesign(key){\n  try{\n    const d=JSON.parse(LS.get(key));\n    if(!d||!d.state) return;\n    loadDesignData(d);\n    updateTopbar();\n    notify(`Loaded: ${d.jobDetails?.jobnum||'design'}`,'ok');\n    goStep(1);\n  }catch(e){notify('Could not load design','warn');}\n}\n\nfunction expandNew(){\n  const c=document.getElementById('dh-new-card');\n  if(c) c.classList.add('expanded');\n}\nfunction collapseNew(){\n  const c=document.getElementById('dh-new-card');\n  if(c) c.classList.remove('expanded');\n}\n\nfunction newDesign(){\n  // Full canonical reset — clears all state including junctions, bcBoxes, northArrow, undo stack\n  resetState();\n  window._addMoreMode = false;\n  // Assign next job number (only newDesign increments the counter, not startUpload/startNoPlans)\n  const jobnum = nextJobNumber();\n  state.currentJobnum = jobnum;\n  const jobnumEl = document.getElementById('jd-jobnum');\n  if(jobnumEl) jobnumEl.value = jobnum;\n  updateTopbar();\n  // Dismiss any autosave banner so it doesn't offer to restore the old session\n  dismissAutosave();\n  goStep(1);\n}\n\nfunction nextJobNumber(){\n  // Read counter from localStorage, increment, save back\n  const key='vrf_job_counter';\n  const current=parseInt(LS.get(key)||'0');\n  const next=current+1;\n  LS.set(key, String(next));\n  return `DAS-${String(next).padStart(3,'0')}`;\n}\n\nfunction showConfirmModal(title, message, onConfirm){\n  // Remove any existing\n  const existing=document.getElementById('confirm-modal');\n  if(existing) existing.remove();\n  const modal=document.createElement('div');\n  modal.id='confirm-modal';\n  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)';\n  modal.innerHTML=`\n    <div style=\"background:var(--ssx-card);border-radius:var(--ssx-radius);padding:24px;width:360px;box-shadow:var(--ssx-shadow);border:1px solid var(--ssx-border-strong)\">\n      <div style=\"font-family:var(--ssx-head);font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px\">${title}<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--ssx-label);margin-bottom:20px\">${message}<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;justify-content:flex-end\">\n        <button class=\"btn btn-secondary\" onclick=\"document.getElementById('confirm-modal').remove()\">Cancel<\u002Fbutton>\n        <button class=\"btn btn-danger\" id=\"confirm-ok-btn\">Continue<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  document.body.appendChild(modal);\n  document.getElementById('confirm-ok-btn').onclick=()=>{\n    modal.remove();\n    onConfirm();\n  };\n}\n\nfunction toggleSidebar(){\n  const sb=document.getElementById('canvas-sidebar');\n  const btn=document.getElementById('sidebar-toggle');\n  const collapsed=sb.style.width==='0px'||sb.dataset.collapsed==='1';\n  if(collapsed){\n    sb.style.width='300px';\n    sb.dataset.collapsed='0';\n    if(btn) btn.textContent='◀';\n  } else {\n    sb.style.width='0px';\n    sb.dataset.collapsed='1';\n    if(btn) btn.textContent='▶';\n  }\n}\n\n// Highlight pulse on canvas\nconst _origDrawCanvas = null; // extend drawCanvas to show highlight\n\n\n// ── Extra: update grayscale brightness slider visibility ──\nfunction toggleGrayscale(){\n  state.grayscale=!state.grayscale;\n  const btn=document.getElementById('btn-grayscale');\n  // Keep the icon button; just reflect active (B&W) state. Tooltip tells you what a click does next.\n  if(btn){ btn.classList.toggle('active',state.grayscale); btn.setAttribute('data-tip', state.grayscale?'Switch to colour':'Switch to B&W'); }\n  drawCanvas();\n}\n\n// ── Home quick-start ──\nfunction resetState(){\n  // Reset all design state without touching the job counter\n  state.floors=[]; state.rooms=[]; state.placedUnits=[];\n  state.pipes=[]; state.risers=[]; state.polygons=[];\n  state.systems=[{id:1,name:'System 1',color:'#4f46e5',rooms:[],odu:null,phase:3}];\n  state.activeSys=0; state.scale=null;\n  state._floorImg=null; state._croppedImg=null;\n  // Clear PDF/page-picker buffers so a NEW design's first upload replaces, not appends\n  window._pdfPages=[]; window._pdfPageLabels=[]; window._pdfPageFiles=[]; window._pdfDoc=null;\n  const _pg=document.getElementById('page-grid'); if(_pg) _pg.innerHTML='';\n  state.northArrow=null; state._cropOffset=null;\n  state.nextRoomId=1; state.nextUnitId=1; state.nextPipeId=1; state.nextRiserId=1;\n  state.vp={x:0,y:0,zoom:1};\n  state.mode=null;\n  state.currentJobnum='';\n  state.junctions=[];\n  state.bcBoxes=[];\n  state._undoStack=[];\n  state._calibPromptShown=false;\n  ['client','address','designer','notes','servicemate'].forEach(id=>{\n    const el=document.getElementById('jd-'+id);\n    if(el) el.value='';\n  });\n  const jobnumEl=document.getElementById('jd-jobnum');\n  if(jobnumEl) jobnumEl.value='';\n  // Reset the upload panel UI to the mode chooser so it starts fresh\n  const mc = document.getElementById('mode-chooser');\n  const up = document.getElementById('upload-path');\n  const np = document.getElementById('noplans-path');\n  if(mc) mc.style.display='';\n  if(up) up.style.display='none';\n  if(np) np.style.display='none';\n  // Clear any stale floor list or file preview\n  const fl = document.getElementById('floor-list');\n  if(fl) fl.innerHTML='';\n  const fp = document.getElementById('file-preview');\n  if(fp) fp.innerHTML='';\n}\n\nfunction startUpload(){\n  resetState();\n  goStep(1);\n  setTimeout(()=>chooseModeUpload(), 80);\n}\n\nfunction startNoPlans(){\n  resetState();\n  goStep(1);\n  setTimeout(()=>chooseModeNoPlans(), 80);\n}\n\n// ═══════════════════════════════════════════════\n// AUTO-SAVE\n// ═══════════════════════════════════════════════\nconst AUTOSAVE_KEY = 'vrf_autosave';\nconst AUTOSAVE_INTERVAL_MS = 20000; // 20 seconds\nlet _autosaveTimer = null;\nlet _autosaveDebounce = null;\nlet _lastAutoSaveAt = null;\n\nfunction hasWorkToSave(){\n  return state.rooms.length > 0\n    || state.placedUnits.length > 0\n    || state.pipes.length > 0\n    || state.polygons.length > 0\n    || state.floors.length > 0;\n}\n\nfunction autoSave(){\n  if(!hasWorkToSave()) return;\n  try{\n    const jd = getJobDetails();\n    const autoKey = `vrf_autosave_${jd.jobnum||'draft'}`;\n    const buildData = (withImages)=>({\n      version:1,\n      savedAt: new Date().toISOString(),\n      isAutosave: true,\n      jobDetails: jd,\n      state:{\n        floors: withImages ? state.floors : state.floors.map(f=>({...f, imageData:null})),\n        systems: state.systems,\n        rooms: state.rooms,\n        placedUnits: state.placedUnits,\n        pipes: state.pipes,\n        risers: state.risers,\n        polygons: state.polygons,\n        junctions: state.junctions,\n        bcBoxes:   state.bcBoxes,\n        northArrow: state.northArrow,\n        settings:  state.settings,\n        scale: state.scale,\n        globalPhase: state.globalPhase,\n        mode: state.mode,\n        noPlansCanvasMode: state.noPlansCanvasMode,\n      }\n    });\n    // Try with images first (so restore keeps the floor plan); if it exceeds\n    // the storage quota, fall back to stripping the images.\n    let ok=false;\n    try{\n      const full=JSON.stringify(buildData(true));\n      if(full.length < 4_500_000){ // stay under ~5MB localStorage limit\n        ok = LS.set(autoKey, full) && LS.set(AUTOSAVE_KEY, JSON.stringify({...JSON.parse(full), _autoKey:autoKey}));\n      }\n    }catch(e){ ok=false; }\n    if(!ok){\n      const stripped=JSON.stringify(buildData(false));\n      LS.set(autoKey, stripped);\n      LS.set(AUTOSAVE_KEY, JSON.stringify({...JSON.parse(stripped), _autoKey:autoKey}));\n    }\n    _lastAutoSaveAt = new Date();\n    showAutosaveIndicator();\n  }catch(e){\n    console.warn('Autosave failed:', e);\n  }\n}\n\nfunction showAutosaveIndicator(){\n  let ind = document.getElementById('autosave-indicator');\n  if(!ind){\n    ind = document.createElement('div');\n    ind.id = 'autosave-indicator';\n    ind.style.cssText = `\n      font-size:10px;color:var(--ssx-ok);font-weight:600;\n      display:flex;align-items:center;gap:4px;opacity:0;\n      transition:opacity .3s;white-space:nowrap;\n    `;\n    ind.innerHTML = `<svg width=\"10\" height=\"10\" viewBox=\"0 0 10 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M2 5l2 2 4-4\"/><\u002Fsvg>Auto-saved`;\n    const topbar = document.getElementById('topbar');\n    if(topbar){\n      const saveBtn = topbar.querySelector('.btn-secondary');\n      if(saveBtn) topbar.insertBefore(ind, saveBtn);\n      else topbar.appendChild(ind);\n    }\n  }\n  // Flash visible then fade\n  ind.style.opacity = '1';\n  setTimeout(()=>{ if(ind) ind.style.opacity='0'; }, 2500);\n}\n\n// Debounced trigger — called on state changes\nfunction triggerAutoSave(){\n  clearTimeout(_autosaveDebounce);\n  _autosaveDebounce = setTimeout(autoSave, 3000); // 3s after last change\n}\n\n// Periodic autosave regardless of changes\nfunction startAutoSaveInterval(){\n  clearInterval(_autosaveTimer);\n  _autosaveTimer = setInterval(()=>{\n    if(hasWorkToSave()) autoSave();\n  }, AUTOSAVE_INTERVAL_MS);\n}\n\n// Check for recoverable autosave on load\nfunction checkAutosaveRestore(){\n  try{\n    const raw = LS.get(AUTOSAVE_KEY);\n    if(!raw) return;\n    const d = JSON.parse(raw);\n    if(!d||!d.isAutosave||!d.state) return;\n    // Only prompt if autosave has meaningful content\n    const rooms = d.state.rooms||[];\n    const units = d.state.placedUnits||[];\n    if(rooms.length===0 && units.length===0) return;\n    const jd = d.jobDetails||{};\n    const when = d.savedAt ? new Date(d.savedAt).toLocaleString('en-AU',{\n      day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'\n    }) : 'recently';\n    // Show restore banner instead of confirm() so it's less jarring\n    showRestoreBanner(d, jd, when);\n  }catch(e){}\n}\n\nfunction showRestoreBanner(d, jd, when){\n  const banner = document.createElement('div');\n  banner.id = 'restore-banner';\n  banner.style.cssText = `\n    position:fixed;top:7px;left:50%;\n    background:var(--ssx-card);border:1px solid var(--ssx-border-strong);\n    border-radius:12px;padding:7px 10px 7px 12px;\n    box-shadow:var(--ductr-sh);z-index:500;\n    display:flex;align-items:center;gap:10px;max-width:560px;\n    animation:bannerSlideUp .42s var(--ductr-flow,cubic-bezier(.4,.01,.16,1)) both;\n  `;\n  const label = jd.jobnum ? `\"${jd.jobnum}\"` : (jd.client ? `for ${jd.client}` : 'a design');\n  banner.innerHTML = `\n    <svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"var(--ssx-warn)\" stroke-width=\"1.5\" stroke-linecap=\"round\" style=\"flex-shrink:0\"><circle cx=\"10\" cy=\"10\" r=\"8\"/><path d=\"M10 6v4l2.5 2.5\"/><\u002Fsvg>\n    <div style=\"flex:1;min-width:0\">\n      <div style=\"font-weight:700;font-size:13px;margin-bottom:2px\">Unsaved session found<\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--ssx-label)\">Auto-saved ${label} at ${when} · ${(d.state.rooms||[]).length} rooms, ${(d.state.placedUnits||[]).length} units placed<\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"btn btn-primary btn-sm\" onclick=\"restoreAutosave()\" style=\"flex-shrink:0\">Restore<\u002Fbutton>\n    <button class=\"btn btn-secondary btn-sm\" onclick=\"dismissAutosave()\" style=\"flex-shrink:0\">Dismiss<\u002Fbutton>\n  `;\n  document.body.appendChild(banner);\n  // Store d for restore\n  window._pendingAutosave = d;\n}\n\nfunction restoreAutosave(){\n  const d = window._pendingAutosave;\n  if(!d) return;\n  dismissAutosave();\n  loadDesignData(d);\n  notify('Session restored','ok');\n  // Navigate to where the work is. If there are rooms/units, go to the design\n  // canvas; otherwise fall back to the upload step.\n  const hasDesign = (state.rooms.length || state.placedUnits.length || state.polygons.length);\n  if(hasDesign){\n    goStep(2);\n  } else {\n    goStep(1);\n  }\n}\n\nfunction dismissAutosave(){\n  const banner = document.getElementById('restore-banner');\n  if(banner) banner.remove();\n  window._pendingAutosave = null;\n}\n\n// Shared load logic used by both loadDesign and restoreAutosave\nfunction loadDesignData(d){\n  if(!d||!d.state) return;\n  const s = d.state;\n  state.systems     = s.systems     || state.systems;\n  state.rooms       = s.rooms       || [];\n  state.placedUnits = s.placedUnits || [];\n  state.pipes       = s.pipes       || [];\n  state.risers      = s.risers      || [];\n  state.polygons    = s.polygons    || [];\n  state.junctions   = s.junctions   || [];\n  state.bcBoxes     = s.bcBoxes     || [];\n  state.northArrow  = s.northArrow  || null;\n  if(s.settings) state.settings = {...state.settings, ...s.settings};\n  state.floors      = s.floors      || [];\n  // Legacy saves stored one global scale — spread it onto floors that lack their own\n  if(s.scale && state.floors.length && state.floors.every(f=>f.scale==null)) state.floors.forEach(f=>{f.scale=s.scale;});\n  state.globalPhase = s.globalPhase || 3;\n  state.mode        = s.mode        || null;\n  state.noPlansCanvasMode = s.noPlansCanvasMode || 'blank';\n  state.currentJobnum = d.jobDetails?.jobnum || '';\n  const jd = d.jobDetails||{};\n  ['jobnum','client','address','designer','company','notes','power','servicemate','date'].forEach(k=>{\n    const el=document.getElementById('jd-'+k);\n    if(el && jd[k]) el.value = jd[k];\n  });\n  updateTopbar();\n}\n\n// ── Init ──\nconst _dateEl=document.getElementById('jd-date');\nif(_dateEl) _dateEl.value=new Date().toISOString().split('T')[0];\n// ── INTEGRATION POINT: Logged-in user ──────────────────────────────\n// When embedding this builder in the platform, inject the logged-in\n// user's name into the \"Designed by\" field here before renderHome().\n// Example: document.getElementById('jd-designer').value = currentUser.name;\n// ───────────────────────────────────────────────────────────────────\nrenderHome();\nrenderSysPills();\nstartAutoSaveInterval();\nsetTimeout(checkAutosaveRestore, 800);\n\nfunction initDesignCanvas(){\n  const canvas=document.getElementById('floor-canvas');\n  if(canvas && !canvasCtx) canvasCtx=canvas.getContext('2d');\n  renderFloorTabs();\n  buildUnitPalette();\n  renderRoomsSidebar();\n  renderComponentsList();\n  updateLegendLabels();\n  loadFloorImage();\n  syncPhaseSelector();\n  // Sync the scale badge with current state (may have been restored from autosave)\n  updateScaleBadge();\n  updateNorthReadout();\n  // Mandatory-but-skippable calibration prompt if scale not yet set and we have a plan\n  if(!state.scale && !state._calibPromptShown){\n    state._calibPromptShown=true;\n    const floor=state.floors[state.activeFloor];\n    if(floor && floor.imageData){\n      setTimeout(showCalibratePrompt, 400);\n    }\n  }\n}\n\nfunction updateScaleBadge(){\n  const badge=document.getElementById('canvas-validation');\n  if(!badge) return;\n  if(state.scale){\n    badge.textContent=`Scale: 1m = ${Math.round(state.scale)}px`;\n    badge.className='pill pill-ok';\n  } else {\n    badge.textContent='Scale: not set';\n    badge.className='pill pill-blue';\n  }\n}\n\nfunction updateNorthReadout(){\n  const ro=document.getElementById('north-readout');\n  const btn=document.getElementById('tool-north');\n  if(!ro) return;\n  if(state.northArrow){\n    const b=Math.round(state.northArrow.bearing||0);\n    ro.style.display='flex';\n    ro.textContent=`North ${b}°`;\n    if(btn) btn.lastChild.textContent=' Edit north';\n  } else {\n    ro.style.display='none';\n    if(btn) btn.lastChild.textContent=' Set north';\n  }\n}\n\nfunction showCalibratePrompt(){\n  if(state.scale) return;\n  const existing=document.getElementById('calib-prompt');\n  if(existing) existing.remove();\n  const modal=document.createElement('div');\n  modal.id='calib-prompt';\n  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)';\n  modal.innerHTML=`\n    <div style=\"background:var(--ssx-card);border-radius:var(--ssx-radius);padding:26px;width:400px;box-shadow:var(--ssx-shadow);border:1px solid var(--ssx-border-strong)\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px\">\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"var(--ssx-accent)\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M1 11h20M11 1v20\"/><\u002Fsvg>\n        <div style=\"font-family:var(--ssx-head);font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.04em\">Calibrate the plan<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:13px;color:var(--ssx-label);margin-bottom:18px;line-height:1.55\">\n        Two quick steps make everything measure accurately: <strong>1.<\u002Fstrong> set the scale by\n        drawing a line over a known dimension (e.g. a wall) and entering its real length, then\n        <strong>2.<\u002Fstrong> set the <strong>north facing direction<\u002Fstrong> so room orientations and\n        solar loads are correct.\n      <\u002Fp>\n      <div style=\"display:flex;gap:8px;justify-content:flex-end\">\n        <button class=\"btn btn-secondary\" onclick=\"document.getElementById('calib-prompt').remove()\">Skip for now<\u002Fbutton>\n        <button class=\"btn btn-primary\" onclick=\"document.getElementById('calib-prompt').remove();setTool('calib')\">Calibrate scale →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  document.body.appendChild(modal);\n}\n\nfunction showNorthPrompt(){\n  if(state.northArrow) return;\n  const existing=document.getElementById('north-prompt');\n  if(existing) existing.remove();\n  const modal=document.createElement('div');\n  modal.id='north-prompt';\n  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)';\n  modal.innerHTML=`\n    <div style=\"background:var(--ssx-card);border-radius:var(--ssx-radius);padding:26px;width:400px;box-shadow:var(--ssx-shadow);border:1px solid var(--ssx-border-strong)\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px\">\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"var(--ssx-accent)\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"M11 4v14\"/><path d=\"M11 4l-3.5 3.5M11 4l3.5 3.5\"/><\u002Fsvg>\n        <div style=\"font-family:var(--ssx-head);font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.04em\">Set north direction<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:13px;color:var(--ssx-label);margin-bottom:18px;line-height:1.55\">\n        Scale is set. Now click anywhere on the plan to drop the north marker, then drag the\n        <strong>N<\u002Fstrong> to point at true north. This drives each room's orientation and solar gain.\n      <\u002Fp>\n      <div style=\"display:flex;gap:8px;justify-content:flex-end\">\n        <button class=\"btn btn-secondary\" onclick=\"document.getElementById('north-prompt').remove()\">Skip for now<\u002Fbutton>\n        <button class=\"btn btn-primary\" onclick=\"document.getElementById('north-prompt').remove();setTool('north')\">Set north →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  document.body.appendChild(modal);\n}\n\n<\u002Fscript>\n\n<script id=\"ductr-chrome\">\n// ════ DUCTR chrome layer — overrides presentation only; engine logic untouched ════\n(function(){\n  const _origRenderHome = renderHome;\n  renderHome = function(){\n    const grid=document.getElementById('home-jobs-grid');\n    const loadList=document.getElementById('dh-load-list');\n    if(!grid) return;\n    const q=(document.getElementById('dh-search-input')?.value||'').trim().toLowerCase();\n    const clearBtn=document.getElementById('dh-search-clear');\n    if(clearBtn) clearBtn.style.display=q?'grid':'none';\n    const keys=[]; LS.keys().forEach(k=>{ if(k&&k.startsWith('vrf_design_')) keys.push(k); });\n    const parsed=keys.map(k=>{ try{return {key:k,data:JSON.parse(LS.get(k))};}catch(e){return null;} })\n      .filter(Boolean)\n      .sort((a,b)=>(new Date(b.data.savedAt||0))-(new Date(a.data.savedAt||0)));\n    const info=({key,data:d})=>{\n      const jd=d.jobDetails||{};\n      const rooms=d.state?.rooms||[];\n      const kw=rooms.reduce((s,r)=>s+(r.kw||0),0);\n      return {key, name:jd.client||jd.address||'Untitled design', job:jd.jobnum||'Draft',\n        rooms:rooms.length, kw:Math.round(kw*10)/10,\n        thumb:d.state?.floors?.[0]?.imageData||null, auto:!!d.isAutosave,\n        when:d.savedAt?new Date(d.savedAt).toLocaleDateString('en-AU',{day:'numeric',month:'short'}):''};\n    };\n    const all=parsed.map(info);\n    const _lc=document.getElementById('dh-load-count'); if(_lc) _lc.textContent=all.length+(all.length===1?' design':' designs');\n    // single Recent list: search-filtered when querying, else recent designs with content\n    const list = q ? all.filter(d=>(d.name+' '+d.job).toLowerCase().includes(q))\n                   : all.filter(d=>d.thumb||d.rooms>0).slice(0,8);\n    document.getElementById('dh-recent-count')&&(document.getElementById('dh-recent-count').textContent=list.length);\n    grid.innerHTML = list.length ? list.map(d=>`\n      <div class=\"dh-rcard\" onclick=\"loadDesign('${d.key}')\">\n        <div class=\"dh-rthumb\">${d.thumb?`<img src=\"${d.thumb}\">`:'<span class=\"dh-noplan\">No plan<\u002Fspan>'}${d.auto?'<span class=\"dh-rbadge\">Autosave<\u002Fspan>':''}\n          <button class=\"dh-rdel\" title=\"Delete design\" onclick=\"event.stopPropagation();deleteDesign('${d.key}')\">×<\u002Fbutton><\u002Fdiv>\n        <div class=\"dh-rbody\">\n          <div class=\"dh-rnm\">${d.name}<\u002Fdiv>\n          <div class=\"dh-rmeta\">${d.rooms} rooms · ${d.kw} kW<\u002Fdiv>\n          <div class=\"dh-rwhen\">#${d.job} · ${d.when}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`).join('')\n      : `<div class=\"dh-rempty\">\n          <svg width=\"40\" height=\"40\" viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"8\" y=\"10\" width=\"32\" height=\"28\" rx=\"3\"/><path d=\"M8 18h32M16 26h10\"/><\u002Fsvg>\n          <div class=\"dh-rempty-t\">${q?'No matches':'No recent projects'}<\u002Fdiv>\n          <div class=\"dh-rempty-s\">${q?('Nothing matches \"'+q+'\"'):'Designs you work on will show here'}<\u002Fdiv>\n        <\u002Fdiv>`;\n    // load list (filtered)\n    if(loadList){\n      const f=all.filter(d=>(d.name+' '+d.job).toLowerCase().includes(q));\n      loadList.innerHTML = f.length ? f.map(d=>`\n        <button class=\"dh-lrow\" onclick=\"loadDesign('${d.key}')\">\n          <span class=\"dh-lb\"><span class=\"dh-ln\">${d.name}${d.auto?' <span class=dh-lcur>Autosave<\u002Fspan>':''}<\u002Fspan>\n          <span class=\"dh-lm\">#${d.job} · ${d.rooms} rooms · ${d.kw} kW<\u002Fspan><\u002Fspan>\n          <span class=\"dh-lwhen\">${d.when}<\u002Fspan>\n        <\u002Fbutton>`).join('')\n        : '<div class=\"dh-none\">'+(q?('No designs match “'+q+'”'):'Saved designs appear here.')+'<\u002Fdiv>';\n    }\n  };\n\n\n  // ── Topbar identity (redesign) ──\n  const _origUpdateTopbar = updateTopbar;\n  updateTopbar = function(){\n    const jd = getJobDetails();\n    const t=document.getElementById('tb-title');\n    const s=document.getElementById('tb-sub-text');\n    const j=document.getElementById('topbar-job');\n    if(!t) return;\n    const title = jd.client || (state.floors&&state.floors[0]&&state.floors[0].name&&jd.address ? state.floors[0].name+' — '+jd.address.split(',')[0] : '') || jd.address || 'DUCTR';\n    t.textContent = title;\n    s.textContent = jd.address && title!==jd.address ? jd.address : 'Design studio';\n    const jobnum = jd.jobnum || state.currentJobnum || '';\n    if(j) j.textContent = jobnum ? ('Job #'+jobnum) : 'New design';\n  };\n  try{ updateTopbar(); }catch(e){}\n\n  // ── Floating legend ──\n  window.toggleLegendFloat = function(){\n    const p=document.getElementById('legend-float');\n    const on=p.style.display!=='none';\n    p.style.display=on?'none':'flex';\n    if(!on){ p.style.left=''; p.style.top=''; p.style.right='404px'; p.style.bottom='24px'; } // default spot every time\n    document.getElementById('legend-fab')?.classList.toggle('on', !on);\n    document.getElementById('legend-topbtn')?.classList.toggle('on', !on);\n  };\n  (function(){\n    const p=document.getElementById('legend-float');\n    const h=document.getElementById('legend-float-head');\n    let drag=null;\n    h.addEventListener('pointerdown',e=>{\n      if(e.target.tagName==='BUTTON') return;\n      const r=p.getBoundingClientRect();\n      drag={dx:e.clientX-r.left, dy:e.clientY-r.top};\n      h.setPointerCapture(e.pointerId);\n    });\n    h.addEventListener('pointermove',e=>{\n      if(!drag) return;\n      p.style.right='auto'; p.style.bottom='auto';\n      p.style.left=Math.max(8,Math.min(window.innerWidth-p.offsetWidth-8, e.clientX-drag.dx))+'px';\n      p.style.top=Math.max(8,Math.min(window.innerHeight-60, e.clientY-drag.dy))+'px';\n    });\n    h.addEventListener('pointerup',()=>{drag=null;});\n  })();\n  // ── Plans page (DUCTR layout) ──\n  window.__pv2Active = 0;\n  window.renderPlansDuctr = function(){\n    const stage=document.getElementById('pv2-stage');\n    const rail=document.getElementById('pv2-rail');\n    const flow=document.getElementById('ductr-plans-flow');\n    if(!stage) return;\n    const floors=state.floors||[];\n    const has=floors.length>0;\n    stage.style.display=has?'flex':'none';\n    if(rail) rail.style.display='none';\n    flow.style.display=has?'none':'block';\n    if(!has){\n      const _pc=document.getElementById('pv2-page-count'); if(_pc) _pc.textContent='0';\n      const _pl=document.getElementById('pv2-page-list'); if(_pl) _pl.innerHTML='<div class=\"dh-none\">No pages yet — upload a plan or add a blank page.<\u002Fdiv>';\n      ['address','jobnum','client','designer'].forEach(k=>{\n        const src=document.getElementById('jd-'+k), dst=document.getElementById('pd-'+k);\n        if(src&&dst&&document.activeElement!==dst) dst.value=src.value||'';\n      });\n      const ro0=document.getElementById('pv2-scale-readout');\n      if(ro0){ ro0.textContent = state.scale ? (Math.round(state.scale)+' px/m · set') : 'Not set'; ro0.classList.toggle('set', !!state.scale); }\n      return;\n    }\n    if(__pv2Active>=floors.length) __pv2Active=floors.length-1;\n    const f=floors[__pv2Active];\n    const img=document.getElementById('pv2-img');\n    const blank=document.getElementById('pv2-blank');\n    if(f.imageData){ img.src=f.imageData; img.style.display='block'; blank.style.display='none'; }\n    else { img.style.display='none'; blank.style.display='grid'; }\n    // strip\n    document.getElementById('pv2-strip').innerHTML=floors.map((fl,i)=>`\n      <button class=\"pv2-sheet${i===__pv2Active?' on':''}\" onclick=\"__pv2Active=${i};renderPlansDuctr()\">\n        <span class=\"th\">${fl.imageData?`<img src=\"${fl.imageData}\">`:'<span class=bk><\u002Fspan>'}<\u002Fspan>\n        <span class=\"nm\">${fl.name}<\u002Fspan>\n      <\u002Fbutton>`).join('');\n    // pages card\n    const _pc2=document.getElementById('pv2-page-count'); if(_pc2) _pc2.textContent=floors.length;\n    const _pl2=document.getElementById('pv2-page-list'); if(_pl2) _pl2.innerHTML=floors.map((fl,i)=>`\n      <div class=\"pv2-row${i===__pv2Active?' on':''}\">\n        <button class=\"pv2-main\" onclick=\"__pv2Active=${i};renderPlansDuctr()\">\n          <span class=\"pv2-th\">${fl.imageData?`<img src=\"${fl.imageData}\">`:'<span class=bk><\u002Fspan>'}<\u002Fspan>\n          <span class=\"pv2-txt\"><span class=\"pv2-n\"><input value=\"${(fl.name||'').replace(/\"/g,'&quot;')}\" onclick=\"event.stopPropagation()\" oninput=\"state.floors[${i}].name=this.value;if(typeof renderFloorTabs==='function')try{renderFloorTabs()}catch(e){}\"><\u002Fspan>\n          <span class=\"pv2-sub\">${i===__pv2Active?'Viewing now':'Sheet '+(i+1)}<\u002Fspan><\u002Fspan>\n          ${i===__pv2Active?'<span class=\"pv2-dot\"><\u002Fspan>':''}\n        <\u002Fbutton>\n        ${floors.length>1?`<button class=\"pv2-x\" title=\"Remove page\" onclick=\"state.floors.splice(${i},1);if(state.activeFloor>=state.floors.length)state.activeFloor=state.floors.length-1;if(typeof renderFloorTabs==='function')try{renderFloorTabs()}catch(e){}renderPlansDuctr()\">×<\u002Fbutton>`:''}\n      <\u002Fdiv>`).join('');\n    // project details mirror\n    ['address','jobnum','client','designer'].forEach(k=>{\n      const src=document.getElementById('jd-'+k), dst=document.getElementById('pd-'+k);\n      if(src&&dst&&document.activeElement!==dst) dst.value=src.value||'';\n    });\n    // scale readout\n    const ro=document.getElementById('pv2-scale-readout');\n    if(ro){ ro.textContent = state.scale ? (Math.round(state.scale)+' px/m · set') : 'Not set'; ro.classList.toggle('set', !!state.scale); }\n  };\n  // hide Save / Export PDF / job label on Home\n  const _origGoStep = goStep;\n  let _prevStep = 0;\n  goStep = function(n){\n    // Directional transition hint for premium slide\n    const main=document.getElementById('main');\n    if(main) main.dataset.dir = (n<_prevStep) ? 'back' : 'fwd';\n    _prevStep = n;\n    _origGoStep(n); document.body.dataset.step=String(n);\n    if(n===1){ try{ renderPlansDuctr(); }catch(e){}\n      // skip the legacy mode-chooser: default to the upload path when no mode picked yet\n      if(!state.mode && !(state.floors||[]).length){ try{ chooseModeUpload(); }catch(e){} }\n    }\n    if(n===0){ try{ collapseNew(); renderHome(); }catch(e){} }\n    const fab=document.getElementById('legend-fab'); if(fab) fab.style.display = 'none';\n    if(n!==2){ const lf=document.getElementById('legend-float'); if(lf) lf.style.display='none'; fab&&fab.classList.remove('on'); document.getElementById('legend-topbtn')?.classList.remove('on'); } };\n  document.body.dataset.step='0';\n  if(typeof renderHome==='function') try{ renderHome(); }catch(e){}\n})();\n<\u002Fscript>\n<style id=\"tweaks-style\">\n#tw-panel{position:fixed;top:64px;right:18px;z-index:4000;width:268px;\n  background:var(--ssx-card);border:1px solid var(--ssx-border-strong);border-radius:18px;\n  box-shadow:0 24px 60px rgba(20,30,24,.22);font-family:var(--ssx-font);display:none;overflow:hidden;\n  animation:ductrModalIn .34s var(--ductr-flow) both}\n#tw-panel.show{display:block}\n#tw-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--ssx-border);background:var(--ssx-card2)}\n#tw-head h3{font-family:var(--ssx-head);font-size:14px;font-weight:800;letter-spacing:.02em;color:var(--ssx-text);text-transform:uppercase;margin:0}\n#tw-head button{width:26px;height:26px;border:none;background:transparent;color:var(--ssx-faint);font-size:15px;cursor:pointer;border-radius:7px;display:grid;place-items:center}\n#tw-head button:hover{background:var(--ssx-bg);color:var(--ssx-text)}\n.tw-sec{padding:14px 15px;border-bottom:1px solid var(--ssx-border)}\n.tw-sec:last-child{border-bottom:none}\n.tw-lbl{font-family:var(--ssx-head);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ssx-label);margin-bottom:9px}\n.tw-swatches{display:flex;gap:9px}\n.tw-sw{width:38px;height:38px;border-radius:11px;cursor:pointer;border:2px solid transparent;position:relative;transition:transform .14s var(--ductr-ease)}\n.tw-sw:hover{transform:translateY(-2px)}\n.tw-sw.on{border-color:var(--ssx-text)}\n.tw-sw.on::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.35)}\n.tw-seg{display:flex;gap:6px}\n.tw-seg button{flex:1;padding:9px 6px;border:1px solid var(--ssx-border-strong);border-radius:10px;background:var(--ssx-card);\n  cursor:pointer;font-family:var(--ssx-font);font-size:11.5px;font-weight:600;color:var(--ssx-label);transition:all .14s var(--ductr-ease)}\n.tw-seg button:hover{border-color:var(--ssx-accent)}\n.tw-seg button.on{background:var(--ssx-accent);border-color:var(--ssx-accent);color:#fff}\n.tw-seg.tw-fonts button{font-size:13px}\n.tw-seg.tw-fonts button[data-v=\"condensed\"]{font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.02em;text-transform:uppercase}\n.tw-seg.tw-fonts button[data-v=\"grotesk\"]{font-family:'Hanken Grotesk',sans-serif;font-weight:800}\n.tw-seg.tw-fonts button[data-v=\"mono\"]{font-family:'DM Mono',monospace;font-weight:500}\n/* Workspace textures (controlled) */\nhtml[data-tw-texture] .dh-main::before,html[data-tw-texture] #pv2-canvas::before,html[data-tw-texture] #ductr-plans-flow::before{background-image:none}\nhtml[data-tw-texture=\"dots\"] .dh-main::before,html[data-tw-texture=\"dots\"] #pv2-canvas::before,html[data-tw-texture=\"dots\"] #ductr-plans-flow::before{background-image:radial-gradient(rgba(23,32,27,.08) 1px,transparent 1px);background-size:22px 22px}\n[data-theme=\"dark\"] html[data-tw-texture=\"dots\"] .dh-main::before{background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px)}\nhtml[data-tw-texture=\"grid\"] .dh-main::before,html[data-tw-texture=\"grid\"] #pv2-canvas::before,html[data-tw-texture=\"grid\"] #ductr-plans-flow::before{background-image:linear-gradient(rgba(23,32,27,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(23,32,27,.055) 1px,transparent 1px);background-size:24px 24px,24px 24px}\n/* Gradient accent — paints brand surfaces when a gradient accent is active */\nhtml[data-tw-grad=\"on\"] #topbar .logo-icon,\nhtml[data-tw-grad=\"on\"] .btn-primary,\nhtml[data-tw-grad=\"on\"] .dh-primary,\nhtml[data-tw-grad=\"on\"] .dh-new-cta,\nhtml[data-tw-grad=\"on\"] #canvas-topbar #tool-calib.active,\nhtml[data-tw-grad=\"on\"] #canvas-topbar #tool-north.active,\nhtml[data-tw-grad=\"on\"] #legend-topbtn.on,\nhtml[data-tw-grad=\"on\"] .lswitch.on,\nhtml[data-tw-grad=\"on\"] .tw-seg button.on{background-image:var(--ssx-accent-grad)!important;border-color:transparent!important}\nhtml[data-tw-grad=\"on\"] .btn-primary:hover,html[data-tw-grad=\"on\"] .dh-primary:hover,html[data-tw-grad=\"on\"] .dh-new-cta:hover{filter:brightness(1.06)}\n/* Step states use hard-coded orange/green — exempt from gradient tweak */\n<\u002Fstyle>\n<div id=\"tw-panel\">\n  <div id=\"tw-head\"><h3>Tweaks<\u002Fh3><button onclick=\"twDismiss()\" title=\"Close\">✕<\u002Fbutton><\u002Fdiv>\n  <div class=\"tw-sec\">\n    <div class=\"tw-lbl\">Accent<\u002Fdiv>\n    <div class=\"tw-swatches\" id=\"tw-accent\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tw-sec\">\n    <div class=\"tw-lbl\">Workspace texture<\u002Fdiv>\n    <div class=\"tw-seg\" id=\"tw-texture\">\n      <button data-v=\"grid\">Grid<\u002Fbutton>\n      <button data-v=\"dots\">Dots<\u002Fbutton>\n      <button data-v=\"clean\">Clean<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tw-sec\">\n    <div class=\"tw-lbl\">Heading style<\u002Fdiv>\n    <div class=\"tw-seg tw-fonts\" id=\"tw-headfont\">\n      <button data-v=\"grotesk\">Aa<\u002Fbutton>\n      <button data-v=\"condensed\">Aa<\u002Fbutton>\n      <button data-v=\"mono\">Aa<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<script id=\"tweaks-logic\">\n(function(){\n  const ACCENTS={\n    airfoil:['#06D6A0','#05B886','#E4F6F3'],\n    green:['#0E9F6E','#07724E','#E5F6EE'],\n    ocean:['#2563EB','#1D4ED8','#E6EEFE'],\n    slate:['#475569','#334155','#EDF1F6'],\n    clay:['#C2603F','#9E4A2E','#F8EAE3'],\n    vibrant:['#8B5CF6','#7C3AED','#F3EBFE']\n  };\n  // Accents that paint brand surfaces with a gradient instead of a flat fill\n  const GRADIENTS={\n    airfoil:'linear-gradient(135deg,#06D6A0 0%,#0EA5E9 55%,#818CF8 100%)',\n    vibrant:'linear-gradient(120deg,#2563EB 0%,#8B5CF6 36%,#EC4899 68%,#EF4444 100%)'\n  };\n  const HEADFONTS={\n    grotesk:\"'Plus Jakarta Sans',system-ui,sans-serif\",\n    condensed:\"'Barlow Condensed',sans-serif\",\n    mono:\"'JetBrains Mono',ui-monospace,monospace\"\n  };\n  const TWEAKS = /*EDITMODE-BEGIN*/{\n    \"accent\": \"airfoil\",\n    \"texture\": \"clean\",\n    \"headfont\": \"grotesk\"\n  }/*EDITMODE-END*/;\n\n  function applyTweaks(){\n    const root=document.documentElement;\n    const a=ACCENTS[TWEAKS.accent]||ACCENTS.green;\n    root.style.setProperty('--ssx-accent',a[0]);\n    root.style.setProperty('--ssx-accent-hover',a[1]);\n    root.style.setProperty('--ssx-accent-bg',a[2]);\n    const grad=GRADIENTS[TWEAKS.accent];\n    root.style.setProperty('--ssx-accent-grad',grad||a[0]);\n    root.dataset.twGrad = grad ? 'on' : 'off';\n    root.dataset.twTexture=TWEAKS.texture;\n    root.style.setProperty('--ssx-head',HEADFONTS[TWEAKS.headfont]||HEADFONTS.grotesk);\n    try{ if(typeof drawCanvas==='function' && state && state.tool) drawCanvas(); }catch(e){}\n    syncControls();\n  }\n  function syncControls(){\n    const accWrap=document.getElementById('tw-accent');\n    accWrap.querySelectorAll('.tw-sw').forEach(s=>s.classList.toggle('on',s.dataset.v===TWEAKS.accent));\n    document.querySelectorAll('#tw-texture button').forEach(b=>b.classList.toggle('on',b.dataset.v===TWEAKS.texture));\n    document.querySelectorAll('#tw-headfont button').forEach(b=>b.classList.toggle('on',b.dataset.v===TWEAKS.headfont));\n  }\n  function setTweak(k,v){\n    TWEAKS[k]=v;\n    applyTweaks();\n    try{ window.parent.postMessage({type:'__edit_mode_set_keys',edits:{[k]:v}},'*'); }catch(e){}\n  }\n  // Build accent swatches\n  const accWrap=document.getElementById('tw-accent');\n  Object.entries(ACCENTS).forEach(([k,v])=>{\n    const sw=document.createElement('div');\n    sw.className='tw-sw'; sw.dataset.v=k; sw.style.background=GRADIENTS[k]||v[0]; sw.title=k;\n    sw.onclick=()=>setTweak('accent',k);\n    accWrap.appendChild(sw);\n  });\n  document.querySelectorAll('#tw-texture button').forEach(b=>b.onclick=()=>setTweak('texture',b.dataset.v));\n  document.querySelectorAll('#tw-headfont button').forEach(b=>b.onclick=()=>setTweak('headfont',b.dataset.v));\n\n  // Apply persisted tweaks on load\n  applyTweaks();\n\n  // ── Host protocol: register listener BEFORE announcing ──\n  const panel=document.getElementById('tw-panel');\n  window.addEventListener('message',(e)=>{\n    const t=e.data&&e.data.type;\n    if(t==='__activate_edit_mode'){ panel.classList.add('show'); }\n    else if(t==='__deactivate_edit_mode'){ panel.classList.remove('show'); }\n  });\n  window.twDismiss=function(){\n    panel.classList.remove('show');\n    try{ window.parent.postMessage({type:'__edit_mode_dismissed'},'*'); }catch(e){}\n  };\n  try{ window.parent.postMessage({type:'__edit_mode_available'},'*'); }catch(e){}\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
