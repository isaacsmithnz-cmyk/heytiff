ints=poly.points.map(p=>({x:p.x+ox,y:p.y+oy})); });\n      state.placedUnits.forEach(u=>{u.x+=ox;u.y+=oy;});\n      state.pipes.forEach(pipe=>{pipe.points=pipe.points.map(p=>({x:p.x+ox,y:p.y+oy}));});\n      state.junctions.forEach(j=>{j.x+=ox;j.y+=oy;});\n      state.bcBoxes.forEach(b=>{b.x+=ox;b.y+=oy;});\n      state.risers.forEach(r=>{r.x+=ox;r.y+=oy;});\n      if(state.northArrow){state.northArrow.x+=ox;state.northArrow.y+=oy;}\n    }\n    state._cropOffset = null;\n    state.crop = null;\n    state._cropDrawing = false;\n    state.cropStart = null;\n    loadFloorImage();\n    notify('Crop reset','ok');\n  }\n}\n\n// ── Crop ────────────────────────────────────────────────\nfunction applyCrop(){\n  pushUndo();\n  if(!state.crop||!state._floorImg) return;\n  const {x,y,w,h} = state.crop;\n\n  // Render the cropped image\n  const tmp = document.createElement('canvas');\n  tmp.width=w; tmp.height=h;\n  tmp.getContext('2d').drawImage(state._floorImg, x,y,w,h, 0,0,w,h);\n  state._croppedImg = new Image();\n\n  // Store offset so we can reverse it if the user resets the crop\n  state._cropOffset = {x, y};\n\n  // Translate all canvas-space objects by (-x, -y)\n  function tx(pt){ return {x: pt.x - x, y: pt.y - y}; }\n\n  state.polygons.forEach(poly=>{\n    poly.points = poly.points.map(tx);\n  });\n  state.placedUnits.forEach(u=>{ u.x-=x; u.y-=y; });\n  state.pipes.forEach(pipe=>{\n    pipe.points = pipe.points.map(tx);\n  });\n  state.junctions.forEach(j=>{ j.x-=x; j.y-=y; });\n  state.bcBoxes.forEach(b=>{ b.x-=x; b.y-=y; });\n  state.risers.forEach(r=>{ r.x-=x; r.y-=y; });\n  if(state.northArrow){ state.northArrow.x-=x; state.northArrow.y-=y; }\n  if(state.calibStart){ state.calibStart={x:state.calibStart.x-x, y:state.calibStart.y-y}; }\n  if(state.calibEnd)  { state.calibEnd  ={x:state.calibEnd.x  -x, y:state.calibEnd.y  -y}; }\n  // Scale stays the same — crop doesn't change px/m ratio\n\n  const canvas = document.getElementById('floor-canvas');\n  state._croppedImg.onload = ()=>{\n    canvas.width=w; canvas.height=h;\n    drawCanvas();\n    fitCanvas();\n    notify('Crop applied — double-click Crop tool to reset','ok');\n  };\n  state._croppedImg.src = tmp.toDataURL();\n}\n\n// ── Draw ─────────────────────────────────────────────────\nfunction drawCanvas(){\n  const canvas = document.getElementById('floor-canvas');\n  const ctx = canvasCtx;\n  if(!ctx) return;\n  ctx.clearRect(0,0,canvas.width,canvas.height);\n\n  // Background image (cropped or full)\n  const img = state._croppedImg || state._floorImg;\n  if(img && !LAYERS.plan){\n    // Plan layer hidden — flat backdrop so overlays stay readable\n    const csL = getComputedStyle(document.documentElement);\n    ctx.fillStyle = csL.getPropertyValue('--ssx-canvas-bg').trim()||'#DDE3EC';\n    ctx.fillRect(0,0,canvas.width,canvas.height);\n  } else if(img){\n    if(state.grayscale){\n      ctx.filter=`grayscale(1) brightness(${state.brightness||1.05}) contrast(0.92)`;\n    }\n    ctx.drawImage(img,0,0,canvas.width,canvas.height);\n    ctx.filter='none';\n  } else {\n    // Blank grid\n    const cs = getComputedStyle(document.documentElement);\n    const bg = '#FFFFFF';\n    const bc = cs.getPropertyValue('--ssx-border').trim()||'rgba(0,0,0,0.08)';\n    const fc = cs.getPropertyValue('--ssx-faint').trim()||'#9CA3AF';\n    const ac = cs.getPropertyValue('--ssx-accent').trim()||'#0284C7';\n    ctx.fillStyle=bg; ctx.fillRect(0,0,canvas.width,canvas.height);\n    const gs = state.scale||100;\n    // Graph-paper dots at every grid intersection (+ finer sub-dots)\n    const sub = gs/5;\n    ctx.fillStyle='#64748B';\n    for(let x=0;x<=canvas.width;x+=sub){\n      for(let y=0;y<=canvas.height;y+=sub){\n        const isMajor = (Math.abs(x%gs)<0.6 && Math.abs(y%gs)<0.6);\n        ctx.globalAlpha = isMajor ? 0.55 : 0.22;\n        ctx.beginPath();\n        ctx.arc(x, y, isMajor?1.6:1.0, 0, Math.PI*2);\n        ctx.fill();\n      }\n    }\n    ctx.globalAlpha = 1;\n    ctx.fillStyle=fc; c h;\n    area += pts[i].x * pts[j].y;\n    area -= pts[j].x * pts[i].y;\n  }\n  area = Math.abs(area)/2;\n  const area_m2 = state.scale ? Math.round(area / (state.scale*state.scale) * 10)/10 : null;\n  poly.area_m2 = area_m2;\n\n  // Enter wall-select mode before room modal\n  startWallSelect(poly, null);\n}\n\n// ── Wall selection ────────────────────────────────────────────────────\n// Called after polygon closed (new room) or from Edit (existing room).\n// poly = polygon object (new), roomId = existing room id (edit).\n// Sets state.tool='wallselect', stores context in state._wallSelect.\nfunction startWallSelect(poly, roomId){\n  const room = roomId ? state.rooms.find(r=>r.id===roomId) : null;\n  const targetPoly = poly || state.polygons.find(p=>p.roomId===roomId);\n  if(!targetPoly) return;\n\n  // Pre-populate existing external walls if editing\n  const existing = room?.externalWalls ? [...room.externalWalls] : [];\n\n  state._wallSelect = {\n    poly:       targetPoly,\n    roomId:     roomId || null,\n    selected:   new Set(existing),   // set of edge indices\n    isEdit:     !!roomId,\n  };\n  state.tool = 'wallselect';\n  startWallSpin();\n  drawCanvas();\n  showWallSelectPanel();\n}\n\n// Animated spinning rings on wall markers while marking external walls\nfunction startWallSpin(){\n  if(window._wallSpinRAF) return;\n  const tick=()=>{\n    if(state.tool!=='wallselect'){ window._wallSpinRAF=null; return; }\n    window._wallSpin = (window._wallSpin||0) + 0.045;\n    drawCanvas();\n    window._wallSpinRAF = requestAnimationFrame(tick);\n  };\n  window._wallSpinRAF = requestAnimationFrame(tick);\n}\nfunction stopWallSpin(){\n  if(window._wallSpinRAF){ cancelAnimationFrame(window._wallSpinRAF); window._wallSpinRAF=null; }\n}\n\nfunction showWallSelectPanel(){\n  let panel = document.getElementById('wall-select-panel');\n  if(!panel){\n    panel = document.createElement('div');\n    panel.id = 'wall-select-panel';\n    panel.style.cssText = `\n      position:absolute;bottom:24px;left:50%;transform:translateX(-50%);\n      background:var(--ssx-card);border:1.5px solid var(--ssx-border-strong);\n      border-radius:10px;padding:14px 18px;z-index:600;\n      box-shadow:0 8px 32px rgba(0,0,0,.18);\n      display:flex;flex-direction:column;align-items:center;gap:10px;\n      min-width:320px;max-width:420px;\n    `;\n    document.getElementById('canvas-wrap')?.appendChild(panel);\n  }\n  panel.style.display = 'flex';\n  updateWallSelectPanel();\n}\n\nfunction updateWallSelectPanel(){\n  const panel = document.getElementById('wall-select-panel');\n  if(!panel || !state._wallSelect) return;\n  const n = state._wallSelect.selected.size;\n  panel.innerHTML = `\n    <div style=\"text-align:center\">\n      <div style=\"font-family:var(--ssx-head);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ssx-text)\">Mark external walls<\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--ssx-label);margin-top:3px\">Click each wall that is exposed to outside. Internal / party walls leave unselected.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;font-weight:600;color:${n>0?'var(--ssx-ok)':'var(--ssx-faint)'}\">\n      ${n === 0 ? 'No walls selected' : `${n} external wall${n>1?'s':''} marked`}\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:8px;width:100%\">\n      <button onclick=\"confirmWallSelect()\" class=\"btn btn-primary\" style=\"flex:1;justify-content:center;text-align:center\">\n        ${n > 0 ? 'Done ✓' : 'No external walls'}\n      <\u002Fbutton>\n      <button onclick=\"cancelWallSelect()\" class=\"btn btn-secondary\">Cancel<\u002Fbutton>\n    <\u002Fdiv>\n  `;\n}\n\nfunction hideWallSelectPanel(){\n  const panel = document.getElementById('wall-select-panel');\n  if(panel) panel.style.display = 'none';\n}\n\nfunction confirmWallSelect(){\n  if(!state._wallSelect) return;\n  const {poly, roomId, selected, isEdit} = state._wallSelect;\n  const externalWalls = [...selected];\n\n  state.tool = 'select';\n  stopWallSpin();\n  hideWallSelectPanel();\n  state._wallSelect = null;\n  drawCanvas();\n\n  // If opened from room modal Edit button, fire callback and return\n  if(state._wallSelectCallback){\n    const cb = state._wallSelectCallback;\n    state._wallSelectCallback = null;\n    cb(externalWalls);\n    return;\n  }\n\n  if(isEdit){\n    // Update existing room's external walls and recalculate\n    const room = state.rooms.find(r=>r.id===roomId);\n    if(room){\n      room.externalWalls = externalWalls;\n      room.orientation = calcOrientationFromWalls(poly, externalWalls);\n      room.kw = calcHeatLoad(room);\n      renderRoomsSidebar();\n      buildUnitPalette();\n      drawCanvas();\n      triggerAutoSave?.();\n      notify('External walls updated','ok');\n    }\n  } else {\n    // New room — attach walls to poly and open room modal\n    poly.externalWalls = externalWalls;\n    showRoomModal(poly, null);\n  }\n}\n\nfunction cancelWallSelect(){\n  const ws = state._wallSelect;\n  state.tool = 'select';\n  stopWallSpin();\n  hideWallSelectPanel();\n  state._wallSelect = null;\n  // If new room (not edit), discard the polygon\n  if(ws && !ws.isEdit){\n    drawCanvas();\n  } else {\n    drawCanvas();\n  }\n}\n\n// Calculate orientation from external walls + north arrow\n// Returns the compass point of the most sun-exposed external wall (weighted by length)\nfunction calcOrientationFromWalls(poly, externalWalls){\n  if(!externalWalls || externalWalls.length === 0) return 'N'; // no effect\n  const pts = poly.points;\n  const nb  = state.northArrow ? state.northArrow.bearing : 0;\n  const solarRank = {'W':6,'NW':5,'N':4,'NE':3,'E':2,'SE':1,'S':0,'SW':1};\n\n  // Centroid for outward normal direction\n  let cx=0, cy=0;\n  pts.forEach(p=>{cx+=p.x; cy+=p.y;});\n  cx/=pts.length; cy/=pts.length;\n\n  let bestCompass = 'N', bestScore = -1;\n  externalWalls.forEach(i=>{\n    const a=pts[i], b=pts[(i+1)%pts.length];\n    const dx=b.x-a.x, dy=b.y-a.y;\n    const len = Math.hypot(dx,dy);\n    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;\n    const n1={x:-dy,y:dx}, n2={x:dy,y:-dx};\n    const tx=mx-cx, ty=my-cy;\n    const outward = (n1.x*tx+n1.y*ty>0) ? n1 : n2;\n    const planAngle  = Math.atan2(outward.x, -outward.y)*180/Math.PI;\n    const bearing    = ((planAngle - nb) % 360 + 360) % 360;\n    const compass    = bearingToCompass(bearing);\n    const score      = len + (solarRank[compass]||0)*0.01;\n    if(score > bestScore){ bestScore=score; bestCompass=compass; }\n  });\n  return bestCompass;\n}\n\n// Handle wall-select clicks on canvas\nfunction handleWallSelectClick(pos){\n  const ws = state._wallSelect;\n  if(!ws) return;\n  const pts = ws.poly.points;\n  const hitRadius = 20 / state.vp.zoom;\n\n  for(let i=0;i<pts.length;i++){\n    const a=pts[i], b=pts[(i+1)%pts.length];\n    // Distance from pos to line segment a→b\n    const dx=b.x-a.x, dy=b.y-a.y;\n    const len2=dx*dx+dy*dy;\n    let t = len2>0 ? ((pos.x-a.x)*dx+(pos.y-a.y)*dy)/len2 : 0;\n    t = Math.max(0,Math.min(1,t));\n    const nearX=a.x+t*dx, nearY=a.y+t*dy;\n    const dist=Math.hypot(pos.x-nearX, pos.y-nearY);\n    if(dist < hitRadius){\n      if(ws.selected.has(i)) ws.selected.delete(i);\n      else ws.selected.add(i);\n      updateWallSelectPanel();\n      drawCanvas();\n      return;\n    }\n  }\n}\n\n// Draw wall-select overlay on canvas\nfunction drawWallSelectOverlay(ctx){\n  const ws = state._wallSelect;\n  if(!ws) return;\n  const pts = ws.poly.points;\n  const z   = state.vp.zoom;\n  const nb  = state.northArrow ? state.northArrow.bearing : 0;\n\n  // Centroid for outward normal + labels\n  let cx=0, cy=0;\n  pts.forEach(p=>{cx+=p.x; cy+=p.y;});\n  cx/=pts.length; cy/=pts.length;\n\n  for(let i=0;i<pts.length;i++){\n    const a=pts[i], b=pts[(i+1)%pts.length];\n    const isExt = ws.selected.has(i);\n    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;\n    const dx=b.x-a.x, dy=b.y-a.y;\n    const len = Math.hypot(dx,dy);\n    const GRN='#10B981', GRN_D='#047857', RED='#EF4444', RED_D='#B91C1C';\n\n    // Draw wall line — green = external (selected), red = not yet marked\n    ctx.beginPath();\n    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);\n    if(isExt){\n      ctx.strokeStyle=GRN; ctx.lineWidth=4/z; ctx.setLineDash([]);\n    } else {\n      ctx.strokeStyle=RED; ctx.lineWidth=2.5/z; ctx.setLineDash([6/z,4/z]);\n    }\n    ctx.stroke(); ctx.setLineDash([]);\n\n    // Midpoint hit zone — solid dot\n    const hitR = Math.min(len*0.18, 15/z);\n    ctx.beginPath(); ctx.arc(mx,my,hitR,0,Math.PI*2);\n    ctx.fillStyle = isExt ? GRN : 'rgba(239,68,68,0.14)';\n    ctx.fill();\n\n    // Spinning ring around the dot (animated)\n    const spin = (window._wallSpin||0);\n    ctx.save();\n    ctx.translate(mx,my);\n    ctx.rotate(isExt ? spin : -spin);     // selected spins CW, unselected CCW\n    ctx.beginPath();\n    ctx.arc(0,0,hitR+3/z,0,Math.PI*2);\n    ctx.strokeStyle = isExt ? GRN_D : RED_D;\n    ctx.lineWidth = 2/z;\n    ctx.setLineDash([ (Math.PI*(hitR+3/z))/4, (Math.PI*(hitR+3/z))/4 ]); // two-arc \"loading\" ring\n    ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.restore();\n\n    // Label on external walls: compass direction\n    if(isExt && state.northArrow){\n      const n1={x:-dy,y:dx}, n2={x:dy,y:-dx};\n      const tx=mx-cx, ty=my-cy;\n      const outward=(n1.x*tx+n1.y*ty>0)?n1:n2;\n      const planAngle=Math.atan2(outward.x,-outward.y)*180/Math.PI;\n      const bearing=((planAngle-nb)%360+360)%360;\n      const compass=bearingToCompass(bearing);\n      const fs=Math.max(9,11/z);\n      ctx.font=`800 ${fs}px Hanken Grotesk,sans-serif`;\n      ctx.fillStyle='#065F46'; ctx.textAlign='center'; ctx.textBaseline='middle';\n      ctx.fillText(compass, mx, my);\n    } else if(isExt){\n      const fs=Math.max(9,11/z);\n      ctx.font=`800 ${fs}px Hanken Grotesk,sans-serif`;\n      ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';\n      ctx.fillText('✓', mx, my);\n    }\n  }\n\n  // Dim fill over room\n  ctx.fillStyle='rgba(16,185,129,0.05)';\n  ctx.beginPath();\n  pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));\n  ctx.closePath(); ctx.fill();\n}\n\nfunction showPolyNameModal(poly, area_m2){\n  // Deprecated — now goes to wall selection first\n  startWallSelect(poly, null);\n}\n// Drag the room modal by its header; recenters on each open\nfunction startRmDrag(e){\n  const dlg=document.getElementById('rm-dialog');\n  if(!dlg||e.target.tagName==='BUTTON') return;\n  const r=dlg.getBoundingClientRect();\n  const ox=e.clientX, oy=e.clientY;\n  const m=/translate\\(([-\\d.]+)px,\\s*([-\\d.]+)px\\)/.exec(dlg.style.transform||'');\n  const bx=m?parseFloat(m[1]):0, by=m?parseFloat(m[2]):0;\n  const hdr=document.getElementById('rm-drag'); if(hdr) hdr.style.cursor='grabbing';\n  const move=(ev)=>{ dlg.style.transform=`translate(${bx+ev.clientX-ox}px, ${by+ev.clientY-oy}px)`; };\n  const up=()=>{ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); if(hdr) hdr.style.cursor='grab'; };\n  document.addEventListener('mousemove',move);\n  document.addEventListener('mouseup',up);\n}\n\n// Shows for new rooms (poly set, roomId null) and edits (roomId set, poly null).\nfunction showRoomModal(poly, roomId){\n  const isEdit = !!roomId;\n  let room = isEdit ? state.rooms.find(r=>r.id===roomId) : null;\n\n  // For new rooms, compute geometry first\n  let bw=4, bl=5, area_m2=20;\n  if(poly && poly.points){\n    const xs=poly.points.map(p=>p.x), ys=poly.points.map(p=>p.y);\n    bw = state.scale ? (Math.max(...xs)-Math.min(...xs))/state.scale : 4;\n    bl = state.scale ? (Math.max(...ys)-Math.min(...ys))/state.scale : 5;\n    bw = Math.round(bw*100)/100; bl = Math.round(bl*100)/100;\n    area_m2 = Math.round(bw*bl*10)/10;\n  } else if(room){\n    bw=room.width||4; bl=room.length||5; area_m2=room.area_m2||20;\n  }\n\n  // Working copy of values (committed on Done)\n  const def = {\n    name:      room?.name      || '',\n    width:     bw,\n    length:    bl,\n    height:    room?.height    || state.settings.defaultHeight || 2.4,\n    glass:     room?.glass     || state.settings.defaultGlass  || 'moderate',\n    condition: room?.condition || state.settings.defaultCondition || 'standard',\n    orientation: room?.orientation || (state.northArrow ? 'N' : 'N'),\n    orientationLocked: room?.orientationLocked || false,\n    partyWall: room?.partyWall || false,\n    externalWalls: room?.externalWalls || [],\n    unitType:  room?.units?.[0]?.type  || 'VMX',\n    unitModel: room?.units?.[0]?.model || '',\n  };\n\n  // Auto-detect orientation — prefer externalWalls if set, else geometry\n  if(!isEdit && poly){\n    const extWalls = poly.externalWalls || [];\n    if(extWalls.length > 0 && poly.points){\n      def.orientation = calcOrientationFromWalls(poly, extWalls);\n      def.externalWalls = extWalls;\n    } else if(state.northArrow && poly.points){\n      const b = primaryWallBearing(poly);\n      if(b !== null) def.orientation = bearingToCompass(b);\n    }\n  } else if(isEdit && room){\n    def.externalWalls = room.externalWalls || [];\n  }\n\n  function liveKw(){\n    const base = getBaseWm2();\n    const gm = {low:0.80, moderate:1.0, high:1.24}[cur.glass]||1;\n    const cm = {well_insulated:0.85, standard:1.0, poor:1.2}[cur.condition]||1;\n    const hm = cur.height>2.7?1.1:1;\n    const om = cur.partyWall ? 1.0 : (ORIENT_MULT[cur.orientation]||1);\n    return Math.round(cur.width*cur.length*base*gm*cm*hm*om)/1000;\n  }\n\n  const cur = {...def};\n\n  function render(){\n    const kw = liveKw();\n    const modelOpts = Object.entries(UNIT_DATA)\n      .filter(([k,v])=>v.type===cur.unitType)\n      .sort((a,b)=>a[1].kw-b[1].kw)\n      .map(([k,v])=>`<option value=\"${k}\" ${cur.unitModel===k?'selected':''}>${k} — ${v.kw} kW<\u002Foption>`)\n      .join('');\n    if(!cur.unitModel || !UNIT_DATA[cur.unitModel] || UNIT_DATA[cur.unitModel].type!==cur.unitType){\n      const best = selectUnit(kw, cur.unitType);\n      cur.unitModel = best || '';\n    }\n    const ud = UNIT_DATA[cur.unitModel]||{};\n    const meets = ud.kw >= kw;\n    const stdOpts = IDU_TYPES.filter(t=>!t.advanced).map(t=>`<option value=\"${t.value}\" ${cur.unitType===t.value?'selected':''}>${t.label}<\u002Foption>`).join('');\n    const advOpts = IDU_TYPES.filter(t=>t.advanced).map(t=>`<option value=\"${t.value}\" ${cur.unitType===t.value?'selected':''}>${t.label}<\u002Foption>`).join('');\n\n    m.querySelector('.rm-body').innerHTML = `\n      <!-- Name -->\n      <div style=\"margin-bottom:14px\">\n        <div class=\"rm-label\">Room name<\u002Fdiv>\n        <input class=\"rm-input\" id=\"rm-name\" type=\"text\" value=\"${cur.name}\" placeholder=\"e.g. Living / Dining\"\n          oninput=\"window._rmCur.name=this.value\" style=\"font-size:15px;font-weight:700\">\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:6px\">\n          ${['Living / Dining','Kitchen','Bedroom','Master Bedroom','Study','Open Plan','Bathroom','Office'].map(s=>\n            `<button class=\"rm-chip\" onclick=\"document.getElementById('rm-name').value='${s}';window._rmCur.name='${s}'\">${s}<\u002Fbutton>`\n          ).join('')}\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Dimensions -->\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px\">\n        <div><div class=\"rm-label\">Width m<\u002Fdiv>\n          <input class=\"rm-input rm-mono\" type=\"number\" value=\"${cur.width}\" step=\"0.1\" min=\"0.5\"\n            oninput=\"window._rmCur.width=parseFloat(this.value)||cur.width;window._rmRefresh()\"><\u002Fdiv>\n        <div><div class=\"rm-label\">Length m<\u002Fdiv>\n          <input class=\"rm-input rm-mono\" type=\"number\" value=\"${cur.length}\" step=\"0.1\" min=\"0.5\"\n            oninput=\"window._rmCur.length=parseFloat(this.value)||cur.length;window._rmRefresh()\"><\u002Fdiv>\n        <div><div class=\"rm-label\">Height m<\u002Fdiv>\n          <input class=\"rm-input rm-mono\" type=\"number\" value=\"${cur.height}\" step=\"0.1\" min=\"1.8\" max=\"10\"\n            oninput=\"window._rmCur.height=parseFloat(this.value)||cur.height;window._rmRefresh()\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Conditions row -->\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px\">\n        <div>\n          <div class=\"rm-label\">Glazing <i class=\"info-tip info-tip-right\" data-tip=\"Amount of glass in the room. Low (double glazed) reduces load by 20%. High (large or single glazed) increases it by 24%.\">i<\u002Fi><\u002Fdiv>\n          <select class=\"rm-select\" onchange=\"window._rmCur.glass=this.value;window._rmRefresh()\">\n            <option value=\"low\" ${cur.glass==='low'?'selected':''}>Low — double glazed<\u002Foption>\n            <option value=\"moderate\" ${cur.glass==='moderate'?'selected':''}>Moderate<\u002Foption>\n            <option value=\"high\" ${cur.glass==='high'?'selected':''}>High — large / single<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <div>\n          <div class=\"rm-label\">Condition <i class=\"info-tip\" data-tip=\"Building envelope quality. Well insulated reduces load by 15%. Poor insulation increases it by 20%. Standard = no adjustment.\">i<\u002Fi><\u002Fdiv>\n          <select class=\"rm-select\" onchange=\"window._rmCur.condition=this.value;window._rmRefresh()\">\n            <option value=\"well_insulated\" ${cur.condition==='well_insulated'?'selected':''}>Well insulated<\u002Foption>\n            <option value=\"standard\" ${cur.condition==='standard'?'selected':''}>Standard<\u002Foption>\n            <option value=\"poor\" ${cur.condition==='poor'?'selected':''}>Poor insulation<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px\">\n            <span class=\"rm-label\" style=\"margin-bottom:0\">Orientation <i class=\"info-tip\" data-tip=\"Direction the primary glazed wall faces. West is worst (×1.30). South is mildest (×0.85 — minimal direct sun in Australia). Derived from your marked external walls.\">i<\u002Fi><\u002Fspan>\n            ${cur.orientationLocked\n              ? `<span class=\"rm-orient-badge override\">Override<\u002Fspan><button class=\"rm-orient-reset\" onclick=\"window._rmCur.orientationLocked=false;if(typeof autoDetectOrientations==='function')autoDetectOrientations();window._rmRefresh()\" title=\"Reset to auto\">&#8635; Auto<\u002Fbutton>`\n              : `<span class=\"rm-orient-badge auto\">${cur.externalWalls&&cur.externalWalls.length>0?'Auto – walls':'Auto – north'}<\u002Fspan>`\n            }\n          <\u002Fdiv>\n          <select class=\"rm-select\" onchange=\"window._rmCur.orientation=this.value;window._rmCur.orientationLocked=true;window._rmRefresh()\">\n            ${['N','NE','E','SE','S','SW','W','NW'].map(o=>`<option value=\"${o}\" ${cur.orientation===o?'selected':''}>${ORIENT_LABELS[o]} ×${ORIENT_MULT[o].toFixed(2)}<\u002Foption>`).join('')}\n          <\u002Fselect>\n          ${!cur.orientationLocked?`<div style=\"font-size:10px;color:var(--ssx-faint);margin-top:4px\">Change the dropdown to override<\u002Fdiv>`:''}\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Edit external walls -->\n      <div style=\"margin-bottom:14px\">\n        <button onclick=\"editExternalWallsFromModal()\" style=\"width:100%;padding:7px 10px;border:1.5px solid var(--ssx-border-strong);border-radius:5px;background:var(--ssx-card2);font-size:12px;font-family:var(--ssx-font);cursor:pointer;color:var(--ssx-label);font-weight:600;text-align:left;display:flex;align-items:center;gap:8px\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><rect x=\"1\" y=\"1\" width=\"12\" height=\"12\" rx=\"1.5\"/><path d=\"M4 7h6M7 4v6\"/><\u002Fsvg>\n          ${cur.externalWalls&&cur.externalWalls.length>0\n            ? `${cur.externalWalls.length} external wall${cur.externalWalls.length>1?'s':''} marked — click to edit`\n            : 'Mark external walls on canvas'}\n        <\u002Fbutton>\n      <\u002Fdiv>\n      ${cur.partyWall?`<div style=\"margin-bottom:14px;padding:7px 10px;background:#fffbeb;border:1px solid #fcd34d;border-radius:5px;font-size:11px;color:#92400e\">\n        Orientation multiplier removed — wall treated as internal (×1.00)<\u002Fdiv>`:'<div style=\"margin-bottom:0\"><\u002Fdiv>'}\n\n      <!-- Heat load result -->\n      <div style=\"display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--ssx-accent-bg);border:1px solid var(--ssx-border);border-radius:6px;margin-bottom:14px\">\n        <div>\n          <div style=\"font-size:11px;color:var(--ssx-label)\">Calculated heat load<\u002Fdiv>\n          <div style=\"font-size:10px;color:var(--ssx-faint);margin-top:1px\">${Math.round(cur.width*cur.length*10)/10} m² · Zone ${state.settings.climateZone} · ${getBaseWm2()} W/m²<\u002Fdiv>\n        <\u002Fdiv>\n        <div id=\"rm-kw-display\" style=\"font-family:var(--ssx-mono);font-size:26px;font-weight:900;color:var(--ssx-accent)\">${kw.toFixed(2)} kW<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Unit selection -->\n      <div style=\"margin-bottom:8px\"><div class=\"rm-label\">Unit type<\u002Fdiv>\n        <select class=\"rm-select\" style=\"width:100%\" onchange=\"window._rmCur.unitType=this.value;window._rmCur.unitModel='';window._rmRefresh()\">\n          ${stdOpts}<optgroup label=\"─── Advanced ───\">${advOpts}<\u002Foptgroup>\n        <\u002Fselect>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:14px\"><div class=\"rm-label\">Model<\u002Fdiv>\n        <select class=\"rm-select rm-mono\" style=\"width:100%\" onchange=\"window._rmCur.unitModel=this.value\">\n          ${modelOpts}\n        <\u002Fselect>\n      <\u002Fdiv>\n\n      <!-- Load balance -->\n      <div style=\"padding:8px 12px;border-radius:6px;font-size:12px;font-weight:600;\n        background:${meets?'#f0fdf4':'#fffbeb'};border:1px solid ${meets?'#86efac':'#fcd34d'};\n        color:${meets?'var(--ssx-ok)':'var(--ssx-warn)'}\">\n        ${ud.kw?`${ud.kw} kW selected ${meets?'✓ meets load':`— ${(kw-ud.kw).toFixed(1)} kW short`}`:'Select a model above'}\n      <\u002Fdiv>`;\n\n    // Keep window._rmCur in sync\n    window._rmCur = cur;\n  }\n\n  // Create or reuse modal\n  let m = document.getElementById('room-modal');\n  if(!m){\n    m = document.createElement('div');\n    m.id = 'room-modal';\n    m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.58);z-index:2100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(1px)';\n    m.innerHTML = `<div id=\"rm-dialog\" style=\"background:var(--ssx-card);border-radius:12px;width:520px;max-height:90vh;overflow-y:auto;box-shadow:var(--ssx-shadow-lg,0 20px 60px rgba(0,0,0,.3));border:1px solid var(--ssx-border-strong)\">\n      <div id=\"rm-drag\" onmousedown=\"startRmDrag(event)\" style=\"padding:20px 24px 0;cursor:grab\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px\">\n          <div id=\"rm-title\" style=\"font-family:var(--ssx-head);font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.05em\"><\u002Fdiv>\n          <button onclick=\"cancelRoomModal()\" style=\"background:none;border:none;font-size:22px;cursor:pointer;color:var(--ssx-faint);line-height:1;padding:0 2px\">✕<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rm-body\" style=\"padding:0 24px 20px\"><\u002Fdiv>\n      <div style=\"padding:14px 24px;border-top:1px solid var(--ssx-border);display:flex;gap:8px;justify-content:flex-end;background:var(--ssx-card2);border-radius:0 0 12px 12px\">\n        <button onclick=\"cancelRoomModal()\" class=\"btn btn-secondary\">Cancel<\u002Fbutton>\n        <button onclick=\"confirmRoomModal()\" class=\"btn btn-primary\" style=\"min-width:100px\">Done ✓<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n    document.body.appendChild(m);\n  }\n\n  m.querySelector('#rm-title').textContent = isEdit ? `Edit — ${room.name||'Room'}` : 'New room';\n  m.style.display = 'flex';\n  // Recenter the dialog every time it opens (clears any prior drag offset)\n  const _dlg=m.querySelector('#rm-dialog'); if(_dlg) _dlg.style.transform='';\n  m._poly   = poly;\n  m._roomId = roomId;\n  window._rmCur = cur;\n  window._rmRefresh = render;\n  render();\n  setTimeout(()=>m.querySelector('#rm-name')?.focus(), 50);\n}\n\n// Called from room modal — temporarily close modal, enter wall select, reopen after\nfunction editExternalWallsFromModal(){\n  const m = document.getElementById('room-modal');\n  if(!m) return;\n  const cur  = window._rmCur;\n  const poly  = m._poly || state.polygons.find(p=>p.roomId===m._roomId);\n  const roomId = m._roomId;\n  if(!poly) return;\n\n  // Hide modal temporarily\n  m.style.display = 'none';\n\n  // Pre-populate with current selection\n  poly.externalWalls = cur.externalWalls || [];\n\n  // Override confirm to update cur and re-show modal instead of opening a new one\n  state._wallSelectCallback = (externalWalls) => {\n    cur.externalWalls = externalWalls;\n    if(externalWalls.length > 0){\n      cur.orientation = calcOrientationFromWalls(poly, externalWalls);\n      // do NOT set orientationLocked — this is still auto-detected from wall geometry\n    }\n    window._rmCur = cur;\n    m.style.display = 'flex';\n    window._rmRefresh();\n  };\n\n  startWallSelect(poly, null);\n}\n\nfunction cancelRoomModal(){\n  const m = document.getElementById('room-modal');\n  if(!m) return;\n  m.style.display = 'none';\n  // If this was a new room (poly attached, no roomId), remove the polygon\n  if(m._poly && !m._roomId){\n    state.activePolygon = null;\n    drawCanvas();\n  }\n  m._poly = null; m._roomId = null;\n  setTool('select');\n}\n\nfunction confirmRoomModal(){\n  const m = document.getElementById('room-modal');\n  if(!m) return;\n  const cur = window._rmCur;\n  // Always read name from the live DOM input — oninput may not have fired for all input methods\n  const nameInput = m.querySelector('#rm-name');\n  if(nameInput) cur.name = nameInput.value.trim();\n  const poly = m._poly;\n  const roomId = m._roomId;\n  m.style.display = 'none';\n  m._poly = null; m._roomId = null;\n\n  const kw = (()=>{\n    const base=getBaseWm2();\n    const gm={low:0.80,moderate:1.0,high:1.24}[cur.glass]||1;\n    const cm={well_insulated:0.85,standard:1.0,poor:1.2}[cur.condition]||1;\n    const hm=cur.height>2.7?1.1:1;\n    const om=ORIENT_MULT[cur.orientation]||1;\n    return Math.round(cur.width*cur.length*base*gm*cm*hm*om)/1000;\n  })();\n\n  const modelKw = UNIT_DATA[cur.unitModel]?.kw || kw;\n\n  if(roomId){\n    // Edit existing room\n    const room = state.rooms.find(r=>r.id===roomId);\n    if(room){\n      Object.assign(room, {\n        name:cur.name||room.name||'Room',\n        width:cur.width, length:cur.length, height:cur.height,\n        glass:cur.glass, condition:cur.condition,\n        orientation:cur.orientation, orientationLocked:cur.orientationLocked,\n        partyWall:cur.partyWall,\n        externalWalls:cur.externalWalls||[],\n        kw, area_m2:Math.round(cur.width*cur.length*10)/10,\n        units:[{model:cur.unitModel, type:cur.unitType, kw:modelKw}],\n        _sidebarOpen:false,\n      });\n    }\n  } else if(poly){\n    // New room\n    pushUndo();\n    const xs=poly.points.map(p=>p.x), ys=poly.points.map(p=>p.y);\n    const area_m2 = Math.round(cur.width*cur.length*10)/10;\n    poly.area_m2 = area_m2;\n    poly.excluded = false;\n    poly.id = poly.id || Date.now();\n    state.polygons.push(poly);\n\n    const sys = state.systems[state.activeSys];\n    const room = {\n      id:state.nextRoomId++,\n      name:cur.name||'Room',\n      floor:state.activeFloor, sysId:sys.id,\n      kw, area_m2,\n      method:'heat',\n      width:cur.width, length:cur.length, height:cur.height,\n      glass:cur.glass, condition:cur.condition,\n      orientation:cur.orientation, orientationLocked:cur.orientationLocked,\n      notes:'', open:false, aiGenerated:false,\n      polygonId:poly.id, _sidebarOpen:false,\n      units:[{model:cur.unitModel, type:cur.unitType, kw:modelKw}],\n    };\n    state.rooms.push(room);\n    poly.roomId = room.id;\n    notify(`${room.name} added · ${area_m2} m² · ${kw.toFixed(1)} kW`,'ok');\n  }\n\n  setTool('select');\n  drawCanvas();\n  renderRoomsSidebar();\n  buildUnitPalette();\n  updateOverview();\n  triggerAutoSave?.();\n}\n\nfunction confirmPolyName(){\n  // Deprecated shim — route to new modal confirm\n  confirmRoomModal();\n}\n\nfunction cancelPolyName(){\n  cancelRoomModal();\n}\n\nfunction togglePolygonExcluded(polyId){\n  const poly = state.polygons.find(p=>p.id===polyId);\n  if(!poly) return;\n  poly.excluded = !poly.excluded;\n  // Also exclude/include the linked room\n  if(poly.roomId){\n    state.rooms = state.rooms.filter(r => poly.excluded ? r.id!==poly.roomId : true);\n    if(!poly.excluded && !state.rooms.find(r=>r.id===poly.roomId)){\n      // Re-add the room — trigger name modal is too complex; just notify\n      notify('Re-draw this polygon to re-add the room','warn');\n    }\n  }\n  drawCanvas();\n}\n\n// ── roundRect polyfill (Safari <15.4 / older browsers) ──\nif(typeof CanvasRenderingContext2D !== 'undefined' && CanvasRenderingContext2D.prototype && !CanvasRenderingContext2D.prototype.roundRect){\n  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){\n    if(w<2*r) r=w/2; if(h<2*r) r=h/2;\n    this.beginPath();\n    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r);\n    this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r);\n    this.arcTo(x,y,x+w,y,r); this.closePath();\n    return this;\n  };\n}\n\n// ── Draw helpers ─────────────────────────────────────────\n// ── Pipe routing helpers ─────────────────────────────────\n// Returns the refrigerant connection point of a unit in canvas coords,\n// accounting for rotation. Connection is at the bottom-centre of the unit body\n// (where PEFY/PUMY pipe connections typically sit).\nfunction unitConnectionPoint(unit){\n  let ud;\n  if(unit.type==='odu'){\n    const odu=ODU_DATA.find(o=>o.model===unit.model);\n    ud=odu?{w:odu.w,d:odu.d}:{w:1050,d:330};\n  } else {\n    ud=UNIT_DATA[unit.model]||{w:570,d:230};\n  }\n  const ph=state.scale?(ud.d/1000*state.scale):24;\n  // Local connection point: bottom-centre of unit (0, ph/2)\n  const lx=0, ly=ph/2;\n  const rad=(unit.rotation||0)*Math.PI/180;\n  return {\n    x: unit.x + (lx*Math.cos(rad) - ly*Math.sin(rad)),\n    y: unit.y + (lx*Math.sin(rad) + ly*Math.cos(rad)),\n    unitId: unit.id\n  };\n}\n\n// Find the nearest unit connection point within a snap radius (screen px)\nfunction nearestConnection(pos){\n  const snapPx = 18 / state.vp.zoom;\n  let best=null, bestDist=snapPx;\n  state.placedUnits.filter(u=>u.floor===state.activeFloor).forEach(u=>{\n    const cp=unitConnectionPoint(u);\n    const d=Math.hypot(cp.x-pos.x, cp.y-pos.y);\n    if(d<bestDist){ bestDist=d; best=cp; }\n  });\n  return best;\n}\n\n// Snap a point to be orthogonal (horizontal or vertical) relative to an anchor.\n// Picks whichever axis the cursor has moved further along.\nfunction orthoSnap(anchor, pos){\n  const dx=Math.abs(pos.x-anchor.x);\n  const dy=Math.abs(pos.y-anchor.y);\n  if(dx>=dy) return {x:pos.x, y:anchor.y}; // horizontal segment\n  return {x:anchor.x, y:pos.y};            // vertical segment\n}\n\n// Snap a point to the nearest point lying on any pipe segment (this floor).\nfunction nearestPointOnPipes(pos){\n  const snapPx = 16 / state.vp.zoom;\n  let best=null, bestDist=snapPx, bestPipe=null;\n  state.pipes.filter(p=>p.floor===state.activeFloor).forEach(pipe=>{\n    for(let i=1;i<pipe.points.length;i++){\n      const a=pipe.points[i-1], b=pipe.points[i];\n      const dx=b.x-a.x, dy=b.y-a.y;\n      const len2=dx*dx+dy*dy;\n      if(len2===0) continue;\n      let t=((pos.x-a.x)*dx+(pos.y-a.y)*dy)/len2;\n      t=Math.max(0,Math.min(1,t));\n      const px=a.x+t*dx, py=a.y+t*dy;\n      const d=Math.hypot(px-pos.x, py-pos.y);\n      if(d<bestDist){ bestDist=d; best={x:px,y:py}; bestPipe=pipe; }\n    }\n  });\n  if(best) best.pipeId = bestPipe?.id;\n  return best;\n}\n\n// Nearest riser on the active floor within a snap radius\nfunction nearestRiser(pos, radPx){\n  const snap = (radPx||22) / state.vp.zoom;\n  let best=null, bestD=snap;\n  state.risers.filter(r=>r.floor===state.activeFloor).forEach(r=>{\n    const d=Math.hypot(pos.x-r.x, pos.y-r.y);\n    if(d<bestD){ bestD=d; best=r; }\n  });\n  return best;\n}\n\n// Neutral \"undsized\" pipe appearance — all runs draw the same until Auto-size\nconst PIPE_DEFAULT = { suc:null, liq:null, lw:4, col:'#64748b' };\n\n// Auto pipe sizing — read the drawn network and size every run by the load it carries,\n// then colour it per PIPE_SIZES. A run's load = sum of kW of indoor units it touches\n// (via endpoint unitIds); if it touches none, fall back to its system's total load.\nfunction autoPipeSize(){\n  if(!state.pipes.length){ notify('Draw some pipe runs first','warn'); return; }\n  pushUndo();\n  state.pipes.forEach(pipe=>{\n    const sys = state.systems.find(s=>s.id===pipe.sysId) || state.systems[0];\n    // units referenced at this pipe's endpoints\n    const unitIds = pipe.points.filter(p=>p.unitId).map(p=>p.unitId);\n    let kw = 0;\n    if(unitIds.length){\n      kw = unitIds.reduce((s,id)=>{\n        const u = state.placedUnits.find(x=>x.id===id);\n        return s + (u?.kw || 0);\n      }, 0);\n    }\n    if(!kw){\n      // trunk run with no direct unit endpoint → carries the whole system\n      kw = state.rooms.filter(r=>r.sysId===(sys?.id)).reduce((s,r)=>s+(r.kw||0), 0);\n    }\n    const ps = getPipeSize(kw);\n    pipe.size = ps.suc; pipe.liq = ps.liq; pipe.lw = ps.lw; pipe.col = ps.col; pipe.sized = true; pipe.kw = Math.round(kw*10)/10;\n  });\n  drawCanvas(); renderComponentsList?.(); updateLegendLabels?.(); triggerAutoSave?.();\n  notify('Pipes auto-sized & coloured by load','ok');\n}\n\n// Ask how high a pipe rises through a riser (vertical travel for the engine)\nfunction promptPipeHeight(pipe, riser){\n  const def = pipe.riseHeight || 3;\n  const v = prompt(`Vertical height this pipe travels through ${riser?.label||'the riser'} (metres):`, def);\n  if(v!==null){\n    const h=parseFloat(v);\n    if(h>0){ pipe.riseHeight=h; pipe.riserId=riser?.id; notify(`Riser rise set: ${h}m`,'ok'); renderComponentsList?.(); triggerAutoSave?.(); }\n  }\n}\n\n// Riser config dialog — direction (up/down), destination floor (or custom roof/basement), name.\n// Confirming propagates a linked riser onto the destination floor at the same position.\nfunction showRiserConfig(riser){\n  let m=document.getElementById('riser-config');\n  if(!m){\n    m=document.createElement('div');\n    m.id='riser-config';\n    m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.58);z-index:3000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(1px)';\n    document.body.appendChild(m);\n  }\n  // Build destination options from allocated floors (exclude the riser's own floor)\n  const floorOpts = state.floors.map((f,i)=>\n    i===riser.floor ? '' : `<option value=\"${i}\">${(f.level||f.name||('Floor '+(i+1)))}<\u002Foption>`\n  ).join('');\n  m.innerHTML=`\n    <div style=\"background:var(--ssx-card);border-radius:14px;width:380px;box-shadow:0 24px 60px rgba(0,0,0,.3);border:1px solid var(--ssx-border-strong);overflow:hidden\">\n      <div style=\"padding:18px 20px 0\">\n        <div style=\"font-family:var(--ssx-head);font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px\">Riser ${riser.label}<\u002Fdiv>\n        <p style=\"font-size:12px;color:var(--ssx-label);margin:0 0 16px\">Where does this riser connect, and which way does the pipe travel?<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:0 20px 4px;display:flex;flex-direction:column;gap:14px\">\n        <div>\n          <div class=\"rm-label\">Direction<\u002Fdiv>\n          <div class=\"tw-seg\" id=\"rc-dir\">\n            <button data-v=\"up\" class=\"${riser.dir!=='down'?'on':''}\">↑ Up<\u002Fbutton>\n            <button data-v=\"down\" class=\"${riser.dir==='down'?'on':''}\">↓ Down<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"rm-label\">Connects to<\u002Fdiv>\n          <select id=\"rc-dest\" class=\"rm-select\" style=\"width:100%\">\n            ${floorOpts}\n            <option value=\"__custom\">Custom (roof, basement, plant…)<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <div id=\"rc-custom-wrap\" style=\"display:none\">\n          <div class=\"rm-label\">Custom destination name<\u002Fdiv>\n          <input id=\"rc-custom\" class=\"rm-select\" style=\"width:100%\" placeholder=\"e.g. Roof plant / Basement\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px 20px;display:flex;gap:8px;justify-content:flex-end\">\n        <button class=\"btn btn-secondary\" onclick=\"document.getElementById('riser-config').remove()\">Cancel<\u002Fbutton>\n        <button class=\"btn btn-primary\" onclick=\"confirmRiserConfig(${riser.id})\">Done ✓<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  m.style.display='flex';\n  // wire direction segmented control\n  m.querySelectorAll('#rc-dir button').forEach(b=>b.onclick=()=>{\n    m.querySelectorAll('#rc-dir button').forEach(x=>x.classList.remove('on')); b.classList.add('on');\n  });\n  const dest=m.querySelector('#rc-dest');\n  const cw=m.querySelector('#rc-custom-wrap');\n  dest.onchange=()=>{ cw.style.display = dest.value==='__custom' ? 'block' : 'none'; };\n  // default: if no allocated destination floors, force custom\n  if(!floorOpts.trim()){ dest.value='__custom'; cw.style.display='block'; }\n}\n\nfunction confirmRiserConfig(riserId){\n  const m=document.getElementById('riser-config');\n  const riser=state.risers.find(r=>r.id===riserId);\n  if(!riser||!m) { m?.remove(); return; }\n  pushUndo();\n  riser.dir = m.querySelector('#rc-dir button.on')?.dataset.v || 'up';\n  const dest = m.querySelector('#rc-dest').value;\n  if(dest==='__custom'){\n    riser.destFloor = null;\n    riser.destName  = (m.querySelector('#rc-custom').value||'').trim() || 'Custom';\n  } else {\n    const di = parseInt(dest);\n    riser.destFloor = di;\n    riser.destName  = state.floors[di]?.level || state.floors[di]?.name || ('Floor '+(di+1));\n    // Propagate a linked riser onto the destination floor at the same position (reverse direction)\n    const exists = state.risers.find(r=>r.groupId===riser.groupId && r.floor===di);\n    if(!exists){\n      state.risers.push({\n        id:state.nextRiserId++, sysId:riser.sysId, floor:di, x:riser.x, y:riser.y,\n        label:riser.label, groupId:riser.groupId,\n        dir: riser.dir==='up'?'down':'up',\n        destFloor: riser.floor,\n        destName: state.floors[riser.floor]?.level || state.floors[riser.floor]?.name || ('Floor '+(riser.floor+1))\n      });\n    }\n  }\n  m.remove();\n  drawCanvas(); renderComponentsList?.(); updatePlacedList?.(); triggerAutoSave?.();\n  notify(`Riser ${riser.label} → ${riser.destName} (${riser.dir})`,'ok');\n}\n\nfunction drawUnit(ctx, unit){\n  const sys = state.systems.find(s=>s.id===unit.sysId);\n  const color = sys ? sys.color : '#4f46e5';\n  let ud;\n  if(unit.type==='odu'){\n    const odu = ODU_DATA.find(o=>o.model===unit.model);\n    ud = odu ? {w:odu.w, d:odu.d} : {w:1050, d:330};\n  } else {\n    ud = UNIT_DATA[unit.model] || {w:570, d:230};\n  }\n  const pw = state.scale ? (ud.w/1000*state.scale) : 60;\n  const ph = state.scale ? (ud.d/1000*state.scale) : 24;\n  const selected = state.selectedUnit === unit.id;\n  const utype = (unit.type==='odu') ? 'odu' : (UNIT_DATA[unit.model]?.type || 'VMX');\n\n  ctx.save();\n  ctx.translate(unit.x, unit.y);\n  if(unit.rotation) ctx.rotate(unit.rotation * Math.PI/180);\n\n  ctx.shadowColor = 'rgba(0,0,0,0.18)';\n  ctx.shadowBlur  = 7;\n  ctx.shadowOffsetY = 2;\n\n  // Body — WHITE fill, system-colored border\n  ctx.fillStyle   = '#ffffff';\n  ctx.strokeStyle = color;\n  ctx.lineWidth   = selected ? 2.5 : 1.6;\n  ctx.beginPath();\n  ctx.roundRect(-pw/2, -ph/2, pw, ph, 3.5);\n  ctx.fill(); ctx.stroke();\n  ctx.shadowColor = 'transparent';\n\n  // Airflow direction arrows (depends on unit type) — drawn in light system tint\n  if(unit.type!=='odu'){\n    const dirs = (utype==='VEM'||utype==='VFM') ? [[0,-1],[0,1],[-1,0],[1,0]]   // 4-way cassette\n              : (utype==='VLMD')                ? [[-1,0],[1,0]]                 // 2-way\n              : (utype==='VBM')                 ? [[0,1]]                        // 1-way\n              :                                   [[0,-1]];                      // ducted: single discharge\n    const reach = Math.min(pw,ph)*0.34;\n    ctx.strokeStyle = color+'99'; ctx.fillStyle = color+'99'; ctx.lineWidth = 1.3;\n    dirs.forEach(([ux,uy])=>{\n      const ex=ux*reach, ey=uy*reach;\n      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(ex,ey); ctx.stroke();\n      // arrowhead\n      const ang=Math.atan2(ey,ex), ah=3.2;\n      ctx.beginPath();\n      ctx.moveTo(ex,ey);\n      ctx.lineTo(ex-ah*Math.cos(ang-0.5), ey-ah*Math.sin(ang-0.5));\n      ctx.lineTo(ex-ah*Math.cos(ang+0.5), ey-ah*Math.sin(ang+0.5));\n      ctx.closePath(); ctx.fill();\n    });\n  } else {\n    // ODU — grille lines\n    ctx.strokeStyle = color+'55'; ctx.lineWidth = 0.8;\n    const nLines = Math.floor(pw/7);\n    for(let i=1;i<nLines;i++){ const lx=-pw/2+i*(pw/nLines); ctx.beginPath(); ctx.moveTo(lx,-ph/2+3); ctx.lineTo(lx,ph/2-3); ctx.stroke(); }\n  }\n\n  // Pipe connection point — small open circle at bottom-centre\n  ctx.fillStyle = '#fff'; ctx.strokeStyle = color; ctx.lineWidth = 1.5;\n  ctx.beginPath(); ctx.arc(0, ph/2, 3, 0, Math.PI*2); ctx.fill(); ctx.stroke();\n\n  // Model number on the unit, e.g. \"20 VMA\"\n  if(LAYERS.labels){\n    let label;\n    if(unit.type==='odu'){\n      label = unit.model.replace(/PUMY-|PUHY-/,'').replace(/-A\\d?$/,'');\n    } else {\n      const sm = unit.model.replace('PEFY-P','').replace('PLFY-P','').replace('PMFY-P','').replace(/-E1?$/,'').replace('-A','');\n      label = sm.replace(/(\\d+)([A-Z])/, '$1 $2');   // \"20VMA\" -> \"20 VMA\"\n    }\n    const fontSize = Math.max(7.5, Math.min(11, pw/8));\n    ctx.fillStyle   = '#17201B';\n    ctx.font        = `800 ${fontSize}px IBM Plex Mono,monospace`;\n    ctx.textAlign   = 'center';\n    ctx.textBaseline= 'middle';\n    // place text on a tiny white pad so airflow arrows don't muddy it\n    const tw=ctx.measureText(label).width;\n    ctx.fillStyle='rgba(255,255,255,.82)';\n    ctx.fillRect(-tw/2-2, -fontSize/2-1, tw+4, fontSize+2);\n    ctx.fillStyle = '#17201B';\n    ctx.fillText(label, 0, 0.5);\n    if(ph > 20){\n      ctx.font = `${Math.max(6.5, Math.min(9, pw/10))}px Hanken Grotesk,sans-serif`;\n      ctx.fillStyle = color;\n      ctx.fillText(`${unit.kw||''} kW`, 0, ph/2-6);\n    }\n  }\n\n  // Selection — dotted outline ring around the unit + rotate handle\n  if(selected){\n    const pad = 5;\n    ctx.strokeStyle = color;\n    ctx.lineWidth = 1.4;\n    ctx.setLineDash([4,3]);\n    ctx.beginPath();\n    ctx.roundRect(-pw/2-pad, -ph/2-pad, pw+pad*2, ph+pad*2, 5);\n    ctx.stroke();\n    ctx.setLineDash([]);\n    // Rotate handle above the unit\n    const hy = -ph/2-pad-14;\n    ctx.strokeStyle = color; ctx.lineWidth = 1.4;\n    ctx.beginPath(); ctx.moveTo(0,-ph/2-pad); ctx.lineTo(0,hy+5); ctx.stroke();\n    ctx.fillStyle = '#fff'; ctx.lineWidth = 1.6;\n    ctx.beginPath(); ctx.arc(0,hy,5.5,0,Math.PI*2); ctx.fill(); ctx.stroke();\n    ctx.strokeStyle = color; ctx.lineWidth = 1.3;\n    ctx.beginPath(); ctx.arc(0,hy,3,-Math.PI*0.7,Math.PI*0.9); ctx.stroke();\n  }\n  ctx.restore();\n}\n\nfunction drawRiser(ctx, riser){\n  const sys   = state.systems.find(s=>s.id===riser.sysId);\n  const color = sys ? sys.color : '#6366f1';\n  const r     = 16;\n  const isHL  = state._highlightComp?.type==='riser' && state._highlightComp?.id===riser.id;\n  const isSnap= state._snapRiserId===riser.id;\n\n  ctx.save();\n  ctx.translate(riser.x, riser.y);\n\n  if(isSnap){\n    ctx.globalAlpha=0.5; ctx.fillStyle='#10B981';\n    ctx.beginPath(); ctx.arc(0,0,r*2.1,0,Math.PI*2); ctx.fill();\n    ctx.globalAlpha=1;\n  }\n\n  if(isHL){\n    ctx.globalAlpha=0.25; ctx.fillStyle=color;\n    ctx.beginPath(); ctx.arc(0,0,r*1.8,0,Math.PI*2); ctx.fill();\n    ctx.globalAlpha=1;\n  }\n\n  ctx.fillStyle   = color+'22';\n  ctx.strokeStyle = isSnap ? '#059669' : color;\n  ctx.lineWidth   = isSnap ? 3 : 2;\n  ctx.setLineDash([4,3]);\n  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);\n  ctx.fill(); ctx.stroke();\n  ctx.setLineDash([]);\n\n  ctx.fillStyle    = color;\n  ctx.font         = 'bold 15px sans-serif';\n  ctx.textAlign    = 'center';\n  ctx.textBaseline = 'middle';\n  ctx.fillText(riser.dir==='up'?'↑':riser.dir==='down'?'↓':'↕', 0, 0);\n\n  ctx.font         = 'bold 9px IBM Plex Mono,monospace';\n  ctx.textBaseline = 'alphabetic';\n  if(LAYERS.labels){\n    const lbl = (riser.label||'R-A') + (riser.destName?(' → '+riser.destName):'');\n    ctx.fillText(lbl, 0, r+10);\n  }\n  ctx.restore();\n}\n\n// Canvas position of the rotate handle for a selected unit\nfunction rotateHandlePos(unitId){\n  const u = state.placedUnits.find(x=>x.id===unitId);\n  if(!u) return null;\n  let ud = u.type==='odu' ? (ODU_DATA.find(o=>o.model===u.model)||{d:330}) : (UNIT_DATA[u.model]||{d:230});\n  const ph = state.scale ? (ud.d/1000*state.scale) : 24;\n  const off = ph/2 + 5 + 14;\n  const rad = (u.rotation||0)*Math.PI/180;\n  return { x: u.x + Math.sin(rad)*off*-1 * -1, y: u.y - Math.cos(rad)*off };\n}\n\nfunction findUnitAt(pos){\n  // Reverse-iterate so topmost unit is found first\n  return [...state.placedUnits].reverse().find(u=>{\n    if(u.floor !== state.activeFloor) return false;\n    let ud;\n    if(u.type==='odu'){\n      const odu = ODU_DATA.find(o=>o.model===u.model);\n      ud = odu ? {w:odu.w,d:odu.d} : {w:1050,d:330};\n    } else {\n      ud = UNIT_DATA[u.model] || {w:570,d:230};\n    }\n    const pw = state.scale ? (ud.w/1000*state.scale) : 60;\n    const ph = state.scale ? (ud.d/1000*state.scale) : 24;\n    const rad = ((u.rotation||0) * Math.PI/180);\n    const dx = pos.x - u.x, dy = pos.y - u.y;\n    const lx =  dx*Math.cos(-rad) - dy*Math.sin(-rad);\n    const ly =  dx*Math.sin(-rad) + dy*Math.cos(-rad);\n    return lx>=-pw/2 && lx<=pw/2 && ly>=-ph/2 && ly<=ph/2;\n  });\n}\n\nfunction deleteSelected(){\n  if(!state.selectedUnit) return;\n  pushUndo();\n  state.placedUnits = state.placedUnits.filter(u=>u.id!==state.selectedUnit);\n  state.selectedUnit = null;\n  hideInspector();\n  drawCanvas();\n  updatePlacedList();\n}\n\n// ── Unit palette ──\nfunction buildUnitPalette(){\n  const palette=document.getElementById('unit-palette');\n  palette.innerHTML='';\n  const sys=state.systems[state.activeSys];\n\n  // One palette item per unit row per room\n  const sysRooms=state.rooms.filter(r=>r.sysId===sys.id);\n  // Live count badge: placed / total units in this system\n  const _totU=sysRooms.reduce((s,r)=>s+((r.units||[{}]).length),0);\n  const _plU=state.placedUnits.filter(u=>u.sysId===sys.id && u.type==='idu').length;\n  const _un=document.getElementById('acc-units-n'); if(_un) _un.textContent=`${_plU} / ${_totU} placed`;\n  const _up=document.getElementById('rp-pill-units'); if(_up) _up.textContent=`${_plU}/${_totU}`;\n\n  sysRooms.forEach(room=>{\n    const units=room.units||[{model:room.model||'PEFY-P20VMX-E', type:'VMX', kw:room.kw||2.2}];\n    units.forEach((u,uIdx)=>{\n      const ud=UNIT_DATA[u.model]||{kw:u.kw||0, label:''};\n      // Check if this specific unit is already placed on the canvas\n      const isPlaced=state.placedUnits.some(p=>p.roomId===room.id && p.model===u.model && p.type==='idu');\n      const item=document.createElement('div');\n      item.className='palette-item';\n      item.style.cssText=isPlaced\n        ? 'border-color:var(--ssx-ok);background:#f0fdf4;opacity:0.7;cursor:default'\n        : '';\n      item.draggable = !isPlaced;\n      const label=units.length>1?`${room.name||'Room'} · Unit ${uIdx+1}`:(room.name||'Room');\n      item.innerHTML=`\n        <div class=\"palette-icon\" style=\"border-color:${isPlaced?'var(--ssx-ok)':sys.color};color:${isPlaced?'var(--ssx-ok)':sys.color}\">${isPlaced?'✓':'IDU'}<\u002Fdiv>\n        <div class=\"palette-info\">\n          <div class=\"palette-model\" style=\"color:${isPlaced?'var(--ssx-ok)':'var(--ssx-text)'}\">${u.model}<\u002Fdiv>\n          <div class=\"palette-kw\">${label} · ${u.kw} kW${isPlaced?' · Placed':''}<\u002Fdiv>\n        <\u002Fdiv>`;\n      if(!isPlaced){\n        item.addEventListener('dragstart',e=>{\n          e.dataTransfer.setData('roomId', room.id);\n          e.dataTransfer.setData('model',  u.model);\n          e.dataTransfer.setData('kw',     u.kw);\n          e.dataTransfer.setData('type',   'idu');\n          e.dataTransfer.setData('sysId',  sys.id);\n          setDragImage(e, u.model, u.kw, sys.color, 'idu');\n        });\n      }\n      palette.appendChild(item);\n    });\n  });\n\n  // ODU\n  if(sys.odu){\n    const oduPlaced=state.placedUnits.some(p=>p.sysId===sys.id && p.type==='odu');\n    const oduItem=document.createElement('div');\n    oduItem.className='palette-item';\n    oduItem.style.cssText=oduPlaced\n      ? 'border-color:var(--ssx-ok);background:#f0fdf4;opacity:0.7;cursor:default'\n      : '';\n    oduItem.draggable = !oduPlaced;\n    oduItem.innerHTML=`\n      <div class=\"palette-icon\" style=\"border-color:${oduPlaced?'var(--ssx-ok)':sys.color};color:${oduPlaced?'var(--ssx-ok)':sys.color};font-size:${oduPlaced?'12px':'7px'}\">${oduPlaced?'✓':'ODU'}<\u002Fdiv>\n      <div class=\"palette-info\">\n        <div class=\"palette-model\" style=\"color:${oduPlaced?'var(--ssx-ok)':'var(--ssx-text)'}\">${sys.odu.model}<\u002Fdiv>\n        <div class=\"palette-kw\">Outdoor unit · ${sys.odu.kw} kW${oduPlaced?' · Placed':''}<\u002Fdiv>\n      <\u002Fdiv>`;\n    if(!oduPlaced){\n      oduItem.addEventListener('dragstart',e=>{\n        e.dataTransfer.setData('type',  'odu');\n        e.dataTransfer.setData('model', sys.odu.model);\n        e.dataTransfer.setData('kw',    sys.odu.kw);\n        e.dataTransfer.setData('sysId', sys.id);\n        setDragImage(e, sys.odu.model, sys.odu.kw, sys.color, 'odu');\n      });\n    }\n    palette.appendChild(oduItem);\n  }\n\n  if(sysRooms.length===0&&!sys.odu){\n    palette.innerHTML='<div style=\"padding:18px 12px;font-size:12px;color:var(--ssx-faint);text-align:center;line-height:1.5\">Add rooms in Step 2 first<\u002Fdiv>';\n  }\n\n  // Drop on canvas\n  const wrap=document.getElementById('canvas-wrap');\n  wrap.ondragover=e=>{e.preventDefault(); if(!state._placingUnit){state._placingUnit=true; updateUnitControls();}};\n  wrap.ondragleave=e=>{state._placingUnit=false; updateUnitControls();};\n  wrap.ondrop=e=>{\n    e.preventDefault();\n    state._placingUnit=false;\n    const pos=getCanvasCoords(e);\n    const roomId=parseInt(e.dataTransfer.getData('roomId'))||null;\n    const type=e.dataTransfer.getData('type')||'idu';\n    const model=e.dataTransfer.getData('model');\n    const kw=parseFloat(e.dataTransfer.getData('kw'))||0;\n    const sysId=parseInt(e.dataTransfer.getData('sysId'))||state.systems[state.activeSys].id;\n    // Guard — prevent placing an already-placed IDU or ODU\n    if(type==='idu' && roomId && state.placedUnits.some(p=>p.roomId===roomId && p.model===model && p.type==='idu')){\n      notify(`${model} is already placed for this room`,'warn'); return;\n    }\n    if(type==='odu' && state.placedUnits.some(p=>p.sysId===sysId && p.type==='odu')){\n      notify(`Outdoor unit already placed for this system`,'warn'); return;\n    }\n    pushUndo();\n    state.placedUnits.push({\n      id:state.nextUnitId++,\n      type, sysId, floor:state.activeFloor,\n      x:pos.x, y:pos.y, rotation:0, model, kw, roomId\n    });\n    drawCanvas();\n    updatePlacedList();\n    notify(`${model} placed`,'ok');\n    // Auto-select the freshly placed unit and open the inspector for location notes\n    const justPlaced=state.placedUnits[state.placedUnits.length-1];\n    state.selectedUnit=justPlaced.id;\n    showInspector(justPlaced);\n    drawCanvas();\n    triggerAutoSave();\n  };\n}\n\nfunction updatePlacedList(){\n  // The palette now shows placed status inline — just rebuild it\n  if(typeof buildUnitPalette==='function') buildUnitPalette();\n  if(typeof renderRoomsSidebar==='function') renderRoomsSidebar();\n}\n\nfunction showInspector(unit){\n  const inspector=document.getElementById('inspector');\n  // Relocate out of the legacy hidden sidebar into the body so it floats over the canvas\n  if(inspector.parentElement && inspector.parentElement.id==='canvas-sidebar'){\n    document.body.appendChild(inspector);\n  }\n  inspector.classList.add('visible');\n  const ud=UNIT_DATA[unit.model]||{};\n  const rot=((unit.rotation||0)%360+360)%360;\n  const room = unit.roomId ? state.rooms.find(r=>r.id===unit.roomId) : null;\n  const isOdu = unit.type==='odu';\n  const LOC_PRESETS = isOdu\n    ? ['Ground level','Roof / plant deck','Balcony','Wall bracket','Plinth']\n    : ['Inside roof space','In bulkhead','Under floor','Wall mounted','Ceiling cassette','In cupboard'];\n  const note = unit.locationNote||'';\n  document.getElementById('inspector-content').innerHTML=`\n    <div class=\"inspector-row\"><label>Model<\u002Flabel><span>${unit.model}<\u002Fspan><\u002Fdiv>\n    <div class=\"inspector-row\"><label>Type<\u002Flabel><span>${isOdu?'Outdoor unit':'Indoor unit'}<\u002Fspan><\u002Fdiv>\n    <div class=\"inspector-row\"><label>Capacity<\u002Flabel><span>${unit.kw} kW<\u002Fspan><\u002Fdiv>\n    <div class=\"inspector-row\"><label>${isOdu?'System':'Room'}<\u002Flabel><span>${isOdu?(state.systems.find(s=>s.id===unit.sysId)?.name||'-'):(room?room.name:'Unassigned')}<\u002Fspan><\u002Fdiv>\n    ${ud.w ? `<div class=\"inspector-row\"><label>Size<\u002Flabel><span style=\"font-family:var(--ssx-mono)\">${ud.w}×${ud.d} mm<\u002Fspan><\u002Fdiv>` : ''}\n    <div class=\"inspector-row\"><label>Rotation<\u002Flabel><span id=\"insp-rotation\">${rot}°<\u002Fspan><\u002Fdiv>\n    <div class=\"insp-loc-lbl\">Location notes<\u002Fdiv>\n    <div class=\"insp-loc-chips\">\n      ${LOC_PRESETS.map(p=>`<button class=\"insp-loc-chip${note===p?' on':''}\" onclick=\"setUnitLocation('${p.replace(/'/g,\"\\\\'\")}')\">${p}<\u002Fbutton>`).join('')}\n    <\u002Fdiv>\n    <textarea class=\"insp-loc-note\" placeholder=\"Add a custom note…\" oninput=\"setUnitLocation(this.value,true)\">${note}<\u002Ftextarea>\n  `;\n  updateUnitControls();\n}\n\n// Set the location note for the selected unit (from a quick chip or the textarea)\nfunction setUnitLocation(val, fromInput){\n  const u=state.placedUnits.find(x=>x.id===state.selectedUnit);\n  if(!u) return;\n  u.locationNote = val;\n  if(!fromInput){\n    // chip click — re-render chips to reflect the active state + mirror into textarea\n    showInspector(u);\n  }\n  triggerAutoSave?.();\n}\n\n// Close inspector + clear selection\nfunction deselectUnit(){\n  state.selectedUnit=null;\n  hideInspector();\n  drawCanvas();\n}\n\nfunction rotateSelected(deg){\n  if(!state.selectedUnit) return;\n  const unit=state.placedUnits.find(u=>u.id===state.selectedUnit);\n  if(!unit) return;\n  unit.rotation=((unit.rotation||0)+deg+360)%360;\n  const rotEl=document.getElementById('insp-rotation');\n  if(rotEl) rotEl.textContent=unit.rotation+'°';\n  drawCanvas();\n  updateUnitControls();\n  triggerAutoSave?.();\n}\n\nfunction hideInspector(){\n  document.getElementById('inspector').classList.remove('visible');\n  updateUnitControls();\n}\n\n// Position the floating rotate controls above the currently selected unit\nfunction updateUnitControls(){\n  const ctrl=document.getElementById('unit-controls');\n  if(!ctrl) return;\n  const unit=state.selectedUnit ? state.placedUnits.find(u=>u.id===state.selectedUnit) : null;\n  // Hide while dragging/placing a unit or panning — only show on a settled selection\n  if(!unit || unit.floor!==state.activeFloor || state.unitDrag || state._isPanning || state._placingUnit){\n    ctrl.style.display='none';\n    return;\n  }\n  // Convert unit canvas coords to screen coords using canvas-wrap bounding rect\n  const wrap = document.getElementById('canvas-wrap');\n  if(!wrap){ ctrl.style.display='none'; return; }\n  const wr = wrap.getBoundingClientRect();\n  const screenX = wr.left + unit.x * state.vp.zoom + state.vp.x;\n  const screenY = wr.top  + unit.y * state.vp.zoom + state.vp.y;\n  let ud;\n  if(unit.type==='odu'){\n    const odu=ODU_DATA.find(o=>o.model===unit.model);\n    ud=odu?{d:odu.d}:{d:330};\n  } else {\n    ud=UNIT_DATA[unit.model]||{d:230};\n  }\n  const ph=(state.scale?(ud.d/1000*state.scale):24)*state.vp.zoom;\n  ctrl.style.position='fixed';\n  ctrl.style.display='flex';\n  ctrl.style.left = screenX + 'px';\n  ctrl.style.top  = (screenY - ph/2 - 40) + 'px';\n  ctrl.style.transform='translateX(-50%)';\n  ctrl.style.zIndex='9999';\n}\n\n// ── Calibration ──\nfunction showCalibModal(){\n  if(!state.calibStart||!state.calibEnd) return;\n  const dx=state.calibEnd.x-state.calibStart.x;\n  const dy=state.calibEnd.y-state.calibStart.y;\n  window._calibPxLen=Math.sqrt(dx*dx+dy*dy);\n  document.getElementById('calib-preview').textContent=`Line length: ${Math.round(window._calibPxLen)} px — enter real-world measurement below`;\n  document.getElementById('calib-input').value='';\n  const _cm=document.getElementById('calib-modal'); _cm.classList.remove('closing'); _cm.classList.add('show');\n  setTimeout(()=>document.getElementById('calib-input').focus(),100);\n}\n\ndocument.getElementById('calib-input').addEventListener('input',e=>{\n  const real=parseFloat(e.target.value);\n  if(real>0&&window._calibPxLen>0){\n    const s=window._calibPxLen/real;\n    document.getElementById('calib-preview').textContent=\n      `Scale: ${Math.round(s)} px/m · a PEFY-P25VMX (698mm wide) will render ${Math.round(0.698*s)}px wide`;\n  }\n});\n\nfunction confirmCalib(){\n  const real=parseFloat(document.getElementById('calib-input').value);\n  if(real>0&&window._calibPxLen>0){\n    pushUndo();\n    state.scale=window._calibPxLen/real;\n    _modalClose(document.getElementById('calib-modal'));\n    updateScaleBadge();\n    recalcRoomsFromPolygons();\n    setTool('select');\n    drawCanvas();\n    notify(`Scale set: 1m = ${Math.round(state.scale)}px · room sizes updated`,'ok');\n    // Calibration step 2 — prompt to set north if not yet placed\n    if(!state.northArrow){ setTimeout(showNorthPrompt, 450); }\n  } else notify('Enter a valid measurement','warn');\n}\n\nfunction recalcRoomsFromPolygons(){\n  if(!state.scale) return;\n  state.polygons.forEach(poly=>{\n    if(!poly.roomId || !poly.points || poly.points.length<3) return;\n    const room=state.rooms.find(r=>r.id===poly.roomId);\n    if(!room) return;\n    const xs=poly.points.map(p=>p.x), ys=poly.points.map(p=>p.y);\n    const bw=(Math.max(...xs)-Math.min(...xs))/state.scale;\n    const bl=(Math.max(...ys)-Math.min(...ys))/state.scale;\n    room.width=Math.round(bw*100)/100;\n    room.length=Math.round(bl*100)/100;\n    room.area_m2=Math.round(bw*bl*10)/10;\n    poly.area_m2=room.area_m2;\n    if(room.method==='heat'){\n      room.kw=calcHeatLoad(room);\n      // Re-pick unit if single unit\n      if(room.units && room.units.length===1){\n        const best=selectUnit(room.kw, room.units[0].type||'VMX');\n        if(best){ room.units[0].model=best; room.units[0].kw=UNIT_DATA[best]?.kw||room.kw; }\n      }\n    }\n  });\n  if(typeof renderRoomsSidebar==='function') renderRoomsSidebar();\n  if(typeof updateOverview==='function') updateOverview();\n}\n\nfunction cancelCalib(){\n  state.calibStart=null;state.calibEnd=null;\n  _modalClose(document.getElementById('calib-modal'));\n  setTool('select');\n  drawCanvas();\n}\n\nfunction cycleCanvasSys(){\n  state.activeSys=(state.activeSys+1)%state.systems.length;\n  const sys=state.systems[state.activeSys];\n  document.getElementById('canvas-sys-dot').style.background=sys.color;\n  document.getElementById('canvas-sys-label').textContent=sys.tag?`${sys.name} — ${sys.tag}`:sys.name;\n  buildUnitPalette();\n  drawCanvas();\n}\n\n// ── Sidebar sections ──\nfunction toggleSection(id){\n  const el=document.getElementById(id);\n  if(el) el.style.display=el.style.display==='none'?'':'none';\n}\n\n// ═══════════════════════════════════════════════\n// MATERIALS\n// ═══════════════════════════════════════════════\n// ═══════════════════════════════════════════════\n// MATERIALS\n// ═══════════════════════════════════════════════\n// Scale for a given floor index (falls back to the supplied default)\nfunction scaleForFloor(idx, fallback){\n  const f = state.floors[idx];\n  return (f && f.scale) ? f.scale : (fallback || null);\n}\n\nfunction calcPipeLength(pipes, scale) {\n  // Returns {key: metres} grouped by \"suc/liq\" size pair.\n  // Each pipe is measured with ITS OWN floor's scale (pages are calibrated separately).\n  const groups = {};\n  pipes.forEach(pipe => {\n    let len = 0;\n    for(let i=1;i<pipe.points.length;i++){\n      const dx=pipe.points[i].x-pipe.points[i-1].x;\n      const dy=pipe.points[i].y-pipe.points[i-1].y;\n      len+=Math.sqrt(dx*dx+dy*dy);\n    }\n    const sc = (pipe.floor!=null) ? scaleForFloor(pipe.floor, scale) : scale;\n    const lenM = sc ? Math.round(len/sc*10)/10 : null;\n    const key = `ø${pipe.liq||'?'} liq / ø${pipe.size||'?'} suc`;\n    groups[key] = (groups[key]||0) + (lenM||0);\n  });\n  return groups;\n}\n\nfunction renderMaterials(){\n  const content = document.getElementById('materials-content');\n  const floorH = parseFloat(document.getElementById('floor-height')?.value)||3.0;\n  const hasScale = state.floors.some(f=>f.scale) || !!state.scale;\n\n  // Update subtitle\n  const sub = document.getElementById('materials-subtitle');\n  if(sub){\n    const nSys = state.systems.filter(s=>state.rooms.some(r=>r.sysId===s.id)||state.placedUnits.some(u=>u.sysId===s.id)).length;\n    const job = state.currentJobnum || '—';\n    sub.textContent = `${nSys} system${nSys!==1?'s':''} · ${state.floors.map(f=>f.name).join(', ')||'Ground Floor'} · ${job}`;\n  }\n\n  // Aggregate across all systems for combined totals\n  const combinedPipe = {};\n  let combinedIDU = 0, combinedODU = 0;\n\n  let html = '';\n\n  const activeSystems = state.systems.filter(sys =>\n    state.rooms.some(r=>r.sysId===sys.id) || state.placedUnits.some(u=>u.sysId===sys.id)\n  );\n\n  if(!activeSystems.length){\n    content.innerHTML=`<div class=\"empty-state\">\n      <svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"><rect x=\"8\" y=\"8\" width=\"32\" height=\"32\" rx=\"4\"/><path d=\"M16 24h16M24 16v16\"/><\u002Fsvg>\n      <h3>No rooms added yet<\u002Fh3><p>Go back to step 2 and add rooms first<\u002Fp>\n    <\u002Fdiv>`;\n    return;\n  }\n\n  activeSystems.forEach(sys => {\n    const sysRooms   = state.rooms.filter(r=>r.sysId===sys.id);\n    const sysPipes   = state.pipes.filter(p=>p.sysId===sys.id);\n    const sysRisers  = state.risers.filter(r=>r.sysId===sys.id);\n    const pipeGroups = calcPipeLength(sysPipes, state.scale);\n\n    // Riser pipe — vertical length per riser = floor-to-floor height\n    const riserLenM  = sysRisers.length * floorH;\n\n    // Drain pipe — rough estimate: 1m per IDU\n    const drainM = sysRooms.length * 1.0;\n\n    // Accumulate combined totals\n    combinedIDU += sysRooms.length;\n    if(sys.odu) combinedODU++;\n    Object.entries(pipeGroups).forEach(([k,v])=>{ combinedPipe[k]=(combinedPipe[k]||0)+v; });\n    if(riserLenM>0){\n      const rKey='Riser vertical'; combinedPipe[rKey]=(combinedPipe[rKey]||0)+riserLenM;\n    }\n\n    html += `\n    <div style=\"margin-bottom:28px\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid ${sys.color}33\">\n        <div style=\"width:12px;height:12px;border-radius:50%;background:${sys.color};flex-shrink:0\"><\u002Fdiv>\n        <span style=\"font-family:var(--ssx-head);font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.04em\">${sys.name}${sys.tag?` — ${sys.tag}`:''}<\u002Fspan>\n        ${sys.odu?`<span class=\"pill pill-blue\" style=\"font-family:var(--ssx-mono)\">${sys.odu.model}<\u002Fspan>`:'<span class=\"pill pill-warn\">No ODU selected<\u002Fspan>'}\n        <span style=\"margin-left:auto;font-size:12px;color:var(--ssx-faint)\">${sysRooms.length} indoor unit${sysRooms.length!==1?'s':''}<\u002Fspan>\n      <\u002Fdiv>\n      <table class=\"materials-table\">\n        <thead><tr><th>Model<\u002Fth><th>Description<\u002Fth><th style=\"text-align:right\">Qty<\u002Fth><th>Unit<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td colspan=\"4\" class=\"cat-row\">Indoor units<\u002Ftd><\u002Ftr>\n          ${sysRooms.length ? sysRooms.flatMap(r=>{\n            const units=r.units||[{model:r.model||'PEFY-P20VMX-E',kw:r.kw||2.2}];\n            return units.map(u=>{\n              const ud=UNIT_DATA[u.model]||{};\n              return `<tr>\n                <td><span style=\"font-family:var(--ssx-mono);font-size:12px\">${u.model}<\u002Fspan><\u002Ftd>\n                <td style=\"color:var(--ssx-label)\">${ud.label||''} &nbsp;·&nbsp; ${r.name||'Room'} &nbsp;·&nbsp; ${u.kw.toFixed(1)} kW<\u002Ftd>\n                <td style=\"text-align:right\"><span class=\"qty-badge\">1<\u002Fspan><\u002Ftd>\n                <td>ea<\u002Ftd>\n              <\u002Ftr>`;\n            });\n          }).join('') : '<tr><td colspan=\"4\" style=\"color:var(--ssx-faint);font-size:12px;padding:8px 12px\">No rooms added<\u002Ftd><\u002Ftr>'}\n\n          ${(()=>{\n            // BC Controllers — only show if any advanced unit types in this system\n            const sysBCs = (state.bcBoxes||[]).filter(b=>b.sysId===sys.id);\n            const hasAdv = sysRooms.some(r=>r.units&&r.units.some(u=>ADVANCED_IDU_TYPES.has(u.type)));\n            if(!hasAdv && !sysBCs.length) return '';\n            const bcRows = sysBCs.length\n              ? sysBCs.map(b=>`<tr>\n                  <td><span style=\"font-family:var(--ssx-mono);font-size:12px\">${b.model}<\u002Fspan><\u002Ftd>\n                  <td style=\"color:var(--ssx-label)\">BC Controller · ${b.branches}-port branch circuit<\u002Ftd>\n                  <td style=\"text-align:right\"><span class=\"qty-badge\">1<\u002Fspan><\u002Ftd>\n                  <td>ea<\u002Ftd>\n                <\u002Ftr>`).join('')\n              : `<tr><td colspan=\"4\" style=\"color:var(--ssx-warn);font-size:12px;padding:8px 12px\">⚠ Advanced units detected — place a BC Controller on the canvas<\u002Ftd><\u002Ftr>`;\n            return `<tr><td colspan=\"4\" class=\"cat-row\">BC Controllers (branch circuit)<\u002Ftd><\u002Ftr>${bcRows}`;\n          })()}\n\n          <tr><td colspan=\"4\" class=\"cat-row\">Outdoor unit<\u002Ftd><\u002Ftr>\n          ${sys.odu ? `<tr>\n            <td><span style=\"font-family:var(--ssx-mono);font-size:12px\">${sys.odu.model}<\u002Fspan><\u002Ftd>\n            <td style=\"color:var(--ssx-label)\">${sys.odu.kw} kW cooling / ${sys.odu.heat} kW heating &nbsp;·&nbsp; ${sys.odu.phase===3?'3Ø 415V':'1Ø 240V'}<\u002Ftd>\n            <td style=\"text-align:right\"><span class=\"qty-badge\">1<\u002Fspan><\u002Ftd>\n            <td>ea<\u002Ftd>\n          <\u002Ftr>` : '<tr><td colspan=\"4\" style=\"color:var(--ssx-danger);font-size:12px;padding:8px 12px\">⚠ No outdoor unit selected — review system loading<\u002Ftd><\u002Ftr>'}\n\n          <tr><td colspan=\"4\" class=\"cat-row\">Refrigerant pipework<\u002Ftd><\u002Ftr>\n          ${Object.keys(pipeGroups).length ? Object.entries(pipeGroups).map(([key,len])=>`<tr>\n            <td style=\"font-family:var(--ssx-mono);font-size:12px\">${key}<\u002Ftd>\n            <td style=\"color:var(--ssx-label)\">Refrigerant pipe pair<\u002Ftd>\n            <td style=\"text-align:right\"><span class=\"qty-badge\">${len>0?len+'m':'—'}<\u002Fspan><\u002Ftd>\n            <td>${hasScale?'m':'est.'}<\u002Ftd>\n          <\u002Ftr>`).join('') : `<tr><td colspan=\"4\" style=\"color:var(--ssx-faint);font-size:12px;padding:8px 12px\">${hasScale?'No pipe runs drawn on canvas yet':'Draw pipe runs on the canvas to calculate lengths'}<\u002Ftd><\u002Ftr>`}\n\n          ${riserLenM>0?`<tr>\n            <td style=\"font-family:var(--ssx-mono);font-size:12px\">Riser vertical<\u002Ftd>\n            <td style=\"color:var(--ssx-label)\">${sysRisers.length} riser${sysRisers.length!==1?'s':''} × ${floorH}m floor-to-floor<\u002Ftd>\n            <td style=\"text-align:right\"><span class=\"qty-badge\">${riserLenM}m<\u002Fspan><\u002Ftd>\n            <td>m<\u002Ftd>\n          <\u002Ftr>`:''}\n\n          <tr><td colspan=\"4\" class=\"cat-row\">Condensate drain<\u002Ftd><\u002Ftr>\n          <tr>\n            <td style=\"font-family:var(--ssx-mono);font-size:12px\">25mm drain<\u002Ftd>\n            <td style=\"color:var(--ssx-label)\">Condensate drain pipe — estimated 1m per IDU<\u002Ftd>\n            <td style=\"text-align:right\"><span class=\"qty-badge\">${drainM}m<\u002Fspan><\u002Ftd>\n            <td>m est.<\u002Ftd>\n          <\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>`;\n  });\n\n  // Combined total if multiple systems\n  if(activeSystems.length > 1){\n    html += `\n    <div style=\"margin-top:8px;padding-top:16px;border-top:2px solid var(--ssx-border-strong)\">\n      <div style=\"font-family:var(--ssx-head);font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ssx-label);margin-bottom:12px\">Combined total — all systems<\u002Fdiv>\n      <table class=\"materials-table\">\n        <thead><tr><th>Item<\u002Fth><th style=\"text-align:right\">Qty<\u002Fth><th>Unit<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Indoor units (all systems)<\u002Ftd><td style=\"text-align:right\"><span class=\"qty-badge\">${combinedIDU}<\u002Fspan><\u002Ftd><td>ea<\u002Ftd><\u002Ftr>\n          <tr><td>Outdoor units (all systems)<\u002Ftd><td style=\"text-align:right\"><span class=\"qty-badge\">${combinedODU}<\u002Fspan><\u002Ftd><td>ea<\u002Ftd><\u002Ftr>\n          ${Object.entries(combinedPipe).map(([k,v])=>`<tr><td style=\"font-family:var(--ssx-mono);font-size:12px\">${k}<\u002Ftd><td style=\"text-align:right\"><span class=\"qty-badge\">${v>0?v+'m':'—'}<\u002Fspan><\u002Ftd><td>m<\u002Ftd><\u002Ftr>`).join('')}\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>`;\n  }\n\n  content.innerHTML = html;\n}\n\n// ═══════════════════════════════════════════════\n// SAVE & EXPORT\n// ═══════════════════════════════════════════════\nfunction getJobDetails(){\n  return {\n    jobnum:   document.getElementById('jd-jobnum')?.value   || '',\n    client:   document.getElementById('jd-client')?.value   || '',\n    address:  document.getElementById('jd-address')?.value  || '',\n    designer: document.getElementById('jd-designer')?.value || '',\n    company:  document.getElementById('jd-company')?.value  || '',\n    notes:    document.getElementById('jd-notes')?.value    || '',\n    power:    document.getElementById('jd-power')?.value    || '',\n    servicemate: document.getElementById('jd-servicemate')?.value || '',\n    date:     document.getElementById('jd-date')?.value     || new Date().toISOString().split('T')[0],\n  };\n}\n\nfunction saveDesign(){\n  const jd = getJobDetails();\n  // Project details now live at the Job stage — if none captured yet, send the user there to fill them in\n  if(!jd.client && !jd.jobnum && !jd.address && state.step!==4){\n    notify('Add project details to save','warn');\n    goStep(4);\n    setTimeout(()=>document.getElementById('jd-client')?.focus(), 450);\n    return;\n  }\n  const saveData = {\n    version: 1,\n    savedAt: new Date().toISOString(),\n    jobDetails: jd,\n    state: {\n      floors: state.floors.map(f=>({...f, imageData: null})), // skip large image data\n      systems: state.systems,\n      rooms: state.rooms,\n      placedUnits: state.placedUnits,\n      pipes: state.pipes,\n      risers: state.risers,\n      scale: state.scale,\n      mode: state.mode,\n      noPlansCanvasMode: state.noPlansCanvasMode,\n    }\n  };\n  const key = `vrf_design_${jd.jobnum||Date.now()}`;\n  try {\n    LS.set(key, JSON.stringify(saveData));\n    LS.set('vrf_last_key', key);\n    // Clear both generic and per-job autosave entries\n    LS.remove(AUTOSAVE_KEY);\n    LS.remove(`vrf_autosave_${jd.jobnum||'draft'}`);\n    updateTopbar();\n    renderHome();\n    notify(`Design saved: ${key}`,'ok');\n  } catch(e) {\n    notify('Save failed — storage may be full','warn');\n  }\n}\n\nasync function exportPDF(){\n  if(!window.jspdf) {\n    notify('Loading PDF library…');\n    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');\n    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');\n    window.jspdf = window.jspdf || jspdf;\n  }\n  const { jsPDF } = window.jspdf;\n  const jd = getJobDetails();\n  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });\n  const W=210, margin=14;\n  let y=margin;\n\n  // ── Header ──\n  doc.setFillColor(0,87,255);\n  doc.rect(0,0,W,24,'F');\n  doc.setTextColor(255,255,255);\n  doc.setFont('helvetica','bold');\n  doc.setFontSize(16);\n  doc.text('VRF SYSTEM DESIGN',margin,10);\n  doc.setFontSize(9);\n  doc.setFont('helvetica','normal');\n  doc.text(jd.company||'DUCTR',margin,17);\n  doc.text(new Date().toLocaleDateString('en-AU'),W-margin,17,{align:'right'});\n  y=32;\n\n  // ── Job details block ──\n  doc.setTextColor(30,30,30);\n  doc.setFillColor(245,247,250);\n  doc.rect(margin,y,W-margin*2,28,'F');\n  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(120,120,120);\n  doc.text('JOB NUMBER',margin+4,y+5);   doc.text('CLIENT',margin+55,y+5);\n  doc.text('SITE ADDRESS',margin+120,y+5);\n  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(30,30,30);\n  doc.text(jd.jobnum||'—',margin+4,y+11);\n  doc.text(jd.client||'—',margin+55,y+11);\n  doc.text(jd.address||'—',margin+120,y+11,{maxWidth:66});\n  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(120,120,120);\n  doc.text('DESIGNED BY',margin+4,y+19);  doc.text('DATE',margin+55,y+19); doc.text('POWER',margin+120,y+19);\n  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(30,30,30);\n  doc.text(jd.designer||'—',margin+4,y+25);\n  doc.text(jd.date||'—',margin+55,y+25);\n  doc.text(jd.power||'—',margin+120,y+25);\n  y+=34;\n\n  // ── Per-system tables ──\n  const activeSystems = state.systems.filter(sys=>state.rooms.some(r=>r.sysId===sys.id));\n  const floorH = parseFloat(document.getElementById('floor-height')?.value)||3.0;\n\n  activeSystems.forEach(sys=>{\n    const sysRooms  = state.rooms.filter(r=>r.sysId===sys.id);\n    const sysPipes  = state.pipes.filter(p=>p.sysId===sys.id);\n    const sysRisers = state.risers.filter(r=>r.sysId===sys.id);\n    const pipeGroups= calcPipeLength(sysPipes,state.scale);\n\n    // System header\n    const col = sys.color;\n    const r=parseInt(col.slice(1,3),16), g=parseInt(col.slice(3,5),16), b=parseInt(col.slice(5,7),16);\n    doc.setFillColor(r,g,b);\n    doc.rect(margin,y,W-margin*2,7,'F');\n    doc.setTextColor(255,255,255);\n    doc.setFont('helvetica','bold'); doc.setFontSize(9);\n    doc.text(`${sys.name.toUpperCase()}${sys.odu?' — '+sys.odu.model:
