  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

      rgba(0,0,0,0.08);\n  --ssx-border-strong:rgba(0,0,0,0.14);\n  /* Text */\n  --ssx-text:         #111827;\n  --ssx-label:        #6B7280;\n  --ssx-faint:        #9CA3AF;\n  /* Accent */\n  --ssx-accent:       #0284C7;\n  --ssx-accent-hover: #0369A1;\n  --ssx-accent-bg:    rgba(2,132,199,0.10);\n  /* Inputs */\n  --ssx-input-bg:     rgba(255,255,255,0.90);\n  --ssx-input-border: rgba(0,0,0,0.14);\n  /* Interaction */\n  --ssx-hover:        rgba(0,0,0,0.04);\n  /* Nav / chrome */\n  --ssx-nav:          rgba(255,255,255,0.96);\n  --ssx-shadow:       0 10px 30px rgba(0,0,0,0.08);\n  --ssx-shadow-sm:    0 2px 8px rgba(0,0,0,0.06);\n  /* Radius */\n  --ssx-radius:       20px;\n  --ssx-radius-sm:    10px;\n  --ssx-radius-xs:    6px;\n  /* Status */\n  --ssx-ok:           #059669;\n  --ssx-ok-bg:        #ECFDF5;\n  --ssx-warn:         #D97706;\n  --ssx-warn-bg:      #FFFBEB;\n  --ssx-danger:       #DC2626;\n  --ssx-danger-bg:    #FEF2F2;\n  /* Fonts */\n  --ssx-font:         'Barlow', sans-serif;\n  --ssx-head:         'Barlow Condensed', sans-serif;\n  --ssx-mono:         'IBM Plex Mono', monospace;\n  /* Canvas bg */\n  --ssx-canvas-bg:    #DDE3EC;\n}\n[data-theme=\"dark\"] {\n  --ssx-bg:           #0B1220;\n  --ssx-card:         #111827;\n  --ssx-card2:        #162033;\n  --ssx-border:       rgba(255,255,255,0.06);\n  --ssx-border-strong:rgba(255,255,255,0.10);\n  --ssx-text:         #E5E7EB;\n  --ssx-label:        rgba(255,255,255,0.35);\n  --ssx-faint:        rgba(255,255,255,0.28);\n  --ssx-accent:       #0EA5E9;\n  --ssx-accent-hover: #38BDF8;\n  --ssx-accent-bg:    rgba(14,165,233,0.12);\n  --ssx-input-bg:     rgba(255,255,255,0.05);\n  --ssx-input-border: rgba(255,255,255,0.10);\n  --ssx-hover:        rgba(255,255,255,0.04);\n  --ssx-nav:          rgba(17,24,39,0.96);\n  --ssx-shadow:       0 10px 30px rgba(0,0,0,0.35);\n  --ssx-shadow-sm:    0 2px 8px rgba(0,0,0,0.25);\n  --ssx-ok:           #10B981;\n  --ssx-ok-bg:        rgba(16,185,129,0.12);\n  --ssx-warn:         #F59E0B;\n  --ssx-warn-bg:      rgba(245,158,11,0.12);\n  --ssx-danger:       #EF4444;\n  --ssx-danger-bg:    rgba(239,68,68,0.12);\n  --ssx-canvas-bg:    #060D19;\n}\n\nbody{font-family:var(--ssx-font);background:var(--ssx-bg);color:var(--ssx-text);font-size:14px;line-height:1.5;min-height:100vh}\n\n/* ── App shell ── */\n#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}\n#topbar{display:flex;align-items:center;gap:10px;padding:0 16px;height:48px;background:var(--ssx-nav);backdrop-filter:blur(8px);border-bottom:1px solid var(--ssx-border-strong);flex-shrink:0;z-index:100}\n#topbar .logo{display:flex;align-items:center;gap:8px;font-family:var(--ssx-head);font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ssx-text);text-decoration:none}\n#topbar .logo-icon{width:28px;height:28px;background:var(--ssx-accent);border-radius:6px;display:flex;align-items:center;justify-content:center}\n#topbar .logo-icon svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}\n.topbar-sep{width:1px;height:22px;background:var(--ssx-border-strong);margin:0 2px}\n#topbar-job{font-size:12px;color:var(--ssx-label);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n#topbar-job span{color:var(--ssx-text);font-weight:600}\n\n/* ── Step nav — pill style ── */\n#steps{display:flex;align-items:center;gap:4px;background:var(--ssx-bg);padding:0;flex-shrink:0;overflow:visible}\n.step-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border:none;background:transparent;cursor:pointer;font-family:var(--ssx-font);font-size:15px;font-weight:700;color:var(--ssx-faint);border-radius:20px;transition:all .15s;white-space:nowrap}\n.step-btn:hover{color:var(--ssx-label);background:var(--ssx-hover)}\n.step-btn.active{color:var(--ssx-accent);background:var(--ssx-accent-bg)}\n.step-btn.done{color:var(--ssx-ok)}\n.step-sep{display:none}\n.step-btn .step-num{width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,0.07);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transition:all .15s;flex-shrink:0}\n.step-btn.active .step-num{background:var(--ssx-accent);color:#fff}\n.step-btn.done .step-num{background:var(--ssx-ok);color:#fff}\n.step-sep{color:var(--ssx-border-strong);font-size:14px;padding:0 2px}\n\n/* ── Main panels ── */\n#main{flex:1;overflow:hidden;display:flex;position:relative}\n.panel{position:absolute;inset:0;overflow-y:auto;padding:20px;display:none;flex-direction:column;gap:16px}\n.panel.active{display:flex}\n.panel-canvas{padding:0!important;gap:0!important}\n/* ── Premium transitions ── */\n:root{--ductr-ease:cubic-bezier(.22,.61,.36,1);--ductr-ease-out:cubic-bezier(.16,.84,.44,1);--ductr-flow:cubic-bezier(.4,.01,.16,1)}\n@keyframes ductrFadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}\n@keyframes ductrPop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}\n/* Liquid panel crossfade — incoming + outgoing animate simultaneously */\n@keyframes ductrInFwd{from{opacity:0;transform:translate3d(40px,0,0) scale(.985)}to{opacity:1;transform:none}}\n@keyframes ductrInBack{from{opacity:0;transform:translate3d(-40px,0,0) scale(.985)}to{opacity:1;transform:none}}\n@keyframes ductrOutFwd{from{opacity:1;transform:none}to{opacity:0;transform:translate3d(-28px,0,0) scale(.992)}}\n@keyframes ductrOutBack{from{opacity:1;transform:none}to{opacity:0;transform:translate3d(28px,0,0) scale(.992)}}\n@keyframes ductrCanvasIn{from{opacity:0;transform:scale(.992)}to{opacity:1;transform:none}}\n@keyframes ductrCanvasOut{from{opacity:1}to{opacity:0}}\n/* Directional step transitions — #main carries data-dir set in goStep */\n.panel.active{z-index:2}\n.panel.leaving{display:flex;z-index:1;pointer-events:none}\n.panel.active:not(.panel-canvas){animation:ductrInFwd .52s var(--ductr-flow) both}\n.panel.leaving:not(.panel-canvas){animation:ductrOutFwd .52s var(--ductr-flow) both}\n#main[data-dir=\"back\"] .panel.active:not(.panel-canvas){animation:ductrInBack .52s var(--ductr-flow) both}\n#main[data-dir=\"back\"] .panel.leaving:not(.panel-canvas){animation:ductrOutBack .52s var(--ductr-flow) both}\n.panel-canvas.active{animation:ductrCanvasIn .46s var(--ductr-flow) both}\n.panel-canvas.leaving{animation:ductrCanvasOut .4s var(--ductr-flow) both}\n.anim-in{animation:ductrFadeUp .4s var(--ductr-ease)}\n/* New-design card expand — cross-fade the two states (no display snap) */\n.dh-new{transition:box-shadow .3s var(--ductr-ease),transform .3s var(--ductr-ease)}\n.dh-new.expanded .dh-opt{opacity:0;animation:ductrPop .46s var(--ductr-ease) forwards}\n.dh-new.expanded .dh-opt:nth-child(2){animation-delay:.08s}\n.dh-new.expanded .dh-opt:nth-child(3){animation-delay:.16s}\n/* Plans cards & tiles stagger */\n.floor-file-card{animation:ductrFadeUp .4s var(--ductr-ease) both}\n.page-tile{animation:ductrPop .4s var(--ductr-ease) both}\n/* Recent / load rows */\n.dh-rcard,.dh-lrow{animation:ductrFadeUp .36s var(--ductr-ease) both}\n@media (prefers-reduced-motion:reduce){\n  .panel.active,.panel.leaving,.panel-canvas.active,.panel-canvas.leaving,.anim-in,.dh-new.expanded .dh-opt,.floor-file-card,.page-tile,.dh-rcard,.dh-lrow{animation:none!important}\n  .panel.leaving{display:none!important}\n  .dh-new-collapsed,.dh-new-expanded{transition:none!important}\n}\n\n/* ── Cards ── */\n.card{background:var(--ssx-card);border:1px solid var(--ssx-border);border-radius:var(--ssx-radius);padding:18px}\n.card-title{font-family:var(--ssx-head);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ssx-label);margin-bottom:14px}\n.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}\n\n/* ── Forms ── */\n.form-grid{display:grid;gap:12px}\n.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.field label{display:block;font-size:11px;font-weight:600;color:var(--ssx-label);ma ound:rgba(28,38,70,.12)}\n/* stepper pills */\n.step-btn{border-radius:999px;padding:8px 15px;font-size:12.5px}\n.step-btn.active{background:var(--ssx-card);color:var(--ssx-accent);box-shadow:var(--ductr-sh-sm)}\n.step-btn .step-num{background:rgba(28,38,70,.08)}\n/* cards */\n.card{border-radius:20px;border-color:var(--ssx-border);box-shadow:var(--ductr-sh-sm)}\n.btn{border-radius:11px}\n/* ── left tool dock — DUCTR floating dock ── */\n#canvas-vtoolbar{\n  background:var(--ssx-card);border:1px solid var(--ssx-border);border-radius:18px;\n  box-shadow:var(--ductr-sh);padding:8px 6px;margin:12px 0 12px 12px;\n  align-self:center;\n}\n.vt-btn{border-radius:11px;color:var(--ssx-label)}\n.vt-btn:hover{background:var(--ssx-card2);color:var(--ssx-text)}\n.vt-btn.active{background:var(--ssx-accent);color:#fff;box-shadow:0 3px 10px rgba(14,159,110,.35)}\n.vt-sep{background:var(--ssx-border);margin:5px 6px}\n#canvas-topbar #tool-calib.active,#canvas-topbar #tool-north.active,#canvas-topbar #legend-topbtn.on{background:var(--ssx-accent) !important;border-color:var(--ssx-accent) !important;color:#fff !important}\n/* canvas top bar */\n#canvas-topbar{background:transparent;border-bottom:none;padding:10px 12px 6px}\n#floor-tabs{background:transparent;border-bottom:none}\n.floor-tab{border:none;border-radius:999px;padding:7px 13px}\n.floor-tab.active{background:var(--ssx-card);color:var(--ssx-accent);border-bottom-color:transparent;box-shadow:var(--ductr-sh-sm)}\n/* canvas */\n#canvas-center{padding:0 12px 12px}\n#canvas-wrap{border-radius:20px;border:1px solid var(--ssx-border-strong);box-shadow:0 2px 8px rgba(20,28,60,.06), 0 18px 40px -22px rgba(20,28,60,.32);background:#FFFFFF}\n/* right rail */\n#canvas-rightpanel{\n  background:var(--ssx-card);border:1px solid var(--ssx-border);border-left:1px solid var(--ssx-border);\n  border-radius:20px;box-shadow:var(--ductr-sh);margin:12px 12px 12px 0;\n}\n.rp-tabs{border-bottom:1px solid var(--ssx-border)}\n.rp-tab{font-family:var(-- =\"toggleLayer('pipes',document.getElementById('lt-pipes'))\"><span>Pipework<\u002Fspan><span class=\"lswitch on\" id=\"lt-pipes\"><\u002Fspan><\u002Fbutton>\n              <button class=\"layer-row\" onclick=\"toggleLayer('labels',document.getElementById('lt-labels'))\"><span>Labels<\u002Fspan><span class=\"lswitch on\" id=\"lt-labels\"><\u002Fspan><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:1px;height:18px;background:var(--ssx-border-strong)\"><\u002Fdiv>\n          <button id=\"tool-calib\" onclick=\"setTool('calib')\" title=\"Calibrate scale (C)\" style=\"display:flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--ssx-border-strong);border-radius:6px;background:var(--ssx-card);cursor:pointer;font-size:11px;font-weight:600;color:var(--ssx-label);font-family:var(--ssx-font);white-space:nowrap;flex-shrink:0\">\n            <svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M2 8h12M8 2v12\"><\u002Fpath><\u002Fsvg>\n            Calibrate scale\n          <\u002Fbutton>\n          <div id=\"canvas-validation\" class=\"pill pill-blue\" style=\"font-size:10px;display:flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0\">Scale: not set<\u002Fdiv>\n          <button id=\"tool-north\" onclick=\"setTool('north')\" title=\"Set north direction\" style=\"display:flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--ssx-border-strong);border-radius:6px;background:var(--ssx-card);cursor:pointer;font-size:11px;font-weight:600;color:var(--ssx-label);font-family:var(--ssx-font);white-space:nowrap;flex-shrink:0\">\n            <svg width=\"13\" height=\"13\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"8\" cy=\"8\" r=\"6\"><\u002Fcircle><path d=\"M8 3v10\"><\u002Fpath><path d=\"M8 3L5.5 5.5M e=\"display:flex;align-items:center;gap:10px\"><div style=\"width:32px;height:6px;background:#65a30d;border-radius:2px;flex-shrink:0\"><\u002Fdiv><span style=\"font-family:var(--ssx-mono);font-size:12px;color:var(--ssx-text)\">1/2\" / 3/4\"<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\"><div style=\"width:32px;height:8px;background:#c026d3;border-radius:2px;flex-shrink:0\"><\u002Fdiv><span style=\"font-family:var(--ssx-mono);font-size:12px;color:var(--ssx-text)\">5/8\" / 7/8\"<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Symbols -->\n        <div>\n          <div style=\"font-family:var(--ssx-head);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ssx-faint);margin-bottom:10px\">Symbols<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;align-items:center;gap:10px\"><div style=\"width:28px;height:15px;border:2px solid #f59e0b;border-radius:3px;background:#f59e0b15;flex-shrink:0\"><\u002Fdiv><span style=\"font-size:12px;color:var(--ssx-text)\">Room boundary<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\"><div style=\"width:28px;border-top:2px dashed #6366f1;flex-shrink:0\"><\u002Fdiv><span style=\"font-size:12px;color:var(--ssx-text)\">Riser<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\"><div style=\"width:28px;height:15px;border:2px dashed #374151;border-radius:3px;flex-shrink:0\"><\u002Fdiv><span style=\"font-size:12px;color:var(--ssx-text)\">BC Controller<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\"><div style=\"width:15px;height:15px;border-radius:50%;background:#9333ea33;border:2px solid #9333ea;flex-shrink:0\"><\u002Fdiv><span style=\"font-size:12px;color:var(--ssx-text)\">T-junction<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Hover info cards — appended to body to escape canvas stacking context -->\n<div id=\"unit-controls\" onmousedown=\"event.stopPropagation()\" style=\"position:fixed;display:none;gap:4px;z-index:9998;pointer-events:auto;padding:4px;background:var(--ssx-card);border:1px solid var(--ssx-border-strong);border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.15)\">\n  <button onclick=\"rotateSelected(-90)\" title=\"Rotate CCW (Shift+R)\" style=\"width:30px;height:30px;border-radius:6px;border:1px solid var(--ssx-border-strong);background:var(--ssx-card);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--ssx-shadow-sm);color:var(--ssx-text);font-size:15px\">↺<\u002Fbutton>\n  <button onclick=\"rotateSelected(90)\" title=\"Rotate CW (R)\" style=\"width:30px;height:30px;border-radius:6px;border:1px solid var(--ssx-border-strong);background:var(--ssx-card);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--ssx-shadow-sm);color:var(--ssx-text);font-size:15px\">↻<\u002Fbutton>\n  <button onclick=\"deleteSelected()\" title=\"Delete unit\" style=\"width:30px;height:30px;border-radius:6px;border:1px solid #fecaca;background:#fee2e2;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--ssx-shadow-sm);color:var(--ssx-danger);font-size:14px\">✕<\u002Fbutton>\n<\u002Fdiv>\n<div id=\"room-hover-card\">\n  <div class=\"rhc-name\" id=\"rhc-name\">Room<\u002Fdiv>\n  <div class=\"rhc-row\"><span class=\"rhc-label\">Area<\u002Fspan><span class=\"rhc-value\" id=\"rhc-area\">—<\u002Fspan><\u002Fdiv>\n  <div class=\"rhc-row\"><span class=\"rhc-label\">Heat load<\u002Fspan><span class=\"rhc-value\" id=\"rhc-kw\">—<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div id=\"unit-hover-card\">\n  <div class=\"rhc-name\" id=\"uhc-name\">Unit<\u002Fdiv>\n  <div class=\"rhc-row\"><span class=\"rhc-label\">Type<\u002Fspan><span class=\"rhc-value\" id=\"uhc-type\">—<\u002Fspan><\u002Fdiv>\n  <div class=\"rhc-row\"><span class=\"rhc-label\">Capacity<\u002Fspan><span class=\"rhc-value\" id=\"uhc-kw\">—<\u002Fspan><\u002Fdiv>\n  <div class=\"rhc-row\"><span class=\"rhc-label\">W × D × H<\u002Fspan><span class=\"rhc-value\" id=\"uhc-dims\">—<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div id=\"comp-hover-card\">\n  <div class=\"rhc-name\" id=\"chc-name\">Component<\u002Fdiv>\n  <div class=\"rhc-row\"><span class=\"rhc-label\">Type<\u002Fspan><span class=\"rhc-value\" id=\"chc-type\">—<\u002Fspan><\u002Fdiv>\n  <div class=\"rhc-row\"><span class=\"rhc-label\" id=\"chc-label2\">Detail<\u002Fspan><span class=\"rhc-value\" id=\"chc-detail\">—<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"panel\" id=\"panel-3\">\n  <div style=\"max-width:900px;margin:0 auto;width:100%;padding-bottom:40px\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:20px\">\n      <div>\n        <div style=\"font-family:var(--ssx-head);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.04em\">Equipment schedule<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--ssx-label);margin-top:2px\" id=\"materials-subtitle\">Loading…<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px\">\n        <label style=\"font-size:12px;color:var(--ssx-label);display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--ssx-card);border:1px solid var(--ssx-border);border-radius:8px\">\n          Floor-to-floor:\n          <input type=\"number\" id=\"floor-height\" value=\"3.0\" min=\"1\" max=\"10\" step=\"0.1\" style=\"width:48px;padding:2px 6px;border:1px solid var(--ssx-border-strong);border-radius:4px;font-family:var(--ssx-mono);font-size:12px;background:var(--ssx-input-bg);color:var(--ssx-text);text-align:right\" onchange=\"renderMaterials()\"> m\n        <\u002Flabel>\n        <button class=\"btn btn-secondary btn-sm\" onclick=\"goStep(2)\">← Design<\u002Fbutton>\n        <button class=\"btn btn-primary btn-sm\" onclick=\"goStep(4)\">Job details →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"materials-content\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══ PANEL 4: JOB DETAILS ═══ -->\n<div class=\"panel\" id=\"panel-4\">\n  <div class=\"card\" style=\"max-width:680px;margin:0 auto;width:100%\">\n    <div class=\"card-title\">Job details<\u002Fdiv>\n    <div class=\"form-grid\">\n      <div class=\"form-row\">\n        <div class=\"field\"><label>Job number<\u002Flabel><input type=\"text\" id=\"jd-jobnum\" placeholder=\"Auto-assigned\" oninput=\"updateTopbar()\"><\u002Fdiv>\n        <div class=\"field\"><label>Date<\u002Flabel><input type=\"date\" id=\"jd-date\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field\"><label>Client name<\u002Flabel><input type=\"text\" id=\"jd-client\" placeholder=\"Client or company name\" oninput=\"updateTopbar()\"><\u002Fdiv>\n      <div class=\"field\"><label>Site address<\u002Flabel><input type=\"text\" id=\"jd-address\" placeholder=\"Full site address\" oninput=\"updateTopbar()\"><\u002Fdiv>\n      <div class=\"form-row\">\n        <div class=\"field\"><label>Designed by<\u002Flabel><input type=\"text\" id=\"jd-designer\" placeholder=\"Your name\"><\u002Fdiv>\n        <div class=\"field\"><label>Company<\u002Flabel><input type=\"text\" id=\"jd-company\" placeholder=\"Your company\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field\"><label>Notes<\u002Flabel><textarea id=\"jd-notes\" placeholder=\"Additional notes…\"><\u002Ftextarea><\u002Fdiv>\n      <div class=\"form-row\">\n        <div class=\"field\"><label>Power availability<\u002Flabel>\n          <select id=\"jd-power\">\n            <option>Three phase available<\u002Foption>\n            <option>Single phase only<\u002Foption>\n            <option>Unknown<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <div class=\"field\"><label>ServiceMate job #<\u002Flabel><input type=\"text\" id=\"jd-servicemate\" placeholder=\"Optional\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:18px;display:flex;gap:8px;justify-content:flex-end\">\n      <button class=\"btn btn-secondary\" onclick=\"goStep(3)\">← Back<\u002Fbutton>\n      <button class=\"btn btn-secondary\" onclick=\"saveDesign()\">💾 Save design<\u002Fbutton>\n      <button class=\"btn btn-primary\" onclick=\"saveAndExport()\">Save &amp; export PDF<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv><!-- /main -->\n<!-- Settings Modal -->\n<div class=\"modal-overlay\" id=\"settings-modal\">\n  <div class=\"modal\" style=\"width:520px;max-height:90vh;overflow-y:auto\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px\">\n      <div>\n        <h3 style=\"margin-bottom:3px\">Calculator settings<\u002Fh3>\n        <p style=\"margin:0;font-size:12px;color:var(--ssx-label)\">These defaults apply to all new rooms. Existing rooms are unaffected unless you recalculate.<\u002Fp>\n      <\u002Fdiv>\n      <button onclick=\"closeSettings()\" style=\"background:none;border:none;font-size:20px;cursor:pointer;color:var(--ssx-faint);padding:0 4px\">✕<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- Climate zone -->\n    <div style=\"margin-bottom:18px\">\n      <div style=\"font-family:var(--ssx-head);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ssx-label);margin-bottom:8px\">NCC Climate zone<\u002Fdiv>\n      <select id=\"settings-climate\" onchange=\"settingsUpdateClimate(this.value)\" style=\"width:100%;padding:8px 10px;border:1px solid var(--ssx-border-strong);border-radius:var(--ssx-radius-sm);font-family:var(--ssx-font);font-size:13px;background:var(--ssx-input-bg);color:var(--ssx-text);margin-bottom:8px\">\n        <option value=\"1\">Zone 1 — High humidity summer, warm winter (Darwin, Broome, Cairns)<\u002Foption>\n        <option value=\"2\">Zone 2 — Warm humid summer, mild winter (Brisbane, Townsville, Gold Coast)<\u002Foption>\n        <option value=\"3\">Zone 3 — Hot dry summer, warm winter (Alice Springs, Tennant Creek)<\u002Foption>\n        <option value=\"4\">Zone 4 — Hot dry summer, cool winter (Broken Hill, Dubbo, Mildura)<\u002Foption>\n        <option value=\"5\" selected=\"\">Zone 5 — Warm temperate (Sydney, Perth, Adelaide, Newcastle)<\u002Foption>\n        <option value=\"6\">Zone 6 — Mild temperate (Melbourne, Geelong, Wollongong)<\u002Foption>\n        <option value=\"7\">Zone 7 — Cool temperate (Hobart, Canberra, Orange, Ballarat)<\u002Foption>\n        <option value=\"8\">Zone 8 — Alpine (Mt Hotham, Thredbo, Falls Creek)<\u002Foption>\n      <\u002Fselect>\n      <div id=\"settings-zone-desc\" style=\"font-size:11px;color:var(--ssx-label);padding:8px 10px;background:var(--ssx-card2);border-radius:var(--ssx-radius-sm);border:1px solid var(--ssx-border)\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Building type -->\n    <div style=\"margin-bottom:18px\">\n      <div style=\"font-family:var(--ssx-head);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ssx-label);margin-bottom:8px\">Building type<\u002Fdiv>\n      <div style=\"display:flex;gap:8px\">\n        <label style=\"flex:1;display:flex;align-items:center;gap:8px;padding:9px 12px;border:1.5px solid var(--ssx-border);border-radius:var(--ssx-radius-sm);cursor:pointer;transition:all .15s\" id=\"btype-residential\">\n          <input type=\"radio\" name=\"settings-btype\" value=\"residential\" checked=\"\" onchange=\"settingsUpdateBtype(this.value)\" style=\"accent-color:var(--ssx-accent)\">\n          <div><div style=\"font-weight:700;font-size:12px\">Residential<\u002Fdiv><div style=\"font-size:10px;color:var(--ssx-faint)\">Homes, apartments<\u002Fdiv><\u002Fdiv>\n        <\u002Flabel>\n        <label style=\"flex:1;display:flex;align-items:center;gap:8px;padding:9px 12px;border:1.5px solid var(--ssx-border);border-radius:var(--ssx-radius-sm);cursor:pointer;transition:all .15s\" id=\"btype-light\">\n          <input type=\"radio\" name=\"settings-btype\" value=\"light_commercial\" onchange=\"settingsUpdateBtype(this.value)\" style=\"accent-color:var(--ssx-accent)\">\n          <div><div style=\"font-weight:700;font-size:12px\">Light commercial<\u002Fdiv><div style=\"font-size:10px;color:var(--ssx-faint)\">Offices, retail<\u002Fdiv><\u002Fdiv>\n        <\u002Flabel>\n        <label style=\"flex:1;display:flex;align-items:center;gap:8px;padding:9px 12px;border:1.5px solid var(--ssx-border);border-radius:var(--ssx-radius-sm);cursor:pointer;transition:all .15s\" id=\"btype-commercial\">\n          <input type=\"radio\" name=\"settings-btype\" value=\"commercial\" onchange=\"settingsUpdateBtype(this.value)\" style=\"accent-color:var(--ssx-accent)\">\n          <div><div style=\"font-weight:700;font-size:12px\">Commercial<\u002Fdiv><div style=\"font-size:10px;color:var(--ssx-faint)\">High occupancy<\u002Fdiv><\u002Fdiv>\n        <\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Resulting base W/m² -->\n    <div style=\"margin-bottom:18px;padding:14px;background:var(--ssx-accent-bg);border:1px solid var(--ssx-border);border-radius:var(--ssx-radius-sm)\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:4px\">\n        <span style=\"font-size:12px;font-weight:600;color:var(--ssx-label)\">Recommended base load<\u002Fspan>\n        <span id=\"settings-wm2-display\" style=\"font-family:var(--ssx-mono);font-size:20px;font-weight:800;color:var(--ssx-accent)\">145 W/m²<\u002Fspan>\n      <\u002Fdiv>\n      <div id=\"settings-wm2-note\" style=\"font-size:11px;color:var(--ssx-label)\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Manual override -->\n    <div style=\"margin-bottom:18px\">\n      <div style=\"font-family:var(--ssx-head);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ssx-label);margin-bottom:8px\">Override base W/m²<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <input type=\"number\" id=\"settings-wm2-override\" min=\"50\" max=\"400\" step=\"5\" placeholder=\"e.g. 145\" style=\"flex:1;padding:8px 10px;border:1px solid var(--ssx-border-strong);border-radius:var(--ssx-radius-sm);font-family:var(--ssx-mono);font-size:14px;background:var(--ssx-input-bg);color:var(--ssx-text)\" oninput=\"settingsOverrideWm2(this.value)\">\n        <span style=\"font-size:12px;color:var(--ssx-label)\">W/m²<\u002Fspan>\n        <button class=\"btn btn-sm btn-secondary\" onclick=\"settingsClearOverride()\">Use recommended<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--ssx-faint);margin-top:5px\">Leave blank to use the recommended figure for your zone and building type.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Default conditions -->\n    <div style=\"margin-bottom:18px\">\n      <div style=\"font-family:var(--ssx-head);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ssx-label);margin-bottom:8px\">Default room conditions<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px\">\n        <div class=\"field\">\n          <label>Default glazing<\u002Flabel>\n          <select id=\"settings-glass\" onchange=\"state.settings.defaultGlass=this.value\" style=\"width:100%;padding:7px 9px;border:1px solid var(--ssx-border-strong);border-radius:var(--ssx-radius-sm);font-family:var(--ssx-font);font-size:12px;background:var(--ssx-input-bg);color:var(--ssx-text)\">\n            <option value=\"low\">Low (double glazed)<\u002Foption>\n            <option value=\"moderate\" selected=\"\">Moderate (average)<\u002Foption>\n            <option value=\"high\">High (large/single)<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Default condition<\u002Flabel>\n          <select id=\"settings-condition\" onchange=\"state.settings.defaultCondition=this.value\" style=\"width:100%;padding:7px 9px;border:1px solid var(--ssx-border-strong);border-radius:var(--ssx-radius-sm);font-family:var(--ssx-font);font-size:12px;background:var(--ssx-input-bg);color:var(--ssx-text)\">\n            <option value=\"standard\" selected=\"\">Standard<\u002Foption>\n            <option value=\"well_insulated\">Well insulated<\u002Foption>\n            <option value=\"poor\">Poor insulation<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Default height (m)<\u002Flabel>\n          <input type=\"number\" id=\"settings-height\" value=\"2.4\" min=\"2\" max=\"6\" step=\"0.1\" onchange=\"state.settings.defaultHeight=parseFloat(this.value)||2.4\" style=\"width:100%;padding:7px 9px;border:1px solid var(--ssx-border-strong);border-radius:var(--ssx-radius-sm);font-family:var(--ssx-mono);font-size:12px;background:var(--ssx-input-bg);color:var(--ssx-text)\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- AIRAH note -->\n    <div style=\"padding:10px 12px;background:var(--ssx-card2);border-radius:var(--ssx-radius-sm);border:1px solid var(--ssx-border);font-size:11px;color:var(--ssx-label);line-height:1.55\">\n      <strong style=\"color:var(--ssx-text)\">Note:<\u002Fstrong> These are rules-of-thumb for early-stage sizing only. AIRAH recommends a full Manual J or software-based heat load calculation for formal design documentation. W/m² values are based on Australian industry practice and NCC climate zone data.\n    <\u002Fdiv>\n\n    <div style=\"display:flex;justify-content:flex-end;margin-top:16px\">\n      <button class=\"btn btn-primary\" onclick=\"closeSettings()\">Done<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv><!-- /app -->\n\n<!-- Calibration modal -->\n<div class=\"modal-overlay\" id=\"calib-modal\">\n  <div class=\"modal\">\n    <h3>Calibrate scale<\u002Fh3>\n    <p>Draw a line over a known dimension, then enter the real-world length.<\u002Fp>\n    <div class=\"field\" style=\"margin-bottom:8px\">\n      <label>Real-world length (metres)<\u002Flabel>\n      <input type=\"number\" id=\"calib-input\" placeholder=\"e.g. 5.0\" step=\"0.1\" min=\"0.1\">\n    <\u002Fdiv>\n    <div class=\"calib-preview\" id=\"calib-preview\">Draw a line on the plan first…<\u002Fdiv>\n    <div class=\"modal-btns\">\n      <button class=\"btn btn-secondary\" onclick=\"cancelCalib()\">Cancel<\u002Fbutton>\n      <button class=\"btn btn-primary\" onclick=\"confirmCalib()\">Set scale<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Name & allocate modal -->\n<div class=\"modal-overlay\" id=\"allocate-modal\" onclick=\"if(event.target===this)closeAllocate()\">\n  <div class=\"pp-modal\">\n    <div class=\"pp-head\">\n      <div>\n        <div class=\"pp-title\">Name &amp; allocate pages<\u002Fdiv>\n        <div class=\"pp-sub\" id=\"alloc-sub\">Give each page a name and allocate it to a floor level.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pp-tools\">\n        <button class=\"pp-close\" onclick=\"closeAllocate()\" title=\"Close\">✕<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"pp-body\"><div id=\"alloc-list\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"pp-foot\">\n      <span class=\"pp-hint\" id=\"alloc-hint\"><\u002Fspan>\n      <button class=\"btn btn-primary\" onclick=\"closeAllocate()\">Done<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Page picker modal -->\n<div class=\"modal-overlay\" id=\"page-picker-modal\" onclick=\"if(event.target===this)cancelPagePicker()\">\n  <div class=\"pp-modal\">\n    <div class=\"pp-head\">\n      <div>\n        <div class=\"pp-title\">Select pages<\u002Fdiv>\n        <div class=\"pp-sub\">Pick the floor-plan pages to import. Hover a page to preview it full size.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pp-tools\">\n        <button class=\"btn btn-sm btn-secondary\" onclick=\"selectAllPages(false)\">None<\u002Fbutton>\n        <button class=\"btn btn-sm btn-secondary\" onclick=\"selectAllPages(true)\">All<\u002Fbutton>\n        <button class=\"btn btn-sm btn-primary\" id=\"ai-analyse-btn\" onclick=\"analyseWithAI()\">✦ AI detect<\u002Fbutton>\n        <span id=\"page-count-badge\" class=\"pill pill-blue\" style=\"white-space:nowrap;flex-shrink:0\">0 selected<\u002Fspan>\n        <button class=\"pp-close\" onclick=\"cancelPagePicker()\" title=\"Close\">✕<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"ai-status-bar\">\n      <div id=\"ai-status-spinner\"><\u002Fdiv>\n      <span id=\"ai-status-text\"><\u002Fspan>\n      <span id=\"ai-status-count\" style=\"margin-left:auto;font-family:var(--ssx-mono);font-size:11px;color:var(--ssx-faint)\"><\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"pp-body\"><div class=\"page-grid\" id=\"page-grid\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"pp-foot\">\n      <span class=\"pp-hint\" id=\"pp-hint\">No pages selected<\u002Fspan>\n      <div style=\"display:flex;gap:8px\">\n        <button class=\"btn btn-secondary\" onclick=\"cancelPagePicker()\">Cancel<\u002Fbutton>\n        <button class=\"btn btn-primary\" id=\"pp-import\" onclick=\"confirmPagePicker()\" disabled=\"disabled\">Import pages →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PDF Lightbox -->\n<div id=\"pdf-lightbox\" onclick=\"if(event.target===this)closeLightbox()\">\n  <div class=\"lightbox-bar\">\n    <button id=\"lb-prev\" onclick=\"lightboxNav(-1)\">‹<\u002Fbutton>\n    <div id=\"lb-info\">Page 1 of 1<\u002Fdiv>\n    <button id=\"lb-next\" onclick=\"lightboxNav(1)\">›<\u002Fbutton>\n  <\u002Fdiv>\n  <canvas id=\"lb-canvas\"><\u002Fcanvas>\n  <div class=\"lightbox-bar\">\n    <button id=\"lb-close\" onclick=\"closeLightbox()\">✕ Close<\u002Fbutton>\n    <button id=\"lb-select\" onclick=\"lightboxToggleSelect()\">+ Select<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"notif\"><\u002Fdiv>\n\n<script>\n\n// ═══════════════════════════════════════════════\n// STATE\n// ═══════════════════════════════════════════════\nconst state = {\n  step: 1,\n  floors: [], activeFloor: 0,\n  systems: [{id:1, name:'System 1', color:'#4f46e5', rooms:[], odu:null, phase:3}],\n  activeSys: 0,\n  globalPhase: 3,\n  rooms: [], placedUnits: [], pipes: [], risers: [],\n  calibStart: null, calibEnd: null,\n  selectedUnit: null, tool: 'select',\n  pipeStart: null, pipePath: [],\n  nextRoomId:1, nextUnitId:1, nextPipeId:1, nextRiserId:1,\n  canvasOffset:{x:0,y:0}, canvasDrag:null, unitDrag:null,\n  mode:null, noPlansCanvasMode:'blank', _spaceDown:false,\n  vp:{x:0,y:0,zoom:1}, crop:null,\n  currentJobnum:'',\n  junctions:[],\n  bcBoxes:[],\n  _undoStack:[],\n  northArrow: null,   // {x, y, bearing} — bearing = degrees CW from plan-up to true north\n  settings:{\n    climateZone: 5,\n    buildingType: 'residential',\n    baseWm2Override: null,\n    defaultGlass: 'moderate',\n    defaultCondition: 'standard',\n    defaultHeight: 2.4,\n    pipeUnit: 'mm',   // 'mm' or 'in'\n  },\n};\n\n// ── Per-floor scale ─────────────────────────────────────────────────────────\n// Each page/floor is calibrated separately for accuracy. state.scale\n// transparently proxies to the active floor so all existing drawing,\n// measuring and materials logic keeps working unchanged.\nObject.defineProperty(state, 'scale', {\n  get(){ const f = state.floors[state.activeFloor]; return f ? (f.scale ?? null) : (state._noFloorScale ?? null); },\n  set(v){ const f = state.floors[state.activeFloor]; if(f) f.scale = v; else state._noFloorScale = v; }\n});\n\n// ── Layer visibility (new) ────────────────────────────────────────────\nconst LAYERS = { plan:true, units:true, pipes:true, labels:true };\nfunction toggleLayer(k, btn){\n  LAYERS[k] = !LAYERS[k];\n  if(btn) btn.classList.toggle('on', LAYERS[k]);\n  updateLayersCount();\n  drawCanvas();\n}\nfunction updateLayersCount(){\n  const n=Object.values(LAYERS).filter(Boolean).length;\n  const el=document.getElementById('layers-count');\n  if(el) el.textContent=n;\n}\nfunction toggleLayersMenu(e){\n  if(e){ e.stopPropagation(); }\n  const m=document.getElementById('layers-menu');\n  if(!m) return;\n  m.classList.toggle('open');\n}\n// Close the layers dropdown on any outside click\ndocument.addEventListener('click',(e)=>{\n  const m=document.getElementById('layers-menu');\n  if(m && m.classList.contains('open') && !m.contains(e.target)) m.classList.remove('open');\n});\n\n// ── Undo system ───────────────────────────────────────────────────────\nconst MAX_UNDO = 30;\n\nfunction pushUndo(){\n  // Snapshot the drawable state before a destructive action\n  const snap = {\n    polygons:     JSON.parse(JSON.stringify(state.polygons)),\n    rooms:        JSON.parse(JSON.stringify(state.rooms)),\n    placedUnits:  JSON.parse(JSON.stringify(state.placedUnits)),\n    pipes:        JSON.parse(JSON.stringify(state.pipes)),\n    junctions:    JSON.parse(JSON.stringify(state.junctions)),\n    bcBoxes:      JSON.parse(JSON.stringify(state.bcBoxes)),\n    risers:       JSON.parse(JSON.stringify(state.risers)),\n    scale:        state.scale,\n    northArrow:   state.northArrow ? {...state.northArrow} : null,\n    nextRoomId:   state.nextRoomId,\n    nextUnitId:   state.nextUnitId,\n    nextPipeId:   state.nextPipeId,\n    nextRiserId:  state.nextRiserId,\n  };\n  state._undoStack.push(snap);\n  if(state._undoStack.length > MAX_UNDO) state._undoStack.shift();\n}\n\nfunction undo(){\n  if(!state._undoStack.length){ notify('Nothing to undo',''); return; }\n  const snap = state._undoStack.pop();\n  state.polygons    = snap.polygons;\n  state.rooms       = snap.rooms;\n  state.placedUnits = snap.placedUnits;\n  state.pipes       = snap.pipes;\n  state.junctions   = snap.junctions;\n  state.bcBoxes     = snap.bcBoxes;\n  state.risers      = snap.risers;\n  state.scale       = snap.scale;\n  st UMY-SP', hp:6.0, kw:15.5, heat:16.5, minKw:7.8,  maxKw:20.2, phase:3, w:1050, d:330, liq:9.52, gas:15.88 },\n  // ─ PUMY-P · S-series twin-fan (8 HP, 3-phase) ─\n  { model:'PUMY-P200YKMD2-A',  series:'PUMY-P',  hp:8.0,  kw:22.4, heat:25.0, minKw:11.2, maxKw:29.1, phase:3, w:1050, d:330, liq:9.52, gas:19.05 },\n  // ─ PUMY-P · S-series twin-fan (10–12 HP, 3-phase) ─\n  { model:'PUMY-P250YBMD-A',   series:'PUMY-P',  hp:10.0, kw:28.0, heat:31.5, minKw:14.0, maxKw:36.4, phase:3, w:1050, d:460, liq:9.52, gas:22.2 },\n  { model:'PUMY-P300YBMD-A',   series:'PUMY-P',  hp:12.0, kw:33.5, heat:37.5, minKw:16.8, maxKw:43.6, phase:3, w:1050, d:460, liq:9.52, gas:22.2 },\n  // ─ PUHY-P · Y-series large capacity (3-phase) ─\n  { model:'PUHY-P200YNW-A1',   series:'PUHY-P',  hp:8.0,  kw:22.4, heat:25.0, minKw:11.2, maxKw:29.1, phase:3, w:920,  d:740, liq:9.52, gas:22.2 },\n  { model:'PUHY-P250YNW-A1',   series:'PUHY-P',  hp:10.0, kw:28.0, heat:31.5, minKw:14.0, maxKw:36.4, phase:3, w:920,  d:740, liq:9.52, gas:22.2 },\n  { model:'PUHY-P300YNW-A1',   series:'PUHY-P',  hp:12.0, kw:33.5, heat:37.5, minKw:16.8, maxKw:43.6, phase:3, w:920,  d:740, liq:9.52, gas:22.2 },\n  { model:'PUHY-P350YNW-A1',   series:'PUHY-P',  hp:14.0, kw:40.0, heat:45.0, minKw:20.0, maxKw:52.0, phase:3, w:1240, d:740, liq:12.7, gas:28.58 },\n  { model:'PUHY-P400YNW-A1',   series:'PUHY-P',  hp:16.0, kw:45.0, heat:50.0, minKw:22.4, maxKw:58.5, phase:3, w:1240, d:740, liq:12.7, gas:28.58 },\n  { model:'PUHY-P450YNW-A1',   series:'PUHY-P',  hp:18.0, kw:50.0, heat:56.0, minKw:25.0, maxKw:65.0, phase:3, w:1240, d:740, liq:12.7, gas:28.58 },\n  { model:'PUHY-P500YNW-A1',   series:'PUHY-P',  hp:20.0, kw:56.0, heat:63.0, minKw:28.0, maxKw:72.8, phase:3, w:1750, d:740, liq:12.7, gas:28.58 },\n];\n\n// ── INDOOR UNIT TYPE DEFINITIONS (UI dropdowns) ──────────────────────\nconst IDU_TYPES = [\n  // Standard ducted (shown first)\n  { value:'VMX',   label:'PEFY VMX — Compact duct (low static)',   desc:'200mm · 15 Pa · residential & tight ceilings',   advanced:false },\n  { value:'VMA',   label:'PEFY VMA — Medium static duct',          desc:'250mm · 35–150 Pa · most common ducted',          advanced:false },\n  { value:'VMHS',  label:'PEFY VMHS — High static duct',           desc:'380mm · 50–200 Pa · long duct runs',              advanced:false },\n  // Ceiling cassette — advanced\n  { value:'VEM',   label:'PLFY VEM-A — 4-way cassette (840mm)',    desc:'840×840mm · suits open plan commercial',          advanced:true  },\n  { value:'VFM',   label:'PLFY VFM-E1 — 4-way cassette (600mm)',   desc:'600×600mm grid ceiling · compact',                advanced:true  },\n  { value:'VLMD',  label:'PLFY VLMD-E — 2-way cassette',           desc:'1200×600mm slim · h290mm',                        advanced:true  },\n  { value:'VBM',   label:'PMFY VBM-E — 1-way cassette',            desc:'1200×600mm · single direction',                   advanced:true  },\n  { value:'CASS4', label:'PCA-M — 4-way ceiling cassette',         desc:'570/840mm · 10 Pa · open ceilings',               advanced:true  },\n  { value:'PLA',   label:'PLA-M — 4-way cassette (large)',         desc:'840mm · commercial open plan',                    advanced:true  },\n  { value:'PKFY',  label:'PKFY-P — Compact 4-way cassette',        desc:'570mm · compact ceiling install',                 advanced:true  },\n  { value:'CASS1', label:'SLZ-M — 1-way ceiling cassette',         desc:'Bulkhead installs · single direction',            advanced:true  },\n  // Ceiling concealed — advanced\n  { value:'VMR',   label:'PEFY VMR-E — Low noise concealed duct',  desc:'5 Pa · hotels & quiet spaces · h292mm',           advanced:true  },\n  { value:'VMS1',  label:'PEFY VMS1-E — Compact depth duct',       desc:'450mm deep · h200mm · tight ceiling void',        advanced:true  },\n  { value:'VMA3',  label:'PEFY VMA3-E — Medium static (3-speed)',   desc:'250mm · 35–150 Pa variant',                       advanced:true  },\n  { value:'VMHSF', label:'PEFY VMHS-E-F — High static + fresh air', desc:'250 Pa · fresh air intake · commercial',         advanced:true  },\n  { value:'VMHF',  label:'PEFY VMH-E-F — Medium static + fresh air',desc:'150 Pa · fresh air intake',                     advanced:true  },\n  { value:'PEAD',  label:'PEAD-M — High static ducted',            desc:'150 Pa · commercial ducted',                      advanced:true  },\n  // Ceiling suspended\n  { value:'CEIL',  label:'PLFY-P — Ceiling suspended',             desc:'25 Pa · exposed or bulkhead',                     advanced:true  },\n  { value:'PCFY',  label:'PCFY-P — Under-ceiling concealed',       desc:'Concealed under-ceiling unit',                    advanced:true  },\n  // Wall mounted\n  { value:'WALL',  label:'MSZ-AP — Wall-mounted (standard)',        desc:'Hi-wall residential · City Multi compatible',     advanced:true  },\n  { value:'WALL',  label:'MSZ-EF — Wall-mounted (designer)',        desc:'Designer hi-wall · slim profile',                 advanced:true  },\n  { value:'WALL',  label:'MSZ-LN — Wall-mounted (premium)',         desc:'Premium hi-wall · City Multi compatible',         advanced:true  },\n  { value:'SEZ',   label:'SEZ-M — Slim wall/floor',                desc:'Slim body · wall or floor install',               advanced:true  },\n  // Floor standing\n  { value:'PFKY',  label:'PFFY-P — Floor-standing',                desc:'Various outlet configurations',                   advanced:true  },\n  { value:'FLOOR', label:'PFD-P — Floor console',                  desc:'Floor-standing · glazed facades',                 advanced:true  },\n  { value:'MFZ',   label:'MFZ-KW — Floor console ducted',          desc:'Floor-standing ducted · 30 Pa',                   advanced:true  },\n];\n\n// ── KNOWLEDGE-BASE INTEGRITY GUARD ───────────────────────────────────\n// Never silently invent a model. If an unknown model is referenced,\n// warn in the console rather than fabricating data.\nfunction verifyModel(modelKey) {\n  if(modelKey && !UNIT_DATA[modelKey]) {\n    console.warn(`DUCTR: model \"${modelKey}\" is not in the approved knowledge base.`);\n    return false;\n  }\n  return true;\n}\n\n\n// Pipe sizing by cumulative kW\n// ── Pipe unit display ────────────────────────────────────────────────\nconst MM_TO_INCH = {\n  6.35:'1/4\"', 9.52:'3/8\"', 12.7:'1/2\"',\n  15.88:'5/8\"', 19.05:'3/4\"', 22.2:'7/8\"', 28.58:'1-1/8\"',\n};\n\n// All pipe sizes in order (for legend ordering)\nconst PIPE_SIZE_ORDER = [\n  { liq:6.35,  suc:12.7,  col:'#06b6d4', lw:4 },\n  { liq:9.52,  suc:15.88, col:'#dc2626', lw:5 },\n  { liq:12.7,  suc:19.05, col:'#65a30d', lw:6 },\n  { liq:15.88, suc:22.2,  col:'#c026d3', lw:8 },\n  { liq:12.7,  suc:28.58, col:'#ea580c', lw:9 },\n];\n\n// Format a single pipe diameter in current unit preference\nfunction fmtDiam(mm){\n  if(state.settings.pipeUnit === 'in'){\n    return MM_TO_INCH[mm] || mm + 'mm';\n  }\n  return mm + 'mm';\n}\n\n// Format a liq/suc pair e.g. '3/8\" / 5/8\"' or '9.52 / 15.88mm'\nfunction fmtPipePair(liq, suc){\n  return fmtDiam(liq) + ' / ' + fmtDiam(suc);\n}\n\nfunction togglePipeUnit(){\n  state.settings.pipeUnit = state.settings.pipeUnit === 'mm' ? 'in' : 'mm';\n  const isIn = state.settings.pipeUnit === 'in';\n  const mmEl = document.getElementById('pipe-unit-mm');\n  const inEl = document.getElementById('pipe-unit-in');\n  if(mmEl){ mmEl.style.background = isIn ? 'var(--ssx-card2)' : 'var(--ssx-accent)'; mmEl.style.color = isIn ? 'var(--ssx-faint)' : '#fff'; }\n  if(inEl){ inEl.style.background = isIn ? 'var(--ssx-accent)' : 'var(--ssx-card2)'; inEl.style.color = isIn ? '#fff' : 'var(--ssx-faint)'; }\n  updateLegendLabels();\n  renderComponentsList?.();\n  drawCanvas?.();\n  triggerAutoSave?.();\n}\n\nfunction updateLegendLabels(){\n  const container = document.getElementById('legend-pipe-rows');\n  if(!container) return;\n\n  // Collect pipe sizes actually used in the current design (all floors)\n  const usedKeys = new Set();\n  (state.pipes||[]).forEach(p=>{\n    if(p.liq && p.size) usedKeys.add(`${p.liq}/${p.size}`);\n  });\n\n  // If no pipes drawn yet, show all sizes as a guide\n  const showAll = usedKeys.size === 0;\n\n  const rows = PIPE_SIZE_ORDER.filter(ps=>\n    showAll || usedKeys.has(`${ps.liq}/${ps.suc}`)\n  );\n\n  // Also add any used sizes not in PIPE_SIZE_ORDER (safety net)\n  (state.pipes||[]).forEach(p=>{\n    const key = `${p.liq}/${p.size}`;\n    if(!PIPE_SIZE_ORDER.some(ps=>`${ps.liq}/${ps.suc}`===key)){\n      rows.push({liq:p.liq, suc:p.size, col:p.col||'#06b6d4', lw:3});\n    }\n  });\n\n  container.innerHTML = rows.map(ps=>`\n    <div style=\"display:flex;align-items:center;gap:9px\">\n      <div style=\"width:30px;height:${ps.lw}px;background:${ps.col};border-radius:1px;flex-shrink:0\"><\u002Fdiv>\n      <span style=\"font-family:var(--ssx-mono);font-size:11px;color:var(--ssx-text)\">${fmtPipePair(ps.liq, ps.suc)}<\u002Fspan>\n    <\u002Fdiv>`).join('');\n\n  // Show a subtle note if filtered\n  if(!showAll && usedKeys.size > 0){\n    container.innerHTML += `<div style=\"font-size:9px;color:var(--ssx-faint);margin-top:3px\">Showing used sizes only<\u002Fdiv>`;\n  }\n}\n// Source: AIRAH feedback, aircon24.com.au, airandwater.com.au (145 W/m² apprenticeship standard)\n// Residential = homes/apartments. Light commercial = offices/retail. Commercial = high occupancy.\nconst CLIMATE_ZONES = {\n  1: {\n    label: 'Zone 1 — High humidity, warm winter',\n    cities: 'Darwin, Broome, Cairns, Katherine',\n    residential: 185, light_commercial: 205, commercial: 220,\n    note: 'Tropical. Continuous high humidity means latent load is significant — size conservatively.',\n  },\n  2: {\n    label: 'Zone 2 — Warm humid summer, mild winter',\n    cities: 'Brisbane, Gold Coast, Townsville, Sunshine Coast',\n    residential: 160, light_commercial: 180, commercial: 195,\n    note: 'Subtropical. High summer humidity adds to sensible load. Cooling dominates.',\n  },\n  3: {\n    label: 'Zone 3 — Hot dry summer, warm winter',\n    cities: 'Alice Springs, Tennant Creek, Geraldton',\n    residential: 165, light_commercial: 185, commercial: 200,\n    note: 'Arid interior. Very high peak temperatures but low humidity. Good insulation pays off.',\n  },\n  4: {\n    label: 'Zone 4 — Hot dry summer, cool winter',\n    cities: 'Broken Hill, Dubbo, Mildura, Griffith',\n    residential: 150, light_commercial: 170, commercial: 185,\n    note: 'Continental. Both cooling and heating matter — verify heating is not the design condition.',\n  },\n  5: {\n    label: 'Zone 5 — Warm temperate',\n    cities: 'Sydney, Perth, Adelaide, Newcastle, Wollongong',\n    residential: 145, light_commercial: 160, commercial: 175,\n    note: 'Standard Australian rule-of-thumb zone. 145 W/m² is the refrigeration apprenticeship standard.',\n  },\n  6: {\n    label: 'Zone 6 — Mild temperate',\n    cities: 'Melbourne, Geelong, Canberra',\n    residential: 130, light_commercial: 145, commercial: 160,\n    note: 'Heating often governs in Zone 6. Check heating capacity at min ambient before finalising.',\n  },\n  7: {\n    label: 'Zone 7 — Cool temperate',\n    cities: 'Hobart, Orange, Ballarat, Armidale',\n    residential: 120, light_commercial: 133, commercial: 145,\n    note: 'Heating-dominated. Size on heating output — cooling capacity at +35°C is secondary.',\n  },\n  8: {\n    label: 'Zone 8 — Alpine',\n    cities: 'Mt Hotham, Thredbo, Falls Creek',\n    residential: 110, light_commercial: 123, commercial: 135,\n    note: 'Extreme heating loads. Verify low-ambient heating performance of selected ODU.',\n  },\n};\n\nfunction getBaseWm2(){\n  if(state.settings.baseWm2Override) return state.settings.baseWm2Override;\n  const z = CLIMATE_ZONES[state.settings.climateZone] || CLIMATE_ZONES[5];\n  return z[state.settings.buildingType] || z.residential;\n}\n\nfunction calcHeatLoad(room){\n  const baseW = getBaseWm2();\n  const glassMult  = {low:0.80, moderate:1.0, high:1.24}[room.glass||'moderate'] || 1;\n  const condMult   = {well_insulated:0.85, standard:1.0, poor:1.2}[room.condition||'standard'] || 1;\n  const heightMult = (room.height||2.4) > 2.7 ? 1.1 : 1;\n  const orientMult = room.partyWall ? 1.0\n    : (room.externalWalls && room.externalWalls.length === 0) ? 1.0\n    : (ORIENT_MULT[room.orientation||'N'] || 1.0);\n  const area = (room.width||4) * (room.length||5);\n  return Math.round(area * baseW * glassMult * condMult * heightMult * orientMult) / 1000;\n}\n\nfunction openSettings(){\n  const m = document.getElementById('settings-modal');\n  if(!m) return;\n  // Sync UI to current state\n  const s = state.settings;\n  document.getElementById('settings-climate').value = s.climateZone;\n  document.querySelectorAll('input[name=\"settings-btype\"]').forEach(r => r.checked = r.value === s.buildingType);\n  document.getElementById('settings-wm2-override').value = s.baseWm2Override || '';\n  document.getElementById('settings-glass').value = s.defaultGlass;\n  document.getElementById('settings-condition').value = s.defaultCondition;\n  document.getElementById('settings-height').value = s.defaultHeight;\n  settingsRefreshDisplay();\n  m.classList.remove('closing'); m.classList.add('show');\n}\n\nfunction closeSettings(){\n  _modalClose(document.getElementById('settings-modal'));\n  triggerAutoSave?.();\n}\n\nfunction settingsUpdateClimate(val){\n  state.settings.climateZone = parseInt(val);\n  settingsRefreshDisplay();\n}\n\nfunction settingsUpdateBtype(val){\n  state.settings.buildingType = val;\n  settingsRefreshDisplay();\n}\n\nfunction settingsOverrideWm2(val){\n  const n = parseFloat(val);\n  state.settings.baseWm2Override = (n > 0) ? n : null;\n  settingsRefreshDisplay();\n}\n\nfunction settingsClearOverride(){\n  state.settings.baseWm2Override = null;\n  document.getElementById('settings-wm2-override').value = '';\n  settingsRefreshDisplay();\n}\n\nfunction settingsRefreshDisplay(){\n  const z = CLIMATE_ZONES[state.settings.climateZone] || CLIMATE_ZONES[5];\n  const recommended = z[state.settings.buildingType] || z.residential;\n  const active = state.settings.baseWm2Override || recommended;\n\n  document.getElementById('settings-wm2-display').textContent = active + ' W/m²';\n  document.getElementById('settings-zone-desc').innerHTML =\n    `<strong>${z.cities}<\u002Fstrong> — ${z.note}`;\n  document.getElementById('settings-wm2-note').innerHTML = state.settings.baseWm2Override\n    ? `<span style=\"color:var(--ssx-warn)\">⚠ Manual override active — recommended is <strong>${recommended} W/m²<\u002Fstrong><\u002Fspan>`\n    : `Residential ${z.residential} · Light commercial ${z.light_commercial} · Commercial ${z.commercial} W/m²`;\n\n  // Highlight active building type label\n  ['residential','light_commercial','commercial'].forEach(t => {\n    const el = document.getElementById('btype-' + (t==='light_commercial'?'light':t));\n    if(el) el.style.borderColor = (t === state.settings.buildingType) ? 'var(--ssx-accent)' : 'var(--ssx-border)';\n    if(el) el.style.background  = (t === state.settings.buildingType) ? 'var(--ssx-accent-bg)' : '';\n  });\n}\n// ── Orientation solar gain multipliers (Australian practice) ──────────\n// Applied to cooling load on top of glazing and condition factors.\n// Primary exposed wall = longest exterior wall of the room polygon.\nconst ORIENT_MULT = {\n  'N':  1.00,  // North — low summer angle, good eave shading possible\n  'NE': 1.10,  // North-east — morning sun, moderate\n  'E':  1.15,  // East — morning sun, less intense but sustained\n  'SE': 0.95,  // South-east — mostly diffuse, limited direct sun\n  'S':  0.85,  // South — minimal direct sun year-round (Southern Hemisphere)\n  'SW': 1.15,  // South-west — afternoon sun, moderate\n  'W':  1.30,  // West — worst: low-angle afternoon sun at peak heat\n  'NW': 1.20,  // North-west — afternoon sun, significant\n};\n\nconst ORIENT_LABELS = {\n  'N':'North','NE':'North-East','E':'East','SE':'South-East',\n  'S':'South','SW':'South-West','W':'West','NW':'North-West',\n};\n\n// Convert bearing (degrees CW from north) to 8-point compass label\nfunction bearingToCompass(deg){\n  deg = ((deg % 360) + 360) % 360;\n  return ['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8];\n}\n\n// Get outward bearing of a polygon's longest edge relative to true north.\n// Where multiple edges are similar in length, picks the most sun-exposed face\n// (avoids selecting a south-facing wall when a north-facing wall is the same length).\nfunction primaryWallBearing(polygon){\n  const pts = polygon.points;\n  if(!pts || pts.length < 3) return null;\n  const nb = state.northArrow ? state.northArrow.bearing : 0;\n\n  // Centroid\n  let cx=0, cy=0;\n  pts.forEach(p=>{cx+=p.x; cy+=p.y;});\n  cx/=pts.length; cy/=pts.length;\n\n  // Score each edge: outward bearing + solar exposure rank\n  // Higher score = more likely to be the primary sun-exposed face\n  const solarRank = {'W':6,'NW':5,'N':4,'NE':3,'E':2,'SE':1,'S':0,'SW':1};\n\n  let maxLen=0;\n  // First pass: find max edge length\n  for(let i=0;i<pts.length;i++){\n    const a=pts[i], b=pts[(i+1)%pts.length];\n    const len=Math.hypot(b.x-a.x, b.y-a.y);\n    if(len>maxLen) maxLen=len;\n  }\n\n  // Second pass: among edges within 15% of longest, pick by solar rank\n  let bestNormal=null, bestScore=-1;\n  for(let i=0;i<pts.length;i++){\n    const a=pts[i], b=pts[(i+1)%pts.length];\n    const dx=b.x-a.x, dy=b.y-a.y;\n    const len=Math.hypot(dx,dy);\n    if(len < maxLen*0.85) continue; // skip significantly shorter edges\n\n    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;\n    const n1={x:-dy,y:dx}, n2={x:dy,y:-dx};\n    const tx=mx-cx, ty=my-cy;\n    const outward = (n1.x*tx+n1.y*ty > 0) ? n1 : n2;\n\n    // Compute compass direction of this face\n    const planAngle = Math.atan2(outward.x, -outward.y)*180/Math.PI;\n    const bearing   = ((planAngle - nb) % 360 + 360) % 360;\n    const compass   = ['N','NE','E','SE','S','SW','W','NW'][Math.round(bearing/45)%8];\n\n    // Score = length (primary) + solar rank (tiebreaker)\n    const score = len + (solarRank[compass]||0)*0.01;\n    if(score > bestScore){ bestScore=score; bestNormal=outward; }\n  }\n\n  if(!bestNormal) return null;\n  const planAngle = Math.atan2(bestNormal.x, -bestNormal.y)*180/Math.PI;\n  return ((planAngle - nb) % 360 + 360) % 360;\n}\n\n// Re-detect all room orientations when north arrow moves (skip locked rooms)\nfunction autoDetectOrientations(){\n  state.rooms.forEach(room=>{\n    if(room.orientationLocked) return;\n    const poly = state.polygons.find(p=>p.roomId===room.id);\n    if(!poly) return;\n    const b = primaryWallBearing(poly);\n    if(b !== null) room.orientation = bearingToCompass(b);\n  });\n}\n\n// Point-in-polygon test (ray casting) — used for room hover detection\nfunction pointInPoly(px, py, pts){\n  let inside=false;\n  for(let i=0,j=pts.length-1;i<pts.length;j=i++){\n    const xi=pts[i].x,yi=pts[i].y,xj=pts[j].x,yj=pts[j].y;\n    if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;\n  }\n  return inside;\n}\n\n// Colours NEVER clash with:\n//   System colours:   indigo #4f46e5 · orange #e05c00 · green #059669 · blue #0284c7 · purple #9333ea\n//   Room boundaries:  amber  #f59e0b (all rooms fixed to this one colour)\n// Pipe weight increases with pipe size — thicker = bigger pipe.\nconst PIPE_SIZES = {\n  'sm': { liq:6.35,  suc:12.7,  col:'#06b6d4', lw:4, label:'6.35 / 12.7 mm',   name:'Small'   },  // cyan\n  'md': { liq:9.52,  suc:15.88, col:'#dc2626', lw:5, label:'9.52 / 15.88 mm',  name:'Medium'  },  // red\n  'lg': { liq:12.7,  suc:19.05, col:'#65a30d', lw:6, label:'12.7 / 19.05 mm',  name:'Large'   },  // lime\n  'xl': { liq:15.88, suc:22.2,  col:'#c026d3', lw:8, label:'15.88 / 22.2 mm',  name:'X-Large' },  // magenta\n};\n\nfunction getPipeSize(kw) {\n  if(!kw || kw<=0) return PIPE_SIZES.sm;\n  if(kw<=5.6)  return PIPE_SIZES.sm;   // cyan   ≤5.6 kW  · 6.35 / 12.7\n  if(kw<=14)   return PIPE_SIZES.md;   // red    ≤14 kW   · 9.52 / 15.88\n  if(kw<=33.5) return PIPE_SIZES.lg;   // lime   ≤33.5 kW · 12.7 / 19.05\n  return             PIPE_SIZES.xl;    // brown  >33.5 kW · 15.88 / 22.2\n}\n\n// ── BC CONTROLLER DATA (Branch Circuit controllers — CMB-P series) ──\n// Used with advanced indoor unit types (cassettes, wall-mounts, etc.)\n// One main pipe in from ODU; multiple pipes out to indoor units.\n// Dimensions in mm. Source: City Multi Brochure 2019, pp.107-108.\nconst BC_DATA = [\n  { model:'CMB-P104V-J',  branches:4,  maxKw:40,  w:911, d:495, h:246, label:'BC 4-port' },\n  { model:'CMB-P106V-J',  branches:6,  maxKw:60,  w:911, d:495, h:246, label:'BC 6-port' },\n  { model:'CMB-P108V-J',  branches:8,  maxKw:80,  w:911, d:495, h:246, label:'BC 8-port' },\n  { model:'CMB-P1012V-J', branches:12, maxKw:120, w:911, d:495, h:246, label:'BC 12-port' },\n  { model:'CMB-P1016V-J', branches:16, maxKw:160, w:911, d:495, h:246, label:'BC 16-port' },\n];\n\n// Unit types that require a BC Controller (advanced — not standard PEFY ducted)\nconst ADVANCED_IDU_TYPES = new Set([\n  'CASS4','CASS1','PLA','PKFY','CEIL','PCFY','PEAD','SEZ','FLOOR','MFZ','WALL',\n  'VEM','VFM','VLMD','VBM','VMR','VMS1','VMA3','VMHSF','VMHF','PFKY',\n]);\n\nfunction selectBCBox(branches){\n  // Pick the smallest BC that fits the required port count\n  return BC_DATA.find(b=>b.branches>=branches) || BC_DATA[BC_DATA.length-1];\n}\n// ═══════════════════════════════════════════════\nfunction goStep(n) {\n  state.step = n;\n  // Panels are panel-0 (Home) … panel-4, indexed 0-4 matching step number directly\n  // Liquid crossfade: outgoing panel gets .leaving and animates out while incoming animates in.\n  document.querySelectorAll('.panel').forEach((p,i)=>{\n    if(i===n){\n      p.classList.remove('leaving');\n      // restart entrance animation cleanly even if re-entering same panel\n      p.classList.remove('active'); void p.offsetWidth; p.classList.add('active');\n    } else if(p.classList.contains('active')){\n      p.classList.remove('active');\n      p.classList.add('leaving');\n      const end=()=>{ p.classList.remove('leaving'); p.removeEventListener('animationend',end); };\n      p.addEventListener('animationend',end);\n      setTimeout(end,620); // fallback in case animationend doesn't fire\n    } else {\n      p.classList.remove('leaving');\n    }\n  });\n  document.querySelectorAll('.step-btn').forEach((b,i)=>{\n    b.classList.remove('active','done');\n    b.style.removeProperty('background');\n    if(i===n){ b.classList.add('active'); b.style.setProperty('background','rgba(249,115,22,.12)','important'); }\n    else if(i<n){ b.classList.add('done'); b.style.setProperty('background','rgba(5,150,105,.13)','important'); }\n  });\n  if(n===2) initDesignCanvas();\n  if(n===3) renderMaterials();\n  // Show Materials CTA in step bar only when on the Design step\n  const matBtn = document.getElementById('steps-materials-btn');\n  if(matBtn) matBtn.style.display = (n===2) ? 'flex' : 'none';\n}\n\n// ═══════════════════════════════════════════════\n// MODE CHOOSER\n// ═══════════════════════════════════════════════\n// Restart a CSS entrance animation on an element (premium step transitions)\nfunction animateIn(el){\n  if(!el) return;\n  el.classList.remove('anim-in');\n  void el.offsetWidth; // force reflow so the animation replays\n  el.classList.add('anim-in');\n}\nstate.mode = null; // 'upload' | 'noplans'\nstate.noPlansCanvasMode = 'blank'; // 'blank' | 'skip'\n\nfunction chooseModeUpload() {\n  state.mode = 'upload';\n  window._addMoreMode = false; // first upload replaces; only the Add-file button appends\n  document.getElementById('mode-chooser').style.display = 'none';\n  document.getElementById('upload-path').style.display = 'block';\n  document.getElementById('noplans-path').style.display = 'none';\n  animateIn(document.getElementById('upload-path'));\n}\n\nfunction chooseModeNoPlans() {\n  state.mode = 'noplans';\n  document.getElementById('mode-chooser').style.display = 'none';\n  document.getElementById('noplans-path').style.display = 'block';\n  document.getElementById('upload-path').style.display = 'none';\n  animateIn(document.getElementById('noplans-path'));\n  // Pre-seed Ground Floor if nothing added yet\n  if(state.floors.length === 0) addNoPlansFloor();\n  renderNoPlansFloorList();\n}\n\nfunction resetModeChoice() {\n  state.mode = null;\n  document.getElementById('mode-chooser').style.display = 'block';\n  const uc=document.getElementById('upload-card'); if(uc) uc.style.display='block';\n  document.getElementById('upload-path').style.display = 'none';\n  document.getElementById('noplans-path').style.display = 'none';\n  _modalClose(document.getElementById('page-picker-modal'));\n}\n\nfunction addNoPlansFloor() {\n  const n = state.floors.length;\n  // First floor always Ground, subsequent floors auto-named Level 1, 2 etc.\n  const autoNames = ['Ground floor', 'Level 1', 'Level 2', 'Level 3', 'Level 4', 'Roof'];\n  const name = n === 0 ? 'Ground floor' : (autoNames[n] || `Level ${n}`);\n  state.floors.push({id: Date.now(), name, imageData: null, pageIndex: -1});\n  renderNoPlansFloorList();\n}\n\n// Floor level icons — clearly readable labels instead of F1/F2\nfunction floorIcon(i, name) {\n  const n = name.toLowerCase();\n  // Pick an icon based on the floor name\n  if(n.includes('roof') || n.includes('rooftop')) {\n    return `<svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" width=\"18\" height=\"18\"><path d=\"M3 10 L10 3 L17 10\"/><rect x=\"7\" y=\"13\" width=\"6\" height=\"7\" rx=\"1\"/><\u002Fsvg>`;\n  }\n  if(n.includes('basement') || n.includes('lower') || n.includes('b1') || n.includes('b2')) {\n    return `<svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" width=\"18\" height=\"18\"><rect x=\"2\" y=\"5\" width=\"16\" height=\"10\" rx=\"1\"/><path d=\"M6 15v3M14 15v3M2 9h16\"/><\u002Fsvg>`;\n  }\n  if(i === 0 || n.includes('ground') || n.includes('gf') || n.includes('g/f')) {\n    // Ground floor — building base icon\n    return `<svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" width=\"18\" height=\"18\"><rect x=\"3\" y=\"8\" width=\"14\" height=\"10\" rx=\"1\"/><path d=\"M1 18h18M7 18v-5h6v5\"/><path d=\"M6 8V6a4 4 0 0 1 8 0v2\"/><\u002Fsvg>`;\n  }\n  // Upper floors — stacked layers with level number\n  const levelNum = i; // Level 1 = index 1\n  return `<svg viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" width=\"18\" height=\"18\"><rect x=\"2\" y=\"12\" width=\"16\" height=\"4\" rx=\"1\"/><rect x=\"4\" y=\"8\" width=\"12\" height=\"4\" rx=\"1\"/><text x=\"10\" y=\"7\" text-anchor=\"middle\" font-size=\"6\" font-weight=\"800\" font-family=\"IBM Plex Mono,monospace\" fill=\"currentColor\" stroke=\"none\">${levelNum}<\u002Ftext><\u002Fsvg>`;\n}\n\nfunction renderNoPlansFloorList() {\n  const list = document.getElementById('noplans-floor-list');\n  if(!list) return;\n  // Always start with at least Ground floor\n  if(state.floors.length === 0) addNoPlansFloor();\n  list.innerHTML = '';\n  state.floors.forEach((floor, i) => {\n    const row = document.createElement('div');\n    row.className = 'floor-item';\n    row.style.alignItems = 'center';\n    row.innerHTML = `\n      <div style=\"width:38px;height:38px;background:var(--ssx-accent-bg);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ssx-accent);\">\n        ${floorIcon(i, floor.name)}\n      <\u002Fdiv>\n      <input class=\"floor-name-input\" value=\"${floor.name}\" oninput=\"state.floors[${i}].name=this.value;renderNoPlansFloorList()\" placeholder=\"Floor name\">\n      ${state.floors.length > 1\n        ? `<button class=\"btn btn-icon btn-danger btn-sm\" onclick=\"state.floors.splice(${i},1);renderNoPlansFloorList()\" title=\"Remove floor\">\n             <svg viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" width=\"12\" height=\"12\"><path d=\"M2 2l10 10M12 2L2 12\"/><\u002Fsvg>\n           <\u002Fbutton>`\n        : `<div style=\"width:32px\"><\u002Fdiv>`}\n    `;\n    list.appendChild(row);\n  });\n}\n\nfunction confirmNoPlans() {\n  if(state.floors.length === 0) { notify('Add at least one floor level', 'warn'); return; }\n  // Step 3 label update based on canvas mode\n  const step3btn = document.getElementById('step3-btn');\n  if(state.noPlansCanvasMode === 'skip') {\n    step3btn.style.opacity = '0.4';\n    step3btn.title = 'Skipped — no floor plans';\n  }\n  notify(`${state.floors.length} floor${state.floors.length>1?'s':''} set up · no plans mode`, 'ok');\n  goStep(2);\n}\n\n// ═══════════════════════════════════════════════\n// UPLOAD & PDF HANDLING\n// ═══════════════════════════════════════════════\nfunction handleDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag')}\nfunction handleDrop(e){e.preventDefault();e.currentTarget.classList.remove('drag');const fs=[...e.dataTransfer.files];if(fs.length)processFiles(fs)}\nfunction handleFileSelect(e){const fs=[...e.target.files];if(fs.length)processFiles(fs);e.target.value='';}\n\n// Upload a plan for a specific floor from within the canvas step\nfunction handleCanvasFloorUpload(e){\n  const f=e.target.files[0];\n  if(!f) return;\n  const reader=new FileReader();\n  reader.onload=ev=>{\n    if(!state.floors[state.activeFloor]) return;\n    state.floors[state.activeFloor].imageData = ev.target.result;\n    loadFloorImage();\n    notify(`Plan loaded for ${state.floors[state.activeFloor].name}`,'ok');\n  };\n  reader.readAsDataURL(f);\n}\n\nasync function processFiles(files){\n  // Each upload (or \"Add file\") opens a FRESH picker showing only THIS batch's pages.\n  // Already-imported floors live in state.floors and are preserved; on Import we either\n  // replace them (first upload) or append to them (Add file).\n  const addMore = !!window._addMoreMode || (state.floors && state.floors.length > 0);\n  window._addMoreMode = false; // consume flag\n  window._pickerAppendFloors = addMore;\n  openPagePicker();\n\n  // Loading feedback inside the picker so it's never silent\n  const statusBar=document.getElementById('ai-status-bar');\n  const statusText=document.getElementById('ai-status-text');\n  const statusSpin=document.getElementById('ai-status-spinner');\n  const statusCount=document.getElementById('ai-status-count');\n  const fileNames=files.map(f=>f.name).join(', ');\n  if(statusBar) statusBar.style.display='flex';\n  if(statusSpin) statusSpin.style.display='block';\n  if(statusText) statusText.textContent = `Reading ${fileNames}…`;\n  if(statusCount) statusCount.textContent='';\n\n  let added=0;\n  for(const file of files){\n    if(file.type==='application/pdf'){\n      // First file in the batch clears the grid (append=false); extras append within the batch\n      added += await loadPDF(file, added>0);\n    } else if(file.type.startsWith('image/')){\n      added += await loadImagePage(file, added>0) ? 1 : 0;\n    }\n  }\n\n  if(statusBar) statusBar.style.display='none';\n  if(statusText) statusText.textContent='';\n\n  if(added){\n    dedupePageLabels();\n    updatePageCount();\n    const sub=document.querySelector('#page-picker-modal .pp-sub');\n    if(sub) sub.textContent = addMore\n      ? `Adding to your design — pick the pages from ${fileNames} to import.`\n      : 'Pick the floor-plan pages to import. Hover a page to preview it full size.';\n  } else {\n    cancelPagePicker();\n    notify('Could not read that file','warn');\n  }\n}\n\n// Back-compat single-file entry\nfunction processFile(file){ return processFiles([file]); }\n\n// Add a raster image as one selectable page\nfunction loadImagePage(file, append){\n  return new Promise(res=>{\n    const reader=new FileReader();\n    reader.onload=e=>{\n      const img=new Image();\n      img.onload=()=>{\n        if(!append){ window._pdfPages=[]; window._pdfPageLabels=[]; window._pdfPageFiles=[]; document.getElementById('page-grid').innerHTML=''; }\n        const label=(file.name||'').replace(/\\.[^.]+$/,'').slice(0,40) || `Page ${window._pdfPages.length+1}`;\n        // Thumbnail canvas\n        const tw=320, th=Math.round(tw*img.height/img.width);\n        const tc=document.createElement('canvas'); tc.width=tw; tc.height=th;\n        tc.getContext('2d').drawImage(img,0,0,tw,th);\n        appendPageThumb(e.target.result, tc, label, file.name||'Image');\n        res(true);\n      };\n      img.onerror=()=>res(false);\n      img.src=e.target.result;\n    };\n    reader.readAsDataURL(file);\n  });\n}\n\nasync function loadPDF(file, append) {\n  if(!window.pdfjsLib) {\n    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');\n    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';\n  }\n  const arrayBuffer=await file.arrayBuffer();\n  const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;\n  const numPages=pdf.numPages;\n  notify(`PDF loaded · ${numPages} pages`);\n\n  const grid=document.getElementById('page-grid');\n  openPagePicker();\n  // Token guards against a second upload racing this one and double-appending thumbs\n  window._pdfLoadToken=(window._pdfLoadToken||0)+1;\n  const _tok=window._pdfLoadToken;\n\n  if(!append){\n    window._pdfPages=[];\n    window._pdfPageLabels=[];\n    window._pdfPageFiles=[];\n    grid.innerHTML='';\n  }\n  if(!window._pdfPages) window._pdfPages=[];\n  if(!window._pdfPageLabels) window._pdfPageLabels=[];\n  if(!window._pdfPageFiles) window._pdfPageFiles=[];\n\n  for(let i=1;i<=numPages;i++){\n    if(_tok!==window._pdfLoadToken) return i-1;\n    const page=await pdf.getPage(i);\n\n    // Extract text to try to read sheet title
